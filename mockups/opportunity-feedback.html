<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager-Sicht — Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style> * { box-sizing: border-box; } body { margin: 0; } </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/htm/dist/htm.umd.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: h, useState, useCallback, useMemo } = React;
    const { createRoot } = ReactDOM;
    const { Box, Typography, Button, Paper, Container, Stack,
            Table, TableHead, TableBody, TableRow, TableCell, TableContainer,
            TextField, MenuItem, IconButton, Tooltip, Checkbox,
            Dialog, DialogTitle, DialogContent, DialogActions,
            ToggleButtonGroup, ToggleButton,
            ThemeProvider, createTheme, CssBaseline } = MaterialUI;

    const html = htm.bind(h);

    const theme = createTheme({
      palette: { primary: { main: '#1976D2' }, error: { main: '#E53935' } },
      components: { MuiButton: { defaultProps: { disableElevation: true } } },
    });

    /* ── Config ──────────────────────────────────────────────── */
    const STATUS_CFG = {
      ausstehend: { label: 'Ausstehend', bgcolor: '#FAEEDA', color: '#854F0B' },
      in_review:  { label: 'In Prüfung', bgcolor: '#E6F1FB', color: '#0C447C' },
      approved:   { label: 'Genehmigt',  bgcolor: '#E1F5EE', color: '#0F6E56' },
      rejected:   { label: 'Abgelehnt',  bgcolor: '#FCEBEB', color: '#791F1F' },
    };

    const POOL_CFG = {
      direct:  { dot: '#2E7D32', label: 'Sofort'  },
      soon:    { dot: '#E65100', label: 'Bald'    },
      partial: { dot: '#B71C1C', label: 'Teilw.'  },
    };

    const OPPS = [
      'Backend-Projekt Datenmigration',
      'Container Plattform Initiative',
      'Business Analysten IT-Consulting',
    ];

    /* ── Data ────────────────────────────────────────────────── */
    const INITIAL_PROPOSALS = [
      // ausstehend — älteste zuerst
      { id:1, employee:'Max Mustermann',  initials:'MM',  color:'#1976D2', role:'Senior Consultant',    opportunity:'Backend-Projekt Datenmigration',   client:'Hypoteq AG',          startDate:'2026-07-01', endDate:'2026-12-31', score:80, pool:'direct',  status:'ausstehend', comment:null,                                createdAt:'2026-04-15' },
      { id:3, employee:'David Klein',     initials:'DK',  color:'#37474F', role:'Backend Developer',    opportunity:'Backend-Projekt Datenmigration',   client:'Hypoteq AG',          startDate:'2026-07-01', endDate:'2026-12-31', score:83, pool:'direct',  status:'ausstehend', comment:null,                                createdAt:'2026-04-15' },
      { id:5, employee:'Thomas Berger',   initials:'TB',  color:'#7B1FA2', role:'Senior Consultant',    opportunity:'Container Plattform Initiative',   client:'Reply GmbH',          startDate:'2026-07-15', endDate:'2027-01-31', score:78, pool:'soon',    status:'ausstehend', comment:null,                                createdAt:'2026-04-18' },
      { id:7, employee:'Sarah Braun',     initials:'SB',  color:'#E65100', role:'Consultant',           opportunity:'Business Analysten IT-Consulting', client:'IPSWAYS / Insurance', startDate:'2026-08-01', endDate:'2026-12-31', score:65, pool:'direct',  status:'ausstehend', comment:null,                                createdAt:'2026-04-20' },
      { id:8, employee:'Julia Neumann',   initials:'JN',  color:'#6A1B9A', role:'Senior Consultant',    opportunity:'Business Analysten IT-Consulting', client:'IPSWAYS / Insurance', startDate:'2026-08-01', endDate:'2026-12-31', score:77, pool:'direct',  status:'ausstehend', comment:null,                                createdAt:'2026-04-20' },
      // in_review
      { id:2, employee:'Sandra Koch',     initials:'SK',  color:'#388E3C', role:'Consultant',           opportunity:'Backend-Projekt Datenmigration',   client:'Hypoteq AG',          startDate:'2026-07-01', endDate:'2026-12-31', score:84, pool:'direct',  status:'in_review',  comment:'Spreche noch mit ihr.',             createdAt:'2026-04-15' },
      { id:6, employee:'Felix Weber',     initials:'FW',  color:'#F57C00', role:'Consultant',           opportunity:'Container Plattform Initiative',   client:'Reply GmbH',          startDate:'2026-07-15', endDate:'2027-01-31', score:69, pool:'partial', status:'in_review',  comment:'Prüfe die Verfügbarkeit noch ab.',  createdAt:'2026-04-18' },
      // approved
      { id:4, employee:'Tobias Schulz',   initials:'TS',  color:'#558B2F', role:'Backend Developer',    opportunity:'Backend-Projekt Datenmigration',   client:'Hypoteq AG',          startDate:'2026-07-01', endDate:'2026-12-31', score:68, pool:'direct',  status:'approved',   comment:'Passt gut, sofort einsetzbar.',     createdAt:'2026-04-15' },
    ];

    const INITIAL_AUDIT = [
      { ts:'heute, 09:14',   actor:'Anna Schmidt', employee:'Felix Weber',   opp:'Container Plattform Initiative',   from:'ausstehend', to:'in_review',  comment:'Prüfe die Verfügbarkeit noch ab.' },
      { ts:'gestern, 14:35', actor:'Anna Schmidt', employee:'Sandra Koch',   opp:'Backend-Projekt Datenmigration',   from:'ausstehend', to:'in_review',  comment:'Spreche noch mit ihr.' },
      { ts:'gestern, 14:30', actor:'Anna Schmidt', employee:'Tobias Schulz', opp:'Backend-Projekt Datenmigration',   from:'ausstehend', to:'approved',   comment:'Passt gut, sofort einsetzbar.' },
    ];

    /* ── Helpers ─────────────────────────────────────────────── */
    function fmtDate(iso) {
      return new Date(iso + 'T00:00:00').toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'2-digit' });
    }

    function statusKey(label) {
      return Object.keys(STATUS_CFG).find(k => STATUS_CFG[k].label === label);
    }

    /* ── Components ──────────────────────────────────────────── */
    function MockupBar() {
      return html`
        <${Paper} square elevation=${0} sx=${{
          position:'sticky', top:0, zIndex:1100,
          borderBottom:'1px solid', borderColor:'divider',
          px:4, py:1.25, display:'flex', alignItems:'center', justifyContent:'space-between',
        }}>
          <${Typography} variant="overline" color="text.secondary">
            Mockup · <${Box} component="span" sx=${{ color:'primary.main' }}>Manager-Sicht<//> — Zu bewerten
          <//>
          <${Button} component="a" href="../index.html" size="small">← Katalog<//>
        <//>
      `;
    }

    function Avatar({ initials, color, size=36 }) {
      return html`
        <${Box} sx=${{
          width:size, height:size, borderRadius:'50%', bgcolor:color, color:'#fff',
          fontWeight:700, fontSize:(size*0.38)+'px', flexShrink:0,
          display:'flex', alignItems:'center', justifyContent:'center',
        }}>${initials}<//>
      `;
    }

    function StatusPill({ status, comment }) {
      const cfg = STATUS_CFG[status] || STATUS_CFG.ausstehend;
      const pill = html`
        <${Box} sx=${{
          display:'inline-flex', alignItems:'center', gap:0.5,
          bgcolor:cfg.bgcolor, color:cfg.color,
          px:1.25, py:0.25, borderRadius:'12px',
          fontSize:'11px', fontWeight:700, textTransform:'uppercase', letterSpacing:0.4, whiteSpace:'nowrap',
        }}>
          ${cfg.label}${comment ? html` <${Box} component="span" sx=${{ opacity:0.7 }}>ⓘ<//>` : null}
        <//>
      `;
      return comment
        ? html`<${Tooltip} title=${comment} arrow placement="top"><${Box} sx=${{ display:'inline-block', cursor:'help' }}>${pill}<//><//>`
        : pill;
    }

    function ScoreCell({ score, pool }) {
      const color = score >= 80 ? '#2E7D32' : score >= 65 ? '#1976D2' : '#E65100';
      const pc    = POOL_CFG[pool] || POOL_CFG.direct;
      return html`
        <${Stack} spacing=${0.5} sx=${{ minWidth:100 }}>
          <${Stack} direction="row" alignItems="center" gap=${1}>
            <${Box} sx=${{ flex:1, height:5, bgcolor:'#E0E0E0', borderRadius:'3px', overflow:'hidden' }}>
              <${Box} sx=${{ width:score+'%', height:'100%', bgcolor:color, borderRadius:'3px' }} />
            <//>
            <${Typography} variant="caption" fontWeight=${700} sx=${{ color, minWidth:20, textAlign:'right' }}>${score}<//>
          <//>
          <${Stack} direction="row" alignItems="center" gap=${0.5}>
            <${Box} sx=${{ width:7, height:7, borderRadius:'50%', bgcolor:pc.dot, flexShrink:0 }} />
            <${Typography} variant="caption" color="text.secondary" sx=${{ fontSize:'11px' }}>${pc.label}<//>
          <//>
        <//>
      `;
    }

    /* ── Status-Dialog (Einzelbewertung) ─────────────────────── */
    function StatusDialog({ proposal, onSave, onClose }) {
      const [status,  setStatus]  = useState(() => proposal.status === 'ausstehend' ? 'in_review' : proposal.status);
      const [comment, setComment] = useState(proposal.comment || '');
      const MAX = 1000;
      const canSave = status !== proposal.status || comment !== (proposal.comment || '');

      return html`
        <${Dialog} open onClose=${onClose} maxWidth="sm" fullWidth>
          <${DialogTitle} sx=${{ pb:1 }}>
            <${Typography} variant="subtitle1" fontWeight=${700}>${proposal.employee}<//>
            <${Typography} variant="body2" color="text.secondary">${proposal.opportunity}<//>
          <//>
          <${DialogContent}>
            <${Typography} variant="caption" color="text.secondary" sx=${{ display:'block', fontWeight:700, textTransform:'uppercase', letterSpacing:0.5, mb:1 }}>
              Status setzen
            <//>
            <${ToggleButtonGroup}
              value=${status} exclusive size="small" fullWidth
              onChange=${(_, v) => v && setStatus(v)}
              sx=${{ mb:0.5 }}
            >
              <${ToggleButton} value="in_review" sx=${{ flex:1, py:0.625, fontSize:'12px', fontWeight:700, '&.Mui-selected':{ bgcolor:'#E6F1FB', color:'#0C447C', borderColor:'#b3d2f0' } }}>
                In Prüfung
              <//>
              <${ToggleButton} value="approved" sx=${{ flex:1, py:0.625, fontSize:'12px', fontWeight:700, '&.Mui-selected':{ bgcolor:'#E1F5EE', color:'#0F6E56', borderColor:'#b8e6d4' } }}>
                Genehmigen
              <//>
              <${ToggleButton} value="rejected" sx=${{ flex:1, py:0.625, fontSize:'12px', fontWeight:700, '&.Mui-selected':{ bgcolor:'#FCEBEB', color:'#791F1F', borderColor:'#f5c6c6' } }}>
                Ablehnen
              <//>
            <//>
            <${Typography} variant="caption" color="text.disabled" sx=${{ display:'block', mb:2.5, fontStyle:'italic' }}>
              Status „Abgelehnt" ist umkehrbar — zurück auf „In Prüfung" jederzeit möglich.
            <//>
            <${TextField}
              label="Kommentar (optional)" multiline rows=${3} fullWidth size="small"
              value=${comment}
              onChange=${e => setComment(e.target.value.slice(0, MAX))}
              helperText=${comment.length + ' / ' + MAX}
              FormHelperTextProps=${{ sx:{ textAlign:'right' } }}
            />
          <//>
          <${DialogActions} sx=${{ px:3, pb:2.5 }}>
            <${Button} onClick=${onClose} color="inherit">Abbrechen<//>
            <${Button} variant="contained" disabled=${!canSave} onClick=${() => onSave(proposal, status, comment)}>
              Speichern
            <//>
          <//>
        <//>
      `;
    }

    /* ── Bulk-Ablehnen-Dialog ────────────────────────────────── */
    function BulkDialog({ proposals, onConfirm, onClose }) {
      const [comment, setComment] = useState('');
      const MAX = 1000;
      return html`
        <${Dialog} open onClose=${onClose} maxWidth="sm" fullWidth>
          <${DialogTitle}>
            <${Typography} variant="subtitle1" fontWeight=${700}>${proposals.length} Kandidaten ablehnen<//>
          <//>
          <${DialogContent}>
            <${Paper} variant="outlined" sx=${{ mb:2, maxHeight:160, overflowY:'auto' }}>
              ${proposals.map(p => html`
                <${Stack} key=${p.id} direction="row" alignItems="center" gap=${1.25}
                  sx=${{ px:1.5, py:0.875, borderBottom:'1px solid', borderColor:'divider', '&:last-child':{ borderBottom:'none' } }}>
                  <${Avatar} initials=${p.initials} color=${p.color} size=${28} />
                  <${Box}>
                    <${Typography} variant="body2" fontWeight=${500}>${p.employee}<//>
                    <${Typography} variant="caption" color="text.secondary">${p.opportunity}<//>
                  <//>
                <//>
              `)}
            <//>
            <${Box} sx=${{ bgcolor:'#FFF3E0', border:'1px solid #FFCC80', borderRadius:1, px:1.5, py:1, mb:2 }}>
              <${Typography} variant="caption" sx=${{ color:'#E65100' }}>
                ⚠ Individuelle Genehmigungen erfordern eine bewusste Einzel-Entscheidung. Bulk-Aktion nur für Ablehnung verfügbar.
              <//>
            <//>
            <${TextField}
              label="Gemeinsamer Kommentar (optional)" multiline rows=${3} fullWidth size="small"
              value=${comment}
              onChange=${e => setComment(e.target.value.slice(0, MAX))}
              helperText=${comment.length + ' / ' + MAX}
              FormHelperTextProps=${{ sx:{ textAlign:'right' } }}
            />
          <//>
          <${DialogActions} sx=${{ px:3, pb:2.5 }}>
            <${Button} onClick=${onClose} color="inherit">Abbrechen<//>
            <${Button} variant="contained" color="error" onClick=${() => onConfirm(comment)}>
              ${proposals.length} Kandidaten ablehnen
            <//>
          <//>
        <//>
      `;
    }

    /* ── App ─────────────────────────────────────────────────── */
    function App() {
      const [proposals, setProposals] = useState(INITIAL_PROPOSALS);
      const [selected,  setSelected]  = useState(() => new Set());
      const [fStatus,   setFStatus]   = useState('');
      const [fOpp,      setFOpp]      = useState('');
      const [dateFrom,  setDateFrom]  = useState('');
      const [dateTo,    setDateTo]    = useState('');
      const [dialog,    setDialog]    = useState(null);
      const [bulkOpen,  setBulkOpen]  = useState(false);
      const [auditLog,  setAuditLog]  = useState(INITIAL_AUDIT);

      /* Filter & sort: ausstehend (älteste zuerst) → in_review → approved/rejected */
      const filtered = useMemo(() => proposals.filter(p =>
        (!fStatus  || p.status === fStatus) &&
        (!fOpp     || p.opportunity === fOpp) &&
        (!dateFrom || p.startDate >= dateFrom) &&
        (!dateTo   || p.startDate <= dateTo)
      ), [proposals, fStatus, fOpp, dateFrom, dateTo]);

      const sorted = useMemo(() => {
        const pend = filtered.filter(p => p.status === 'ausstehend').sort((a,b) => a.createdAt.localeCompare(b.createdAt));
        const rev  = filtered.filter(p => p.status === 'in_review').sort((a,b)  => a.createdAt.localeCompare(b.createdAt));
        const done = filtered.filter(p => ['approved','rejected'].includes(p.status));
        return [...pend, ...rev, ...done];
      }, [filtered]);

      /* Selection (nur ausstehend + in_review auswählbar) */
      const selectableIds = useMemo(() => sorted.filter(p => ['ausstehend','in_review'].includes(p.status)).map(p => p.id), [sorted]);
      const allSel        = selectableIds.length > 0 && selectableIds.every(id => selected.has(id));
      const someSel       = selectableIds.some(id => selected.has(id));
      const selCount      = [...selected].filter(id => selectableIds.includes(id)).length;

      const toggleOne = useCallback(id => {
        setSelected(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
      }, []);

      const toggleAll = useCallback(() => {
        setSelected(prev => {
          if (selectableIds.every(id => prev.has(id))) {
            const n = new Set(prev); selectableIds.forEach(id => n.delete(id)); return n;
          }
          const n = new Set(prev); selectableIds.forEach(id => n.add(id)); return n;
        });
      }, [selectableIds]);

      /* Einzelbewertung */
      const saveStatus = useCallback((proposal, newStatus, comment) => {
        setProposals(prev => prev.map(p => p.id === proposal.id ? { ...p, status: newStatus, comment: comment || null } : p));
        setAuditLog(prev => [{
          ts: 'gerade eben', actor: 'Anna Schmidt',
          employee: proposal.employee, opp: proposal.opportunity,
          from: proposal.status, to: newStatus,
          comment: comment || null,
        }, ...prev]);
        setDialog(null);
      }, []);

      /* Bulk-Ablehnen */
      const saveBulkReject = useCallback((comment) => {
        const ids      = [...selected].filter(id => selectableIds.includes(id));
        const affected = proposals.filter(p => ids.includes(p.id));
        setProposals(prev => prev.map(p => ids.includes(p.id) ? { ...p, status: 'rejected', comment: comment || null } : p));
        setAuditLog(prev => [
          ...affected.map(p => ({ ts: 'gerade eben', actor: 'Anna Schmidt', employee: p.employee, opp: p.opportunity, from: p.status, to: 'rejected', comment: comment || null })),
          ...prev,
        ]);
        setSelected(new Set());
        setBulkOpen(false);
      }, [selected, selectableIds, proposals]);

      const counts = useMemo(() => ({
        ausstehend: proposals.filter(p => p.status === 'ausstehend').length,
        in_review:  proposals.filter(p => p.status === 'in_review').length,
      }), [proposals]);

      return html`
        <${ThemeProvider} theme=${theme}>
          <${CssBaseline} />
          <${MockupBar} />
          <${Container} maxWidth="lg" sx=${{ py:4 }}>

            <!-- Page header -->
            <${Stack} direction="row" alignItems="center" gap=${2} sx=${{ mb:3 }}>
              <${Box} sx=${{ flex:1 }}>
                <${Typography} variant="h6" fontWeight=${700}>Zu bewerten<//>
                <${Typography} variant="body2" color="text.secondary">
                  Kandidatenvorschläge für Ihre Mitarbeitenden · sortiert: älteste offen zuerst
                <//>
              <//>
              <${Stack} direction="row" gap=${1}>
                ${counts.ausstehend > 0 && html`
                  <${Box} sx=${{ bgcolor:'#FAEEDA', color:'#854F0B', px:1.25, py:0.375, borderRadius:'12px', fontSize:'12px', fontWeight:700 }}>
                    ${counts.ausstehend} ausstehend
                  <//>
                `}
                ${counts.in_review > 0 && html`
                  <${Box} sx=${{ bgcolor:'#E6F1FB', color:'#0C447C', px:1.25, py:0.375, borderRadius:'12px', fontSize:'12px', fontWeight:700 }}>
                    ${counts.in_review} in Prüfung
                  <//>
                `}
              <//>
            <//>

            <!-- Bulk action bar (erscheint bei Auswahl) -->
            ${selCount > 0 && html`
              <${Paper} variant="outlined" sx=${{
                px:2.5, py:1.25, mb:1.5,
                display:'flex', alignItems:'center', gap:2,
                bgcolor:'#FFF8E1', borderColor:'#FFC107',
              }}>
                <${Typography} variant="body2" fontWeight=${600} sx=${{ flex:1 }}>
                  ${selCount} ausgewählt
                <//>
                <${Button} variant="contained" color="error" size="small" onClick=${() => setBulkOpen(true)}>
                  Alle ablehnen
                <//>
                <${Button} variant="text" color="inherit" size="small" onClick=${() => setSelected(new Set())}>
                  Auswahl aufheben
                <//>
              <//>
            `}

            <!-- Filter bar -->
            <${Stack} direction="row" spacing=${1.5} sx=${{ mb:2 }} flexWrap="wrap">
              <${TextField} label="Status" select size="small" value=${fStatus}
                onChange=${e => setFStatus(e.target.value)} sx=${{ minWidth:150 }}>
                <${MenuItem} value="">Status: Alle<//>
                <${MenuItem} value="ausstehend">Ausstehend<//>
                <${MenuItem} value="in_review">In Prüfung<//>
                <${MenuItem} value="approved">Genehmigt<//>
                <${MenuItem} value="rejected">Abgelehnt<//>
              <//>
              <${TextField} label="Opportunity" select size="small" value=${fOpp}
                onChange=${e => setFOpp(e.target.value)} sx=${{ minWidth:230 }}>
                <${MenuItem} value="">Opportunity: Alle<//>
                ${OPPS.map(o => html`<${MenuItem} key=${o} value=${o}>${o}<//>`)}
              <//>
              <${TextField} label="Startdatum ab" type="date" size="small"
                value=${dateFrom} onChange=${e => setDateFrom(e.target.value)}
                InputLabelProps=${{ shrink:true }} sx=${{ minWidth:165 }} />
              <${TextField} label="Bis" type="date" size="small"
                value=${dateTo} onChange=${e => setDateTo(e.target.value)}
                InputLabelProps=${{ shrink:true }} sx=${{ minWidth:150 }} />
            <//>

            <!-- Table -->
            <${TableContainer} component=${Paper} variant="outlined" sx=${{ mb:3 }}>
              <${Table} size="small">
                <${TableHead}>
                  <${TableRow}>
                    <${TableCell} padding="checkbox">
                      <${Checkbox} size="small" checked=${allSel} indeterminate=${someSel && !allSel} onChange=${toggleAll} />
                    <//>
                    ${['Mitarbeiter','Opportunity / Kunde','Zeitraum','Match','Status','Aktion'].map(c => html`
                      <${TableCell} key=${c} sx=${{ fontWeight:700, fontSize:'11px', textTransform:'uppercase', letterSpacing:0.5, color:'text.secondary', whiteSpace:'nowrap' }}>
                        ${c}
                      <//>
                    `)}
                  <//>
                <//>
                <${TableBody}>
                  ${sorted.length === 0 && html`
                    <${TableRow}>
                      <${TableCell} colSpan=${7} sx=${{ textAlign:'center', py:5 }}>
                        <${Typography} variant="body2" color="text.secondary">Keine Einträge für diese Filterauswahl.<//>
                      <//>
                    <//>
                  `}
                  ${sorted.map(p => {
                    const selectable = ['ausstehend','in_review'].includes(p.status);
                    const isDone     = ['approved','rejected'].includes(p.status);
                    return html`
                      <${TableRow} key=${p.id} hover selected=${selected.has(p.id)}
                        sx=${{ opacity: isDone ? 0.72 : 1 }}>

                        <${TableCell} padding="checkbox">
                          <${Checkbox} size="small" checked=${selected.has(p.id)} disabled=${!selectable} onChange=${() => toggleOne(p.id)} />
                        <//>

                        <${TableCell}>
                          <${Stack} direction="row" alignItems="center" gap=${1.25}>
                            <${Avatar} initials=${p.initials} color=${p.color} size=${34} />
                            <${Box}>
                              <${Typography} variant="body2" fontWeight=${600}>${p.employee}<//>
                              <${Typography} variant="caption" color="text.secondary">${p.role}<//>
                            <//>
                          <//>
                        <//>

                        <${TableCell}>
                          <${Typography} variant="body2" fontWeight=${500}>${p.opportunity}<//>
                          <${Typography} variant="caption" color="text.secondary">${p.client}<//>
                        <//>

                        <${TableCell} sx=${{ whiteSpace:'nowrap' }}>
                          <${Typography} variant="body2">${fmtDate(p.startDate)} –<//>
                          <${Typography} variant="body2">${fmtDate(p.endDate)}<//>
                        <//>

                        <${TableCell} sx=${{ minWidth:110 }}>
                          <${ScoreCell} score=${p.score} pool=${p.pool} />
                        <//>

                        <${TableCell}>
                          <${StatusPill} status=${p.status} comment=${p.comment} />
                        <//>

                        <${TableCell} align="right">
                          ${!isDone
                            ? html`<${Button} variant="outlined" size="small" color="inherit" onClick=${() => setDialog(p)} sx=${{ whiteSpace:'nowrap' }}>Bewerten →<//>`
                            : html`<${Button} variant="text" size="small" color="inherit" onClick=${() => setDialog(p)} sx=${{ fontSize:'12px', color:'text.secondary' }}>Ändern<//>` }
                        <//>

                      <//>
                    `;
                  })}
                <//>
              <//>
            <//>

            <!-- Audit-Log -->
            <${Paper} variant="outlined" sx=${{ p:3 }}>
              <${Typography} variant="overline" color="text.secondary" sx=${{ display:'block', borderBottom:'1px solid', borderColor:'divider', pb:1.25, mb:1.5 }}>
                Audit-Log — Statusänderungen
              <//>
              ${auditLog.length === 0 && html`
                <${Typography} variant="body2" color="text.secondary" sx=${{ fontStyle:'italic' }}>Noch keine Statusänderungen.<//>
              `}
              ${auditLog.map((e, i) => {
                const fromCfg = STATUS_CFG[e.from] || {};
                const toCfg   = STATUS_CFG[e.to]   || {};
                return html`
                  <${Stack} key=${i} direction="row" gap=${2}
                    sx=${{ py:1.25, borderBottom: i < auditLog.length-1 ? '1px solid' : 'none', borderColor:'divider' }}>
                    <${Box} sx=${{ width:32, height:32, borderRadius:'50%', bgcolor:'#E3F0FC', color:'#1976D2', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'14px', flexShrink:0 }}>
                      ✎
                    <//>
                    <${Box} sx=${{ flex:1 }}>
                      <${Stack} direction="row" flexWrap="wrap" gap=${0.5} alignItems="center" sx=${{ mb:0.25 }}>
                        <${Typography} variant="body2" fontWeight=${600}>${e.actor}<//>
                        <${Typography} variant="body2" color="text.secondary">·<//>
                        <${Typography} variant="body2" fontWeight=${500}>${e.employee}<//>
                        <${Typography} variant="body2" color="text.secondary">für<//>
                        <${Typography} variant="body2" sx=${{ fontStyle:'italic' }}>${e.opp}<//>
                        <${Box} sx=${{ bgcolor: fromCfg.bgcolor||'#F5F5F5', color: fromCfg.color||'#9E9E9E', px:1, py:0.125, borderRadius:'10px', fontSize:'11px', fontWeight:700 }}>
                          ${fromCfg.label || e.from}
                        <//>
                        <${Typography} variant="body2" color="text.disabled">→<//>
                        <${Box} sx=${{ bgcolor: toCfg.bgcolor||'#F5F5F5', color: toCfg.color||'#9E9E9E', px:1, py:0.125, borderRadius:'10px', fontSize:'11px', fontWeight:700 }}>
                          ${toCfg.label || e.to}
                        <//>
                      <//>
                      ${e.comment && html`
                        <${Box} sx=${{ bgcolor:'#F5F6F8', borderLeft:'3px solid', borderColor:'divider', px:1.5, py:0.75, mt:0.5, borderRadius:'0 4px 4px 0' }}>
                          <${Typography} variant="body2" sx=${{ fontSize:'13px', lineHeight:1.5 }}>${e.comment}<//>
                        <//>
                      `}
                      <${Typography} variant="caption" color="text.disabled" sx=${{ display:'block', mt:0.25 }}>${e.ts}<//>
                    <//>
                  <//>
                `;
              })}
            <//>

          <//>

          ${dialog && html`<${StatusDialog} proposal=${dialog} onSave=${saveStatus} onClose=${() => setDialog(null)} />`}
          ${bulkOpen && html`<${BulkDialog} proposals=${sorted.filter(p => selected.has(p.id))} onConfirm=${saveBulkReject} onClose=${() => setBulkOpen(false)} />`}

        <//>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
