<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback &amp; Transparenz — Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style> * { box-sizing: border-box; } body { margin: 0; } </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/htm/dist/htm.umd.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: h, useState, useCallback } = React;
    const { createRoot } = ReactDOM;
    const { Box, Typography, Button, Paper, Container, Stack, Divider, Table, TableHead, TableBody, TableRow, TableCell, TableContainer, TextField, ThemeProvider, createTheme, CssBaseline } = MaterialUI;

    const html = htm.bind(h);

    const theme = createTheme({
      palette: { primary: { main: '#1976D2' }, error: { main: '#E53935' } },
      components: { MuiButton: { defaultProps: { disableElevation: true } } },
    });

    function MockupBar() {
      return html`
        <${Paper} square elevation=${0} sx=${{
          position: 'sticky', top: 0, zIndex: 1100,
          borderBottom: '1px solid', borderColor: 'divider',
          px: 4, py: 1.25,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <${Typography} variant="overline" color="text.secondary">
            Mockup · <${Box} component="span" sx=${{ color: 'primary.main' }}>Feedback &amp; Transparenz<//>
          <//>
          <${Button} component="a" href="../index.html" size="small">← Katalog<//>
        <//>
      `;
    }

    function StatusBadge({ label }) {
      const MAP = {
        'Genehmigt':  { bgcolor: '#E1F5EE', color: '#0F6E56' },
        'In Prüfung': { bgcolor: '#E6F1FB', color: '#0C447C' },
        'Abgelehnt':  { bgcolor: '#FCEBEB', color: '#791F1F' },
        'Ausstehend': { bgcolor: '#FAEEDA', color: '#854F0B' },
      };
      const s = MAP[label] || { bgcolor: '#F1EFE8', color: '#5F5E5A' };
      return html`
        <${Box} sx=${{
          display: 'inline-block', bgcolor: s.bgcolor, color: s.color,
          px: 1.25, py: 0.25, borderRadius: '12px',
          fontSize: '12px', fontWeight: 700, whiteSpace: 'nowrap',
        }}>${label}<//>
      `;
    }

    function ScoreBar({ score }) {
      const color = score >= 85 ? '#2E7D32' : score >= 70 ? '#1976D2' : '#E65100';
      return html`
        <${Stack} direction="row" alignItems="center" spacing=${1}>
          <${Box} sx=${{ width: 72, height: 6, bgcolor: '#E0E0E0', borderRadius: '3px', overflow: 'hidden' }}>
            <${Box} sx=${{ width: score + '%', height: '100%', bgcolor: color, borderRadius: '3px' }} />
          <//>
          <${Typography} variant="body2" fontWeight=${700}>${score}<//>
        <//>
      `;
    }

    function Avatar({ initials, bgcolor }) {
      return html`
        <${Box} sx=${{
          width: 32, height: 32, borderRadius: '50%',
          bgcolor, color: '#fff', fontWeight: 700, fontSize: '11px',
          display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
        }}>${initials}<//>
      `;
    }

    function ActionGroup({ onDecide }) {
      return html`
        <${Stack} spacing=${0.75}>
          <${Stack} direction="row" spacing=${0.75} flexWrap="wrap">
            <${Button} size="small" onClick=${() => onDecide('Genehmigt')}
              sx=${{ bgcolor: '#E1F5EE', color: '#0F6E56', border: '1px solid #b8e6d4', '&:hover': { bgcolor: '#c8eedd' } }}>
              Genehmigen
            <//>
            <${Button} size="small" onClick=${() => onDecide('In Prüfung')}
              sx=${{ bgcolor: '#E6F1FB', color: '#0C447C', border: '1px solid #b3d2f0', '&:hover': { bgcolor: '#cfe0f5' } }}>
              In Prüfung
            <//>
            <${Button} size="small" onClick=${() => onDecide('Abgelehnt')}
              sx=${{ bgcolor: '#FCEBEB', color: '#791F1F', border: '1px solid #f5c6c6', '&:hover': { bgcolor: '#fad5d5' } }}>
              Ablehnen
            <//>
          <//>
          <${TextField} multiline rows=${2} size="small" placeholder="Kommentar (optional)" fullWidth />
        <//>
      `;
    }

    const INITIAL_CANDIDATES = [
      { name: 'Max Mustermann', initials: 'MM', avatarColor: '#1976D2', role: 'Senior Consultant', score: 91, status: 'Genehmigt' },
      { name: 'Sandra Koch',    initials: 'SK', avatarColor: '#388E3C', role: 'Senior Consultant', score: 84, status: 'In Prüfung' },
      { name: 'Felix Weber',    initials: 'FW', avatarColor: '#F57C00', role: 'Consultant',        score: 69, status: 'Ausstehend' },
    ];

    const TIMELINE = [
      { icon: '➕', dotClass: 'grey',   title: 'Opportunity erstellt',        desc: 'von Jannik Schröder',                                                         meta: 'vor 3 Tagen',    comment: null },
      { icon: '◎',  dotClass: 'blue',   title: 'Matching gestartet',          desc: '6 Kandidaten gefunden: 3 sofort verfügbar, 2 bald, 1 teilweise',              meta: 'vor 3 Tagen',    comment: null },
      { icon: '✉',  dotClass: 'blue',   title: 'Manager informiert',          desc: 'Anna Schmidt, Klaus Bauer, Marco Lehmann per E-Mail benachrichtigt',          meta: 'vor 3 Tagen',    comment: null },
      { icon: '✓',  dotClass: 'green',  title: 'Genehmigt — Max Mustermann',  desc: null,                                                                           meta: 'gestern, 14:32', comment: 'Anna Schmidt: «Hervorragende Passung. Max hat exakt die benötigte AWS-Erfahrung.»' },
      { icon: '⏸',  dotClass: 'yellow', title: 'In Prüfung — Sandra Koch',    desc: null,                                                                           meta: 'gestern, 14:35', comment: 'Anna Schmidt: «Sandra ist interessiert, ich spreche noch mit ihr.»' },
      { icon: '⏸',  dotClass: 'yellow', title: 'In Prüfung — Felix Weber',    desc: null,                                                                           meta: 'heute, 09:14',   comment: 'Anna Schmidt: «Prüfe die Verfügbarkeit.»' },
    ];

    const DOT_COLORS = {
      grey:   { bgcolor: '#F1EFE8', color: '#5F5E5A' },
      blue:   { bgcolor: '#E3F0FC', color: '#1976D2' },
      green:  { bgcolor: '#E1F5EE', color: '#0F6E56' },
      yellow: { bgcolor: '#FAEEDA', color: '#854F0B' },
    };

    function TimelineDot({ icon, dotClass }) {
      const c = DOT_COLORS[dotClass];
      return html`
        <${Box} sx=${{
          width: 32, height: 32, borderRadius: '50%',
          bgcolor: c.bgcolor, color: c.color,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: '14px', flexShrink: 0,
        }}>${icon}<//>
      `;
    }

    function App() {
      const [candidates, setCandidates] = useState(INITIAL_CANDIDATES);

      const decide = useCallback((name, status) => {
        setCandidates(cs => cs.map(c => c.name === name ? { ...c, status } : c));
      }, []);

      return html`
        <${ThemeProvider} theme=${theme}>
          <${CssBaseline} />
          <${MockupBar} />
          <${Container} maxWidth="md" sx=${{ py: 4 }}>

            <!-- Manager view -->
            <${Typography} variant="overline" color="text.secondary" sx=${{ display: 'flex', alignItems: 'center', gap: 1, mb: 1.5 }}>
              <${Box} component="span" sx=${{ color: 'primary.main', fontSize: '16px' }}>●<//>
              Manager-Ansicht
            <//>

            <${Paper} variant="outlined" sx=${{ mb: 4, overflow: 'hidden' }}>
              <${Box} sx=${{ px: 2.5, py: 1.5, borderBottom: '1px solid', borderColor: 'divider', bgcolor: '#FAFAFA' }}>
                <${Typography} variant="body2" color="text.secondary">
                  Opportunity: Backend-Projekt Datenmigration &nbsp;·&nbsp;
                  3 Kandidaten aus deinem Team warten auf Bewertung
                <//>
              <//>
              <${TableContainer}>
                <${Table} size="small">
                  <${TableHead}>
                    <${TableRow}>
                      ${['Mitarbeiter', 'Rolle', 'Match-Score', 'Status', 'Bewertung'].map(c => html`
                        <${TableCell} key=${c} sx=${{ fontWeight: 700, textTransform: 'uppercase', fontSize: '11px', letterSpacing: 0.5, color: 'text.secondary' }}>
                          ${c}
                        <//>
                      `)}
                    <//>
                  <//>
                  <${TableBody}>
                    ${candidates.map(c => html`
                      <${TableRow} key=${c.name}>
                        <${TableCell}>
                          <${Stack} direction="row" alignItems="center" spacing=${1.25}>
                            <${Avatar} initials=${c.initials} bgcolor=${c.avatarColor} />
                            <${Typography} variant="body2" fontWeight=${500}>${c.name}<//>
                          <//>
                        <//>
                        <${TableCell}>${c.role}<//>
                        <${TableCell}><${ScoreBar} score=${c.score} /><//>
                        <${TableCell}><${StatusBadge} label=${c.status} /><//>
                        <${TableCell} sx=${{ minWidth: 280 }}>
                          ${c.status === 'Genehmigt'
                            ? html`
                              <${Box} sx=${{ display: 'inline-flex', alignItems: 'center', gap: 0.75, bgcolor: '#E1F5EE', color: '#0F6E56', px: 1.5, py: 0.5, borderRadius: 1, fontSize: '12px', fontWeight: 700 }}>
                                ✓ Genehmigt
                              <//>
                            `
                            : html`<${ActionGroup} onDecide=${(s) => decide(c.name, s)} />`
                          }
                        <//>
                      <//>
                    `)}
                  <//>
                <//>
              <//>
            <//>

            <!-- Creator view -->
            <${Typography} variant="overline" color="text.secondary" sx=${{ display: 'flex', alignItems: 'center', gap: 1, mb: 1.5 }}>
              <${Box} component="span" sx=${{ color: 'primary.main', fontSize: '16px' }}>●<//>
              Ersteller-Ansicht
            <//>

            <${Paper} variant="outlined" sx=${{ overflow: 'hidden' }}>
              <${Box} sx=${{ px: 2.5, py: 1.5, borderBottom: '1px solid', borderColor: 'divider', bgcolor: '#FAFAFA' }}>
                <${Typography} variant="body2" color="text.secondary">
                  Opportunity: Backend-Projekt Datenmigration &nbsp;·&nbsp; Letzte Aktivität: heute, 09:14
                <//>
              <//>
              <${Box} sx=${{ px: 2.5, pb: 1 }}>
                ${TIMELINE.map((item, i) => html`
                  <${Stack} key=${i} direction="row" gap=${2} sx=${{ py: 1.75, borderBottom: i < TIMELINE.length - 1 ? '1px solid' : 'none', borderColor: 'divider' }}>
                    <${Stack} alignItems="center" sx=${{ flexShrink: 0, width: 32 }}>
                      <${TimelineDot} icon=${item.icon} dotClass=${item.dotClass} />
                      ${i < TIMELINE.length - 1 && html`
                        <${Box} sx=${{ width: '2px', flex: 1, bgcolor: 'divider', mt: 0.75 }} />
                      `}
                    <//>
                    <${Box} sx=${{ flex: 1, minWidth: 0 }}>
                      <${Typography} variant="body2" fontWeight=${600} sx=${{ mb: 0.25 }}>${item.title}<//>
                      ${item.desc && html`<${Typography} variant="body2" color="text.secondary" sx=${{ mb: 0.5 }}>${item.desc}<//>` }
                      ${item.comment && html`
                        <${Box} sx=${{ bgcolor: '#F5F6F8', borderLeft: '3px solid', borderColor: 'divider', px: 1.5, py: 1, my: 0.75, borderRadius: '0 2px 2px 0' }}>
                          <${Typography} variant="body2" sx=${{ lineHeight: 1.6 }}>${item.comment}<//>
                        <//>
                      `}
                      <${Typography} variant="caption" color="text.disabled">${item.meta}<//>
                    <//>
                  <//>
                `)}
              <//>
            <//>

          <//>
        <//>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
