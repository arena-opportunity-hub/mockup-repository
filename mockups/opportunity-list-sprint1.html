<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meine Opportunities (Sprint 1) — Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style> * { box-sizing: border-box; } body { margin: 0; } </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/htm/dist/htm.umd.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: h, useState, useCallback, useMemo } = React;
    const { createRoot } = ReactDOM;
    const { Box, Typography, Button, Paper, Container, Stack, Table, TableHead, TableBody,
            TableRow, TableCell, TableContainer, TextField, MenuItem, IconButton, Tooltip,
            ThemeProvider, createTheme, CssBaseline } = MaterialUI;

    const html = htm.bind(h);

    const theme = createTheme({
      palette: { primary: { main: '#1976D2' }, error: { main: '#E53935' } },
      components: { MuiButton: { defaultProps: { disableElevation: true } } },
    });

    // Sprint 1: nur Offen / Entwurf / Zurückgezogen — Farben gemäß colors.ts
    const STATUS_COLORS = {
      'Offen':          { bgcolor: '#E3F0FC', color: '#1256A0' },
      'Entwurf':        { bgcolor: '#F1EFE8', color: '#5F5E5A' },
      'Zurückgezogen':  { bgcolor: '#FEF0E0', color: '#8B5E00' },
    };

    // Deadlines relativ zu 2026-06-04 (heute)
    const DATA = [
      { id: 1, title: 'AML-Regulatorik Banking-Projekt',     client: 'Hypoteq AG',           startDate: '2026-08-01', deadline: '2026-06-07', skills: ['AML', 'Compliance', 'Banking'],    extraSkills: 1, status: 'Offen' },
      { id: 2, title: 'Container Plattform Initiative',       client: 'Reply GmbH',            startDate: '2026-07-15', deadline: '2026-06-12', skills: ['Docker', 'Kubernetes', 'GitOps'],  extraSkills: 1, status: 'Offen' },
      { id: 3, title: 'Business Intelligence Retail',         client: 'IPSWAYS Insurance',     startDate: '2026-09-01', deadline: '2026-06-25', skills: ['Power BI', 'SQL', 'ETL'],          extraSkills: 2, status: 'Offen' },
      { id: 4, title: 'Cloud-Migration Sparkasse',            client: 'Finanz Informatik',     startDate: '2026-10-01', deadline: '2026-07-10', skills: ['AWS', 'Terraform'],                extraSkills: 1, status: 'Entwurf' },
      { id: 5, title: 'Compliance-Beratung DSGVO',            client: 'Volksbank Rhein-Main',  startDate: '2026-05-15', deadline: '2026-04-10', skills: ['DSGVO', 'Compliance'],             extraSkills: 0, status: 'Zurückgezogen' },
    ];

    // Frist-Badge: Farben gemäß deadlineUrgent / deadlineWarning / deadlineOk / deadlineExpired
    function DeadlineBadge({ iso }) {
      const today = new Date('2026-06-04');
      const due   = new Date(iso + 'T00:00:00');
      const days  = Math.ceil((due - today) / 86400000);
      let bgcolor, color, label;
      if      (days < 0)   { bgcolor = '#F5F5F5'; color = '#9E9E9E'; label = 'Abgelaufen'; }
      else if (days <= 7)  { bgcolor = '#FFEBEE'; color = '#C62828'; label = `${days} Tage`; }
      else if (days <= 14) { bgcolor = '#FFF3E0'; color = '#E65100'; label = `${days} Tage`; }
      else                 { bgcolor = '#E8F5E9'; color = '#2E7D32'; label = `${days} Tage`; }
      return html`
        <${Box} sx=${{ display: 'inline-block', px: 1, py: 0.25, borderRadius: '10px',
          bgcolor, color, fontSize: '12px', fontWeight: 600, whiteSpace: 'nowrap' }}>
          ${label}
        <//>
      `;
    }

    function StatusPill({ status }) {
      const s = STATUS_COLORS[status] || STATUS_COLORS['Entwurf'];
      return html`
        <${Box} sx=${{ display: 'inline-block', bgcolor: s.bgcolor, color: s.color,
          px: 1.25, py: 0.25, borderRadius: '12px',
          fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.5, whiteSpace: 'nowrap' }}>
          ${status}
        <//>
      `;
    }

    function MockupBar({ demoState, setDemoState }) {
      return html`
        <${Paper} square elevation=${0} sx=${{
          position: 'sticky', top: 0, zIndex: 1100,
          borderBottom: '1px solid', borderColor: 'divider',
          px: 4, py: 1.25,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <${Typography} variant="overline" color="text.secondary">
            Mockup · <${Box} component="span" sx=${{ color: 'primary.main' }}>Meine Opportunities — Sprint 1<//>
          <//>
          <${Stack} direction="row" spacing=${1} alignItems="center">
            <${Typography} variant="caption" color="text.secondary">Demo:<//>
            ${['Normal', 'Leer A', 'Leer B'].map(label => html`
              <${Button} key=${label} size="small" variant=${demoState === label ? 'contained' : 'outlined'}
                onClick=${() => setDemoState(label)}
                sx=${{ fontSize: '11px', py: 0.25, minWidth: 0, px: 1.25 }}>
                ${label}
              <//>
            `)}
            <${Box} sx=${{ ml: 1, borderLeft: '1px solid', borderColor: 'divider', pl: 1.5 }}>
              <${Button} component="a" href="../index.html" size="small">← Katalog<//>
            <//>
          <//>
        <//>
      `;
    }

    function EmptyStateA() {
      return html`
        <${TableRow}>
          <${TableCell} colSpan=${8} sx=${{ py: 8, textAlign: 'center', border: 'none' }}>
            <${Typography} sx=${{ fontSize: '36px', mb: 1.5, color: 'text.disabled' }}>📋<//>
            <${Typography} variant="subtitle1" fontWeight=${600} sx=${{ mb: 0.75 }}>
              Noch keine Opportunities
            <//>
            <${Typography} variant="body2" color="text.secondary" sx=${{ mb: 2.5 }}>
              Erstelle deine erste Opportunity, um Kandidaten zu finden.
            <//>
            <${Button} variant="contained" size="small">+ Erste Opportunity erstellen<//>
          <//>
        <//>
      `;
    }

    function EmptyStateB({ onReset }) {
      return html`
        <${TableRow}>
          <${TableCell} colSpan=${8} sx=${{ py: 8, textAlign: 'center', border: 'none' }}>
            <${Typography} sx=${{ fontSize: '36px', mb: 1.5, color: 'text.disabled' }}>🔍<//>
            <${Typography} variant="subtitle1" fontWeight=${600} sx=${{ mb: 0.75 }}>
              Keine Opportunities gefunden
            <//>
            <${Typography} variant="body2" color="text.secondary" sx=${{ mb: 2.5 }}>
              Die aktiven Filter liefern keine Treffer.
            <//>
            <${Button} variant="outlined" size="small" onClick=${onReset}>
              Filter zurücksetzen
            <//>
          <//>
        <//>
      `;
    }

    const SPRINT1_STATUSES = ['Offen', 'Entwurf', 'Zurückgezogen'];
    const COLS = ['', 'Titel', 'Kunde', 'Startdatum', 'Abzugeben bis', 'Skills', 'Matches', 'Status'];

    function App() {
      const [demoState,    setDemoState]    = useState('Normal');
      const [statusFilter, setStatusFilter] = useState('');
      const [dateFrom,     setDateFrom]     = useState('');
      const [dateTo,       setDateTo]       = useState('');
      const [search,       setSearch]       = useState('');
      const [showFavs,     setShowFavs]     = useState(false);
      const [favorites,    setFavorites]    = useState(
        () => new Set(JSON.parse(localStorage.getItem('opp-hub-s1-favorites') || '[]'))
      );

      const resetFilters = useCallback(() => {
        setStatusFilter(''); setDateFrom(''); setDateTo(''); setSearch(''); setShowFavs(false);
      }, []);

      const toggleFav = useCallback((id) => {
        setFavorites(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id); else next.add(id);
          localStorage.setItem('opp-hub-s1-favorites', JSON.stringify([...next]));
          return next;
        });
      }, []);

      const visible = useMemo(() => {
        if (demoState === 'Leer A') return null;   // null = no data at all
        if (demoState === 'Leer B') return [];     // [] = data exists but filters hide it
        return DATA.filter(d => {
          return (!statusFilter || d.status === statusFilter) &&
                 (!dateFrom || d.deadline >= dateFrom) &&
                 (!dateTo   || d.deadline <= dateTo) &&
                 (!search   || d.title.toLowerCase().includes(search.toLowerCase()) ||
                               d.client.toLowerCase().includes(search.toLowerCase())) &&
                 (!showFavs || favorites.has(d.id));
        });
      }, [demoState, statusFilter, dateFrom, dateTo, search, showFavs, favorites]);

      const totalCount = demoState === 'Leer A' ? 0 : DATA.length;
      const shownCount = visible === null ? 0 : visible.length;

      return html`
        <${ThemeProvider} theme=${theme}>
          <${CssBaseline} />
          <${MockupBar} demoState=${demoState} setDemoState=${setDemoState} />

          <${Container} maxWidth="lg" sx=${{ py: 4 }}>

            <${Typography} variant="h6" fontWeight=${700} sx=${{ mb: 2 }}>
              Meine Opportunities
            <//>

            <!-- Filter-Zeile -->
            <${Stack} direction="row" spacing=${1.5} sx=${{ mb: 2 }} alignItems="flex-end" flexWrap="wrap">
              <${TextField} label="Status" select size="small"
                value=${statusFilter} onChange=${e => setStatusFilter(e.target.value)}
                sx=${{ minWidth: 160 }}>
                <${MenuItem} value="">Alle<//>
                ${SPRINT1_STATUSES.map(s => html`
                  <${MenuItem} key=${s} value=${s}>${s}<//>
                `)}
              <//>
              <${TextField} label="Zeitraum Von" type="date" size="small"
                value=${dateFrom} onChange=${e => setDateFrom(e.target.value)}
                InputLabelProps=${{ shrink: true }} sx=${{ minWidth: 150 }} />
              <${TextField} label="Bis" type="date" size="small"
                value=${dateTo} onChange=${e => setDateTo(e.target.value)}
                InputLabelProps=${{ shrink: true }} sx=${{ minWidth: 150 }} />
              <${TextField} label="Suche" size="small" placeholder="Titel oder Kunde"
                value=${search} onChange=${e => setSearch(e.target.value)}
                sx=${{ minWidth: 200 }} />
              <${Box} sx=${{ flex: 1 }} />
              <${Button} variant="outlined" size="small"
                onClick=${() => setShowFavs(v => !v)}
                sx=${{
                  borderColor: showFavs ? '#FFC107' : 'divider',
                  color:       showFavs ? '#8a6000' : 'text.secondary',
                  bgcolor:     showFavs ? '#FFF8E1' : 'transparent',
                  '&:hover':  { borderColor: '#FFC107', bgcolor: '#FFFDE7' },
                }}>
                ${showFavs ? '★ Favoriten' : '☆ Favoriten'}
              <//>
              <${Button} variant="contained" size="small">+ Neue Opportunity<//>
            <//>

            <!-- Tabelle -->
            <${TableContainer} component=${Paper} variant="outlined">
              <${Table} size="small">
                <${TableHead}>
                  <${TableRow} sx=${{ bgcolor: '#FAFAFA' }}>
                    ${COLS.map((c, i) => html`
                      <${TableCell} key=${i} sx=${{
                        fontWeight: 700, textTransform: 'uppercase',
                        fontSize: '11px', letterSpacing: 0.5, color: 'text.secondary',
                        whiteSpace: 'nowrap', py: 1.5,
                        ...(i === 0 ? { width: 44, pr: 0 } : {}),
                      }}>
                        ${c}
                      <//>
                    `)}
                  <//>
                <//>
                <${TableBody}>
                  ${visible === null ? html`<${EmptyStateA} />` :
                    visible.length === 0 ? html`<${EmptyStateB} onReset=${resetFilters} />` :
                    visible.map(d => {
                      const isFav = favorites.has(d.id);
                      return html`
                        <${TableRow} key=${d.id} hover sx=${{ cursor: 'pointer' }}>

                          <!-- Favorit -->
                          <${TableCell} sx=${{ pr: 0, width: 44 }}>
                            <${IconButton} size="small"
                              onClick=${e => { e.stopPropagation(); toggleFav(d.id); }}
                              sx=${{ color: isFav ? '#FFC107' : '#E0E0E0', '&:hover': { color: '#FFC107' } }}>
                              ${isFav ? '★' : '☆'}
                            <//>
                          <//>

                          <!-- Titel -->
                          <${TableCell}>
                            <${Typography} variant="body2" fontWeight=${500}>${d.title}<//>
                          <//>

                          <!-- Kunde -->
                          <${TableCell}>
                            <${Typography} variant="body2">${d.client}<//>
                          <//>

                          <!-- Startdatum -->
                          <${TableCell} sx=${{ whiteSpace: 'nowrap' }}>
                            <${Typography} variant="body2">
                              ${new Date(d.startDate + 'T00:00:00').toLocaleDateString('de-DE')}
                            <//>
                          <//>

                          <!-- Abzugeben bis + Frist-Badge -->
                          <${TableCell} sx=${{ whiteSpace: 'nowrap' }}>
                            <${Typography} variant="body2" sx=${{ mb: 0.375 }}>
                              ${new Date(d.deadline + 'T00:00:00').toLocaleDateString('de-DE')}
                            <//>
                            <${DeadlineBadge} iso=${d.deadline} />
                          <//>

                          <!-- Skills -->
                          <${TableCell}>
                            <${Stack} direction="row" flexWrap="wrap" gap=${0.5}>
                              ${d.skills.map(s => html`
                                <${Box} key=${s} sx=${{ display: 'inline-block',
                                  bgcolor: '#F5F5F5', color: 'text.primary',
                                  px: 1, py: 0.25, borderRadius: '12px', fontSize: '12px' }}>
                                  ${s}
                                <//>
                              `)}
                              ${d.extraSkills > 0 && html`
                                <${Box} sx=${{ display: 'inline-block',
                                  bgcolor: '#E3F0FC', color: '#1256A0',
                                  px: 1, py: 0.25, borderRadius: '12px', fontSize: '12px' }}>
                                  +${d.extraSkills}
                                <//>
                              `}
                            <//>
                          <//>

                          <!-- Matches: Sprint-1-Platzhalter -->
                          <${TableCell}>
                            <${Tooltip} title="Matching wird in einem späteren Sprint implementiert" placement="top" arrow>
                              <${Typography} variant="body2" color="text.disabled"
                                sx=${{ cursor: 'help' }}>—<//>
                            <//>
                          <//>

                          <!-- Status -->
                          <${TableCell}>
                            <${StatusPill} status=${d.status} />
                          <//>

                        <//>
                      `;
                    })
                  }
                <//>
              <//>
            <//>

            <!-- Zähler -->
            <${Box} sx=${{ display: 'flex', justifyContent: 'flex-end', pt: 1.5 }}>
              <${Typography} variant="caption" color="text.secondary">
                ${shownCount > 0 ? `1–${shownCount} von ${totalCount}` : `0 von ${totalCount}`}
              <//>
            <//>

          <//>
        <//>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
