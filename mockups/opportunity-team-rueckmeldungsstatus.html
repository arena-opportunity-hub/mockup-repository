<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rückmeldungsstatus je Team — Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style> * { box-sizing: border-box; } body { margin: 0; } </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/htm/dist/htm.umd.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: h, useState, useMemo } = React;
    const { createRoot } = ReactDOM;
    const { Box, Typography, Button, Paper, Container, Stack, Tabs, Tab, Tooltip, ThemeProvider, createTheme, CssBaseline } = MaterialUI;

    const html = htm.bind(h);

    const theme = createTheme({
      palette: { primary: { main: '#1976D2' }, error: { main: '#E53935' } },
      components: { MuiButton: { defaultProps: { disableElevation: true } } },
    });

    function StatusPill({ label }) {
      return html`<${Box} sx=${{ display: 'inline-block', bgcolor: '#E3F0FC', color: '#1256A0', px: 1.25, py: 0.25, borderRadius: '12px', fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.4 }}>${label}<//>`;
    }
    function DaysBadge({ days }) {
      return html`<${Box} sx=${{ display: 'inline-block', bgcolor: '#FFF3E0', color: '#E65100', px: 1, py: 0.25, borderRadius: '10px', fontSize: '12px', fontWeight: 600 }}>${days} Tage<//>`;
    }
    function TeamPill({ answered }) {
      return html`
        <${Box} sx=${{
          display: 'inline-block',
          bgcolor: answered ? '#E1F5EE' : '#FAEEDA',
          color:   answered ? '#0F6E56' : '#854F0B',
          px: 1.25, py: 0.25, borderRadius: '12px', fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.4,
        }}>${answered ? 'Beantwortet' : 'Offen'}<//>
      `;
    }
    function Avatar({ initials, bgcolor, size = 32 }) {
      return html`
        <${Box} sx=${{ width: size, height: size, borderRadius: '50%', bgcolor, color: '#fff', fontWeight: 700, fontSize: size <= 32 ? '12px' : '14px', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>${initials}<//>
      `;
    }
    function ReactionDot({ reaction }) {
      const color = !reaction ? '#BDBDBD' : reaction.type === 'kandidat' ? '#2E7D32' : '#C62828';
      const title = !reaction ? 'Keine Reaktion' : reaction.type === 'kandidat' ? 'Kandidat vorgeschlagen' : 'Leermeldung';
      return html`
        <${Tooltip} title=${title} arrow placement="top">
          <${Box} sx=${{ width: 10, height: 10, borderRadius: '50%', bgcolor: color, flexShrink: 0 }} />
        <//>
      `;
    }

    function MockupBar() {
      return html`
        <${Paper} square elevation=${0} sx=${{ position: 'sticky', top: 0, zIndex: 1100, borderBottom: '1px solid', borderColor: 'divider', px: 4, py: 1.25, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <${Typography} variant="overline" color="text.secondary">
            Mockup · <${Box} component="span" sx=${{ color: 'primary.main' }}>Issue #572 · Rückmeldungsstatus je Team an einer Opportunity<//>
          <//>
          <${Button} component="a" href="../index.html" size="small">← Katalog<//>
        <//>
      `;
    }

    /* ── Baumstruktur: BU → Team → Mitarbeitende mit Reaktion ── */
    const ORG_TREE = [
      {
        key: 'bu-fs', label: 'BU FINANCIAL SERVICES', leitung: ['Anna Schmidt', 'Klaus Bauer'],
        people: [
          { name: 'Jonas Weber', initials: 'JW', avatarColor: '#5C6BC0', role: 'Practice Lead', reaction: null },
        ],
        children: [
          {
            key: 'team-ffm', label: 'BU FINANCIAL SERVICES.FRANKFURT_BANKING', leitung: ['Anna Schmidt'],
            people: [
              { name: 'Max Mustermann', initials: 'MM', avatarColor: '#1976D2', role: 'Senior Consultant', reaction: { type: 'kandidat',    kandidat: 'Max Mustermann', meta: 'gestern, 14:32' } },
              { name: 'Sandra Koch',    initials: 'SK', avatarColor: '#388E3C', role: 'Consultant',         reaction: { type: 'kandidat',    kandidat: 'Sandra Koch',    meta: 'gestern, 14:35' } },
              { name: 'Tobias Schulz',  initials: 'TS', avatarColor: '#558B2F', role: 'Backend Developer',  reaction: null },
            ],
            children: [],
          },
          {
            key: 'team-muc', label: 'BU FINANCIAL SERVICES.MUENCHEN_INSURANCE', leitung: ['Klaus Bauer'],
            people: [
              { name: 'Julia Neumann',    initials: 'JN', avatarColor: '#6A1B9A', role: 'Senior Consultant', reaction: { type: 'leermeldung', meta: 'heute, 08:50' } },
              { name: 'Patrick Hoffmann', initials: 'PH', avatarColor: '#00838F', role: 'Consultant',        reaction: null },
            ],
            children: [],
          },
        ],
      },
      {
        key: 'bu-data', label: 'BU DATA & AI', leitung: ['Marco Lehmann'], people: [],
        children: [
          {
            key: 'team-berlin', label: 'BU DATA & AI.BERLIN_DATA', leitung: ['Marco Lehmann'],
            people: [
              { name: 'Robert Becker', initials: 'RB', avatarColor: '#4527A0', role: 'Principal',   reaction: null },
              { name: 'Laura Zimmer',  initials: 'LZ', avatarColor: '#00695C', role: 'Consultant',   reaction: null },
            ],
            children: [],
          },
        ],
      },
    ];

    function headcount(node) {
      return node.people.length + node.children.reduce((sum, c) => sum + headcount(c), 0);
    }
    function isAnswered(node) {
      return node.people.some(p => p.reaction) || node.children.some(isAnswered);
    }

    function PersonRow({ person, depth }) {
      const r = person.reaction;
      return html`
        <${Stack} direction="row" alignItems="center" gap=${1.5} sx=${{ py: 1, pl: 3 + depth * 3, pr: 2 }}>
          <${Avatar} initials=${person.initials} bgcolor=${person.avatarColor} />
          <${Box} sx=${{ minWidth: 190 }}>
            <${Typography} variant="body2" fontWeight=${700}>${person.name}<//>
            <${Typography} variant="caption" color="text.secondary" sx=${{ textTransform: 'uppercase', letterSpacing: 0.4 }}>${person.role}<//>
          <//>
          <${ReactionDot} reaction=${r} />
          <${Box} sx=${{ minWidth: 190 }}>
            <${Typography} variant="body2" color=${r ? 'text.primary' : 'text.disabled'}>
              ${r ? (r.type === 'kandidat' ? 'Kandidat vorgeschlagen' : 'Leermeldung') : '—'}
            <//>
          <//>
          <${Box} sx=${{ minWidth: 170 }}>
            <${Typography} variant="body2" color="text.secondary">${r?.kandidat || '—'}<//>
          <//>
          <${Box} sx=${{ flex: 1, textAlign: 'right' }}>
            <${Typography} variant="caption" color="text.disabled">${r?.meta || '—'}<//>
          <//>
        <//>
      `;
    }

    function OrgNode({ node, depth }) {
      const answered = isAnswered(node);
      return html`
        <${Box} sx=${{ mb: depth === 0 ? 2.5 : 1.5 }}>
          <${Stack} direction="row" alignItems="center" gap=${1} sx=${{ pl: depth * 3, pb: 0.75, borderBottom: '1px solid', borderColor: 'divider' }}>
            <${Typography} variant="body2" fontWeight=${700} sx=${{ textTransform: 'uppercase', letterSpacing: 0.5 }}>
              ${node.label}
            <//>
            ${!answered && html`
              <${Tooltip} title="Für diese Organisationseinheit liegt noch keine Rückmeldung vor" arrow>
                <${Box} sx=${{ color: '#E65100', fontSize: '15px' }}>⚠<//>
              <//>
            `}
            <${Typography} variant="caption" color="text.secondary" sx=${{ ml: 1 }}>
              Leitung: ${node.leitung.join(', ')}
            <//>
            <${Box} sx=${{ flex: 1 }} />
            <${TeamPill} answered=${answered} />
            <${Typography} variant="caption" color="text.secondary" sx=${{ minWidth: 110, textAlign: 'right' }}>
              ${headcount(node)} Mitarbeitende
            <//>
          <//>

          ${node.people.map(p => html`<${PersonRow} key=${p.name} person=${p} depth=${depth} />`)}

          ${node.children.map(c => html`<${OrgNode} key=${c.key} node=${c} depth=${depth + 1} />`)}
        <//>
      `;
    }

    function TabTeamStatus() {
      const totalAnswered = useMemo(() => ORG_TREE.filter(isAnswered).length, []);
      return html`
        <${Paper} variant="outlined" sx=${{ p: 3 }}>
          <${Stack} direction="row" alignItems="baseline" justifyContent="space-between" sx=${{ borderBottom: '1px solid', borderColor: 'divider', pb: 1.25, mb: 0.5 }}>
            <${Typography} variant="overline" color="text.secondary">Rückmeldung nach Organisationseinheit<//>
            <${Typography} variant="caption" color="text.secondary">${totalAnswered} von ${ORG_TREE.length} BUs beantwortet<//>
          <//>
          <${Typography} variant="caption" color="text.secondary" sx=${{ display: 'block', mb: 2.5, fontStyle: 'italic' }}>
            Eine Organisationseinheit gilt als „beantwortet", sobald irgendeine Person darin reagiert hat — positiv
            (Kandidat vorgeschlagen) oder negativ (Leermeldung). Das hindert weitere Personen derselben Einheit nicht
            daran, zusätzlich zu reagieren; jede Einzelreaktion bleibt personenscharf sichtbar.
          <//>
          ${ORG_TREE.map(n => html`<${OrgNode} key=${n.key} node=${n} depth=${0} />`)}
        <//>
      `;
    }

    function App() {
      const [tab, setTab] = useState(1);
      return html`
        <${ThemeProvider} theme=${theme}>
          <${CssBaseline} />
          <${MockupBar} />
          <${Box} sx=${{ bgcolor: '#F5F6F8', minHeight: '100vh', pb: 6 }}>
          <${Container} maxWidth="lg" sx=${{ pt: 3 }}>

            <${Paper} variant="outlined" sx=${{ p: 3, mb: 2 }}>
              <${Typography} variant="caption" color="primary.main" sx=${{ display: 'block', mb: 1, cursor: 'pointer' }}>← Opportunity-Liste<//>
              <${Box} sx=${{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 2 }}>
                <${Box} sx=${{ flex: 1, minWidth: 0 }}>
                  <${Stack} direction="row" alignItems="center" gap=${1.25} flexWrap="wrap" sx=${{ mb: 1 }}>
                    <${Typography} variant="h6" fontWeight=${700}>Backend-Projekt Datenmigration<//>
                    <${StatusPill} label="Offen" />
                  <//>
                  <${Stack} direction="row" alignItems="center" flexWrap="wrap" gap=${0} sx=${{ fontSize: '12px', color: 'text.secondary' }}>
                    <${Typography} variant="caption">Erstellt von Jannik Schröder<//>
                    <${Box} component="span" sx=${{ mx: 1.25, color: 'divider' }}>|<//>
                    <${Typography} variant="caption">12.04.2026<//>
                    <${Box} component="span" sx=${{ mx: 1.25, color: 'divider' }}>|<//>
                    <${Box} sx=${{ display: 'inline-flex', alignItems: 'center', gap: 0.5 }}>
                      <${Typography} variant="caption">Reaktionsfrist:<//>
                      <${DaysBadge} days=${3} />
                    <//>
                  <//>
                <//>
                <${Stack} direction="row" spacing=${1} sx=${{ flexShrink: 0, pt: 0.25 }}>
                  <${Button} variant="outlined" size="small">Bearbeiten<//>
                  <${Button} variant="contained" size="small">Matches neu berechnen<//>
                <//>
              <//>
            <//>

            <${Tabs} value=${tab} onChange=${(_, v) => setTab(v)} sx=${{ mb: 2.5, borderBottom: '1px solid', borderColor: 'divider' }}>
              <${Tab} label="Matches" />
              <${Tab} label=${html`
                <${Stack} direction="row" alignItems="center" gap=${0.75}>
                  Rückmeldung nach Team
                  <${Box} sx=${{ bgcolor: '#FAEEDA', color: '#854F0B', borderRadius: '10px', px: 0.875, fontSize: '11px', fontWeight: 700 }}>1<//>
                <//>
              `} />
              <${Tab} label="Status & Historie" />
              <${Tab} label="Details" />
            <//>

            ${tab === 0 && html`<${Typography} variant="body2" color="text.secondary" sx=${{ fontStyle: 'italic', py: 4, textAlign: 'center' }}>Matches-Tab unverändert — siehe opportunity-details-sprint2.html.<//>`}
            ${tab === 1 && html`<${TabTeamStatus} />`}
            ${tab === 2 && html`<${Typography} variant="body2" color="text.secondary" sx=${{ fontStyle: 'italic', py: 4, textAlign: 'center' }}>Status & Historie unverändert — siehe opportunity-details-sprint2.html.<//>`}
            ${tab === 3 && html`<${Typography} variant="body2" color="text.secondary" sx=${{ fontStyle: 'italic', py: 4, textAlign: 'center' }}>Details unverändert — siehe opportunity-details-sprint2.html.<//>`}

          <//>
          <//>
        <//>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
