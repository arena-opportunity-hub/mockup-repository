<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verfügbarkeit & Export — Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    /* Calendar table: keep native table for the compact colored grid */
    .cal-table { border-collapse: collapse; min-width: 600px; }
    .cal-table th, .cal-table td { border: none; padding: 0; }
    .cal-th-name { font-size: 11px; font-weight: 700; color: #757575; text-transform: uppercase; letter-spacing: 0.3px; background: #fff; padding: 6px 4px; text-align: left; padding-left: 14px; min-width: 160px; }
    .cal-th-month { border-left: 1px solid #E0E0E0; font-size: 11px; font-weight: 700; color: #757575; background: #FAFAFA; padding: 4px 6px; text-align: center; }
    .cal-th-kw { width: 28px; min-width: 28px; max-width: 28px; font-size: 10px; font-weight: 400; color: #757575; border-left: 1px solid rgba(224,224,224,0.5); padding: 4px 2px; text-align: center; background: #fff; }
    .cal-td-name { position: sticky; left: 0; background: #fff; min-width: 160px; padding: 6px 14px; border-bottom: 1px solid #E0E0E0; z-index: 1; }
    .cal-td-av { width: 28px; min-width: 28px; max-width: 28px; height: 24px; border-right: 1px solid rgba(224,224,224,0.5); border-bottom: 1px solid rgba(224,224,224,0.3); cursor: pointer; }
    .cal-td-av:hover { opacity: 0.75; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/htm/dist/htm.umd.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: h, useState } = React;
    const { createRoot } = ReactDOM;
    const { Box, Typography, Button, Paper, Container, Stack, Grid, Divider, Table, TableHead, TableBody, TableRow, TableCell, TableContainer, TextField, MenuItem, Tabs, Tab, ThemeProvider, createTheme, CssBaseline } = MaterialUI;

    const html = htm.bind(h);

    const theme = createTheme({
      palette: { primary: { main: '#1976D2' } },
      components: { MuiButton: { defaultProps: { disableElevation: true } } },
    });

    // Dispoliste exact hex values
    const AV_COLORS = {
      bench:       '#FF0000',
      billable:    '#00B050',
      prolongation:'#B4F1B1',
      reserved:    '#C4BD97',
      absence:     '#0070C0',
      junior:      '#7030A0',
      parttime:    '#FFC000',
      left:        '#455A64',
    };

    const LEGEND = [
      { color: AV_COLORS.bench,        label: 'Bench' },
      { color: AV_COLORS.billable,     label: 'Billable' },
      { color: AV_COLORS.prolongation, label: 'Prolongation möglich' },
      { color: AV_COLORS.reserved,     label: 'Reserviert' },
      { color: AV_COLORS.absence,      label: 'Urlaub / Abwesenheit' },
      { color: AV_COLORS.junior,       label: 'Junior' },
      { color: AV_COLORS.parttime,     label: 'Teilzeit' },
      { color: AV_COLORS.left,         label: 'Ausgeschieden' },
    ];

    // [color, title]
    const B  = [AV_COLORS.bench,        'Bench'];
    const BI = [AV_COLORS.billable,      'Billable'];
    const PR = [AV_COLORS.prolongation,  'Prolongation möglich'];
    const RE = [AV_COLORS.reserved,      'Reserviert'];
    const AB = [AV_COLORS.absence,       'Urlaub / Abwesenheit'];
    const JU = [AV_COLORS.junior,        'Junior'];

    const EMPLOYEES = [
      { name: 'Max Mustermann',  role: 'Senior Consultant', cells: [B, B, B, B, BI, BI, BI, BI, BI, BI, BI, BI] },
      { name: 'Sandra Koch',     role: 'Consultant',        cells: [BI,BI,BI,BI,BI,BI,BI,BI,BI,BI,BI,BI] },
      { name: 'Felix Weber',     role: 'Consultant',        cells: [B, B, RE,RE,RE,RE,BI,BI,BI,BI,BI,BI] },
      { name: 'Thomas Berger',   role: 'Sr. Consultant',   cells: [PR,PR,PR,BI,BI,BI,BI,BI,BI,BI,BI,BI] },
      { name: 'Jana Richter',    role: 'Consultant',        cells: [B, B, B, B, B, JU,JU,JU,JU,JU,JU,JU] },
      { name: 'Lisa Müller',     role: 'Principal',         cells: [BI,BI,BI,BI,BI,BI,BI,AB,AB,BI,BI,BI] },
    ];

    const KWS = ['KW 22','KW 23','KW 24','KW 25','KW 26','KW 27','KW 28','KW 29','KW 30','KW 31','KW 32','KW 33'];

    const ENTRIES = [
      { name: 'Max Mustermann',  color: AV_COLORS.billable,     status: 'Billable',             von: '01.06.2026', bis: '31.12.2026', pct: 100 },
      { name: 'Sandra Koch',     color: AV_COLORS.billable,     status: 'Billable',             von: '01.04.2026', bis: '30.09.2026', pct: 100 },
      { name: 'Felix Weber',     color: AV_COLORS.bench,        status: 'Bench',               von: '01.05.2026', bis: '30.06.2026', pct: 100 },
      { name: 'Thomas Berger',   color: AV_COLORS.prolongation, status: 'Prolongation möglich', von: '01.06.2026', bis: '30.06.2026', pct: 100 },
      { name: 'Jana Richter',    color: AV_COLORS.bench,        status: 'Bench',               von: '01.05.2026', bis: '15.07.2026', pct: 100 },
    ];

    const HISTORY = [
      { filename: 'Dispoliste_2026_KW01-52.xlsx', date: '05.05.2026, 14:21', status: 'Fertig',    link: true },
      { filename: 'Dispoliste_2026_KW01-26.xlsx', date: '28.04.2026, 09:05', status: 'Fertig',    link: true },
      { filename: 'Dispoliste_2025_KW01-52.xlsx', date: '10.01.2026, 11:40', status: 'Abgelaufen',link: false },
    ];

    function MockupBar() {
      return html`
        <${Paper} square elevation=${0} sx=${{
          position: 'sticky', top: 0, zIndex: 1100,
          borderBottom: '1px solid', borderColor: 'divider',
          px: 4, py: 1.25,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <${Typography} variant="overline" color="text.secondary">
            Mockup · <${Box} component="span" sx=${{ color: 'primary.main' }}>Verfügbarkeit & Export<//>
          <//>
          <${Button} component="a" href="../index.html" size="small">← Katalog<//>
        <//>
      `;
    }

    /* ── Tab 1: Übersicht ── */
    function TabUebersicht() {
      return html`
        <${Box}>
          <${Stack} direction="row" spacing=${1.5} alignItems="center" sx=${{ mb: 2 }} flexWrap="wrap">
            <${TextField} select size="small" defaultValue="alle" sx=${{ minWidth: 130 }}>
              <${MenuItem} value="alle">Alle Teams<//>
              <${MenuItem} value="alpha">Team Alpha<//>
              <${MenuItem} value="beta">Team Beta<//>
            <//>
            <${TextField} select size="small" defaultValue="2026" sx=${{ minWidth: 80 }}>
              <${MenuItem} value="2026">2026<//>
              <${MenuItem} value="2025">2025<//>
            <//>
            <${Button} variant="outlined" color="inherit" size="small">Heute<//>
            <${TextField} size="small" placeholder="Mitarbeiter suchen" sx=${{ minWidth: 200 }} />
          <//>

          <${Stack} direction="row" flexWrap="wrap" gap=${2.5} sx=${{ mb: 2 }}>
            ${LEGEND.map(l => html`
              <${Stack} key=${l.label} direction="row" alignItems="center" spacing=${0.75}>
                <${Box} sx=${{ width: 12, height: 12, borderRadius: '2px', bgcolor: l.color, flexShrink: 0 }} />
                <${Typography} variant="caption">${l.label}<//>
              <//>
            `)}
          <//>

          <${Box} sx=${{ overflowX: 'auto' }}>
            <table className="cal-table">
              <thead>
                <tr>
                  <th className="cal-th-name" rowSpan=${2} style=${{ verticalAlign: 'bottom' }}>Mitarbeiter</th>
                  <th className="cal-th-month" colSpan=${1}>Mai 2026</th>
                  <th className="cal-th-month" colSpan=${4}>Juni 2026</th>
                  <th className="cal-th-month" colSpan=${4}>Juli 2026</th>
                  <th className="cal-th-month" colSpan=${3}>August 2026</th>
                </tr>
                <tr>
                  ${KWS.map(kw => html`<th key=${kw} className="cal-th-kw">${kw}</th>`)}
                </tr>
              </thead>
              <tbody>
                ${EMPLOYEES.map(emp => html`
                  <tr key=${emp.name}>
                    <td className="cal-td-name">
                      <div style=${{ fontWeight: 500, fontSize: '13px', color: '#212121', whiteSpace: 'nowrap' }}>${emp.name}</div>
                      <div style=${{ fontSize: '11px', color: '#757575', whiteSpace: 'nowrap' }}>${emp.role}</div>
                    </td>
                    ${emp.cells.map(([color, title], i) => html`
                      <td key=${i} className="cal-td-av" style=${{ background: color }} title=${title}></td>
                    `)}
                  </tr>
                `)}
              </tbody>
            </table>
          <//>
        <//>
      `;
    }

    /* ── Tab 2: Pflegen ── */
    function TabPflegen() {
      return html`
        <${Grid} container spacing=${3} alignItems="start">

          <${Grid} item xs=${12} md=${5}>
            <${Paper} variant="outlined" sx=${{ p: 3 }}>
              <${Typography} variant="subtitle1" fontWeight=${700} sx=${{ mb: 2.5 }}>Verfügbarkeit eintragen<//>
              <${Stack} spacing=${2}>
                <${TextField} label="Mitarbeiter" select size="small" defaultValue="Max Mustermann">
                  ${EMPLOYEES.map(e => html`<${MenuItem} key=${e.name} value=${e.name}>${e.name}<//>`) }
                <//>
                <${TextField} label="Status" select size="small" defaultValue="Bench">
                  ${['Bench','Billable','Prolongation möglich','Reserviert','Urlaub / Abwesenheit','Junior','Teilzeit','Ausgeschieden'].map(s =>
                    html`<${MenuItem} key=${s} value=${s}>${s}<//>`) }
                <//>
                <${TextField} label="Von" type="date" size="small" defaultValue="2026-07-01" InputLabelProps=${{ shrink: true }} />
                <${TextField} label="Bis" type="date" size="small" defaultValue="2026-09-30" InputLabelProps=${{ shrink: true }} />
                <${TextField} label="Kapazität (%)" type="number" size="small" defaultValue="100" inputProps=${{ min: 0, max: 100 }} />
                <${TextField} label="Notiz (optional)" multiline rows=${2} size="small" placeholder="Freitext …" />
                <${Stack} direction="row" spacing=${1}>
                  <${Button} variant="contained">Speichern<//>
                  <${Button} variant="text" color="inherit">Abbrechen<//>
                <//>
              <//>
            <//>
          <//>

          <${Grid} item xs=${12} md=${7}>
            <${Typography} variant="overline" color="text.secondary" sx=${{ display: 'block', mb: 1 }}>Aktuelle Einträge<//>
            <${TableContainer} component=${Paper} variant="outlined">
              <${Table} size="small">
                <${TableHead}>
                  <${TableRow}>
                    ${['Mitarbeiter','Status','Von','Bis','%',''].map(c => html`
                      <${TableCell} key=${c} sx=${{ fontWeight: 700, textTransform: 'uppercase', fontSize: '11px', letterSpacing: 0.5, color: 'text.secondary', whiteSpace: 'nowrap' }}>
                        ${c}
                      <//>
                    `)}
                  <//>
                <//>
                <${TableBody}>
                  ${ENTRIES.map(e => html`
                    <${TableRow} key=${e.name}>
                      <${TableCell}><${Typography} variant="body2" sx=${{ whiteSpace: 'nowrap' }}>${e.name}<//>  <//>
                      <${TableCell}>
                        <${Stack} direction="row" alignItems="center" spacing=${0.75}>
                          <${Box} sx=${{ width: 8, height: 8, borderRadius: '50%', bgcolor: e.color, flexShrink: 0 }} />
                          <${Typography} variant="body2" sx=${{ whiteSpace: 'nowrap' }}>${e.status}<//>
                        <//>
                      <//>
                      <${TableCell}><${Typography} variant="body2" sx=${{ whiteSpace: 'nowrap' }}>${e.von}<//>  <//>
                      <${TableCell}><${Typography} variant="body2" sx=${{ whiteSpace: 'nowrap' }}>${e.bis}<//>  <//>
                      <${TableCell}><${Typography} variant="body2">${e.pct}%<//>  <//>
                      <${TableCell}>
                        <${Button} variant="outlined" color="inherit" size="small" sx=${{ fontSize: '11px' }}>
                          Bearbeiten
                        <//>
                      <//>
                    <//>
                  `)}
                <//>
              <//>
            <//>
          <//>

        <//>
      `;
    }

    /* ── Tab 3: Export ── */
    function TabExport() {
      return html`
        <${Box} sx=${{ maxWidth: 680 }}>

          <${Paper} variant="outlined" sx=${{ p: 3, mb: 2, display: 'flex', alignItems: 'center', gap: 2 }}>
            <${Box} sx=${{
              width: 40, height: 40, bgcolor: '#1D6F42', borderRadius: '6px',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              color: '#fff', fontWeight: 700, fontSize: '16px', flexShrink: 0,
            }}>X<//>
            <${Box} sx=${{ flex: 1 }}>
              <${Typography} variant="subtitle1" fontWeight=${700}>Dispoliste exportieren<//>
              <${Typography} variant="body2" color="text.secondary">
                Generiert eine Excel-Datei im Format der bekannten Dispoliste — mit Mitarbeitern als Zeilen und Kalenderwochen als Spalten, farbcodiert nach Verfügbarkeitsstatus.
              <//>
            <//>
            <${Button}
              variant="contained"
              sx=${{ bgcolor: '#1D6F42', '&:hover': { bgcolor: '#155c35' }, whiteSpace: 'nowrap', flexShrink: 0 }}
            >
              Excel exportieren
            <//>
          <//>

          <${Paper} variant="outlined" sx=${{ p: 2.5, mb: 2 }}>
            <${Typography} variant="overline" color="text.secondary" sx=${{ display: 'block', borderBottom: '1px solid', borderColor: 'divider', pb: 1.25, mb: 2 }}>
              Export-Optionen
            <//>
            <${Stack} spacing=${1.5}>
              <${Stack} direction="row" alignItems="center" spacing=${2}>
                <${Typography} variant="body2" color="text.secondary" sx=${{ minWidth: 100 }}>Jahr<//>
                <${TextField} select size="small" defaultValue="2026" sx=${{ minWidth: 80 }}>
                  <${MenuItem} value="2026">2026<//>
                  <${MenuItem} value="2025">2025<//>
                <//>
              <//>
              <${Stack} direction="row" alignItems="center" spacing=${2}>
                <${Typography} variant="body2" color="text.secondary" sx=${{ minWidth: 100 }}>Zeitraum<//>
                <${Stack} direction="row" alignItems="center" spacing=${1}>
                  <${Typography} variant="body2" color="text.secondary">Von KW<//>
                  <${TextField} select size="small" defaultValue="1" sx=${{ minWidth: 70 }}>
                    ${[1,2,3,4,5,10,20,30,40,52].map(v => html`<${MenuItem} key=${v} value=${v}>${v}<//>`) }
                  <//>
                  <${Typography} variant="body2" color="text.secondary">Bis KW<//>
                  <${TextField} select size="small" defaultValue="52" sx=${{ minWidth: 70 }}>
                    ${[1,10,20,30,40,52].map(v => html`<${MenuItem} key=${v} value=${v}>${v}<//>`) }
                  <//>
                <//>
              <//>
              <${Stack} direction="row" alignItems="center" spacing=${2}>
                <${Typography} variant="body2" color="text.secondary" sx=${{ minWidth: 100 }}>Team-Filter<//>
                <${TextField} select size="small" defaultValue="alle" sx=${{ minWidth: 140 }}>
                  <${MenuItem} value="alle">Alle Teams<//>
                  <${MenuItem} value="alpha">Team Alpha<//>
                  <${MenuItem} value="beta">Team Beta<//>
                <//>
              <//>
              <${Stack} direction="row" alignItems="center" spacing=${1}>
                <input type="checkbox" defaultChecked id="active-only" />
                <${Typography} component="label" htmlFor="active-only" variant="body2">
                  Nur aktive Mitarbeitende
                <//>
              <//>
            <//>
          <//>

          <${Typography} variant="body2" color="text.secondary" sx=${{ mb: 2 }}>
            Der Export wird asynchron generiert und du erhältst eine E-Mail-Benachrichtigung mit dem Download-Link. Dateien verfallen nach 30 Tagen.
          <//>

          <${Typography} variant="overline" color="text.secondary" sx=${{ display: 'block', mb: 1 }}>Frühere Exporte<//>
          <${Stack} spacing=${0.75}>
            ${HISTORY.map(h => html`
              <${Paper} key=${h.filename} variant="outlined" sx=${{ px: 2, py: 1.25, display: 'flex', alignItems: 'center', gap: 1.5 }}>
                <${Typography} sx=${{ fontSize: '16px', flexShrink: 0 }}>◻<//>
                <${Typography} variant="body2" fontWeight=${500} sx=${{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                  ${h.filename}
                <//>
                <${Typography} variant="caption" color="text.secondary" sx=${{ whiteSpace: 'nowrap' }}>${h.date}<//>
                <${Box} sx=${{
                  display: 'inline-block', px: 1, py: 0.25, borderRadius: '10px',
                  bgcolor: h.status === 'Fertig' ? '#E1F5EE' : '#F1EFE8',
                  color:   h.status === 'Fertig' ? '#0F6E56' : '#5F5E5A',
                  fontSize: '11px', fontWeight: 700, whiteSpace: 'nowrap',
                }}>
                  ${h.status}
                <//>
                ${h.link
                  ? html`<${Typography} variant="caption" color="primary.main" sx=${{ cursor: 'pointer', whiteSpace: 'nowrap', '&:hover': { textDecoration: 'underline' } }}>Herunterladen<//>`
                  : html`<${Typography} variant="caption" color="text.disabled">—<//>` }
              <//>
            `)}
          <//>

        <//>
      `;
    }

    function App() {
      const [tab, setTab] = useState(0);

      return html`
        <${ThemeProvider} theme=${theme}>
          <${CssBaseline} />
          <${MockupBar} />
          <${Container} maxWidth="lg" sx=${{ py: 4 }}>

            <${Tabs} value=${tab} onChange=${(_, v) => setTab(v)} sx=${{ mb: 3, borderBottom: '1px solid', borderColor: 'divider' }}>
              <${Tab} label="Übersicht" />
              <${Tab} label="Verfügbarkeit pflegen" />
              <${Tab} label="Dispolisten-Export" />
            <//>

            ${tab === 0 && html`<${TabUebersicht} />`}
            ${tab === 1 && html`<${TabPflegen} />`}
            ${tab === 2 && html`<${TabExport} />`}

          <//>
        <//>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
