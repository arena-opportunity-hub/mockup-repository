<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verfügbarkeit & Export — Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    /* Calendar table: keep native table for the compact colored grid */
    .cal-table { border-collapse: collapse; min-width: 600px; }
    .cal-table th, .cal-table td { border: none; padding: 0; }
    .cal-th-name { font-size: 11px; font-weight: 700; color: #757575; text-transform: uppercase; letter-spacing: 0.3px; background: #fff; padding: 6px 4px; text-align: left; padding-left: 14px; min-width: 160px; }
    .cal-th-month { border-left: 1px solid #E0E0E0; font-size: 11px; font-weight: 700; color: #757575; background: #FAFAFA; padding: 4px 6px; text-align: center; }
    .cal-th-kw { width: 28px; min-width: 28px; max-width: 28px; font-size: 10px; font-weight: 400; color: #757575; border-left: 1px solid rgba(224,224,224,0.5); padding: 4px 2px; text-align: center; background: #fff; }
    .cal-td-name { position: sticky; left: 0; background: #fff; min-width: 160px; padding: 6px 14px; border-bottom: 1px solid #E0E0E0; z-index: 1; }
    .cal-td-av { width: 28px; min-width: 28px; max-width: 28px; height: 24px; border-right: 1px solid rgba(224,224,224,0.5); border-bottom: 1px solid rgba(224,224,224,0.3); cursor: pointer; }
    .cal-td-av:hover { opacity: 0.75; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/htm/dist/htm.umd.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: h, useState, useMemo } = React;
    const { createRoot } = ReactDOM;
    const { Box, Typography, Button, Paper, Container, Stack, Grid, Divider, Table, TableHead, TableBody, TableRow, TableCell, TableContainer, TextField, MenuItem, Tabs, Tab, ThemeProvider, createTheme, CssBaseline } = MaterialUI;

    const html = htm.bind(h);

    const theme = createTheme({
      palette: { primary: { main: '#1976D2' } },
      components: { MuiButton: { defaultProps: { disableElevation: true } } },
    });

    // Dispoliste-Farben (Originalwerte aus Excel-Vorlage)
    const AV_STATUS = {
      bench:                { color: '#FF0000', label: 'Bench' },
      billable:             { color: '#00B050', label: 'Billable' },
      prolongation_possible:{ color: '#B4F1B1', label: 'Prolongation möglich' },
      reserved:             { color: '#C4BD97', label: 'Reserviert' },
      offered:              { color: '#1976D2', label: 'Angeboten' },
      parttime:             { color: '#FFC000', label: 'Teilzeit' },
      absence:              { color: '#0070C0', label: 'Abwesenheit' },
      left_company:         { color: '#455A64', label: 'Ausgeschieden' },
    };

    const CONSULTANTS = [
      { name: 'Max Mustermann',  initials: 'MM', avatarColor: '#1976D2', level: 'Senior Consultant',    avKey: 'bench',                 customer: null,               offeredTo: null,              partTime: null, region: 'Bayern',            mobility: 'National',      comments: 'Sucht aktiv nach neuem Projekt.' },
      { name: 'Sandra Koch',     initials: 'SK', avatarColor: '#388E3C', level: 'Consultant',           avKey: 'billable',              customer: 'Commerzbank AG',   offeredTo: null,              partTime: null, region: 'NRW',               mobility: 'Regional',      comments: null },
      { name: 'Felix Weber',     initials: 'FW', avatarColor: '#F57C00', level: 'Consultant',           avKey: 'reserved',              customer: null,               offeredTo: null,              partTime: null, region: 'Berlin',            mobility: 'National',      comments: null },
      { name: 'Thomas Berger',   initials: 'TB', avatarColor: '#7B1FA2', level: 'Senior Consultant',    avKey: 'prolongation_possible', customer: 'Reply GmbH',       offeredTo: null,              partTime: null, region: 'Hamburg',           mobility: 'National',      comments: 'Verlängerung wahrscheinlich bis Q3 2026.' },
      { name: 'Jana Richter',    initials: 'JR', avatarColor: '#0097A7', level: 'Consultant',           avKey: 'bench',                 customer: null,               offeredTo: null,              partTime: null, region: 'Bayern',            mobility: 'Regional',      comments: null },
      { name: 'Lisa Müller',     initials: 'LM', avatarColor: '#AD1457', level: 'Principal Consultant', avKey: 'billable',              customer: 'Allianz SE',       offeredTo: null,              partTime: null, region: 'Baden-Württemberg', mobility: 'International', comments: null },
      { name: 'Klaus Becker',    initials: 'KB', avatarColor: '#455A64', level: 'Consultant',           avKey: 'offered',               customer: null,               offeredTo: 'Deutsche Bank AG', partTime: null, region: 'NRW',              mobility: 'Regional',      comments: 'Rückmeldung bis KW 23 erwartet.' },
      { name: 'Maria Schulz',    initials: 'MS', avatarColor: '#7B1FA2', level: 'Senior Consultant',    avKey: 'parttime',              customer: 'Munich Re',        offeredTo: null,              partTime: 60,   region: 'Bayern',            mobility: 'National',      comments: null },
      { name: 'Peter Hoffmann',  initials: 'PH', avatarColor: '#00838F', level: 'Principal Consultant', avKey: 'billable',              customer: 'Hypoteq AG',       offeredTo: null,              partTime: null, region: 'Hessen',            mobility: 'International', comments: null },
      { name: 'Anna Weber',      initials: 'AW', avatarColor: '#C62828', level: 'Consultant',           avKey: 'absence',               customer: null,               offeredTo: null,              partTime: null, region: 'NRW',               mobility: 'Regional',      comments: 'Elternzeit bis September 2026.' },
    ];

    const REGIONS   = [...new Set(CONSULTANTS.map(c => c.region))].sort();
    const MOBILITIES = ['Lokal', 'Regional', 'National', 'International'];

    const HISTORY = [
      { filename: 'Dispoliste_2026_KW01-52.xlsx', date: '05.05.2026, 14:21', status: 'Fertig',    link: true },
      { filename: 'Dispoliste_2026_KW01-26.xlsx', date: '28.04.2026, 09:05', status: 'Fertig',    link: true },
      { filename: 'Dispoliste_2025_KW01-52.xlsx', date: '10.01.2026, 11:40', status: 'Abgelaufen',link: false },
    ];

    function MockupBar() {
      return html`
        <${Paper} square elevation=${0} sx=${{
          position: 'sticky', top: 0, zIndex: 1100,
          borderBottom: '1px solid', borderColor: 'divider',
          px: 4, py: 1.25,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <${Typography} variant="overline" color="text.secondary">
            Mockup · <${Box} component="span" sx=${{ color: 'primary.main' }}>Verfügbarkeit & Export<//>
          <//>
          <${Button} component="a" href="../index.html" size="small">← Katalog<//>
        <//>
      `;
    }

    /* ── Tab 1: Übersicht ── */
    function TabUebersicht() {
      const [search,    setSearch]    = useState('');
      const [fStatus,   setFStatus]   = useState('');
      const [fRegion,   setFRegion]   = useState('');
      const [fMobility, setFMobility] = useState('');

      const visible = useMemo(() => CONSULTANTS.filter(c =>
        (!search    || c.name.toLowerCase().includes(search.toLowerCase())) &&
        (!fStatus   || c.avKey === fStatus) &&
        (!fRegion   || c.region === fRegion) &&
        (!fMobility || c.mobility === fMobility)
      ), [search, fStatus, fRegion, fMobility]);

      const COLS = ['Name', 'Level', 'Customer', 'Offered to', 'Comments', 'Part-Time', 'Region', 'Mobility'];

      return html`
        <${Box}>
          <!-- Filter bar -->
          <${Stack} direction="row" spacing=${1.5} sx=${{ mb: 2.5 }} flexWrap="wrap" alignItems="flex-end">
            <${TextField} size="small" placeholder="Name suchen"
              value=${search} onChange=${e => setSearch(e.target.value)} sx=${{ minWidth: 200 }} />
            <${TextField} label="Status" select size="small" value=${fStatus}
              onChange=${e => setFStatus(e.target.value)} sx=${{ minWidth: 190 }}>
              <${MenuItem} value="">Alle Status<//>
              ${Object.entries(AV_STATUS).map(([k, v]) => html`
                <${MenuItem} key=${k} value=${k}>
                  <${Stack} direction="row" alignItems="center" gap=${1}>
                    <${Box} sx=${{ width: 10, height: 10, borderRadius: '50%', bgcolor: v.color, flexShrink: 0 }} />
                    ${v.label}
                  <//>
                <//>
              `)}
            <//>
            <${TextField} label="Region" select size="small" value=${fRegion}
              onChange=${e => setFRegion(e.target.value)} sx=${{ minWidth: 190 }}>
              <${MenuItem} value="">Alle Regionen<//>
              ${REGIONS.map(r => html`<${MenuItem} key=${r} value=${r}>${r}<//>`) }
            <//>
            <${TextField} label="Mobility" select size="small" value=${fMobility}
              onChange=${e => setFMobility(e.target.value)} sx=${{ minWidth: 160 }}>
              <${MenuItem} value="">Alle<//>
              ${MOBILITIES.map(m => html`<${MenuItem} key=${m} value=${m}>${m}<//>`) }
            <//>
            <${Box} sx=${{ flex: 1 }} />
            <${Typography} variant="caption" color="text.secondary" sx=${{ alignSelf: 'center' }}>
              ${visible.length} von ${CONSULTANTS.length} Mitarbeitenden
            <//>
          <//>

          <!-- Legend -->
          <${Stack} direction="row" flexWrap="wrap" gap=${2} sx=${{ mb: 2 }}>
            ${Object.entries(AV_STATUS).map(([k, v]) => html`
              <${Stack} key=${k} direction="row" alignItems="center" spacing=${0.75}>
                <${Box} sx=${{ width: 12, height: 12, borderRadius: '2px', bgcolor: v.color, flexShrink: 0 }} />
                <${Typography} variant="caption">${v.label}<//>
              <//>
            `)}
          <//>

          <!-- Table -->
          <${TableContainer} component=${Paper} variant="outlined">
            <${Table} size="small">
              <${TableHead}>
                <${TableRow} sx=${{ bgcolor: '#FAFAFA' }}>
                  ${COLS.map(c => html`
                    <${TableCell} key=${c} sx=${{ fontWeight: 700, fontSize: '11px', textTransform: 'uppercase', letterSpacing: 0.5, color: 'text.secondary', whiteSpace: 'nowrap' }}>
                      ${c}
                    <//>
                  `)}
                <//>
              <//>
              <${TableBody}>
                ${visible.length === 0 ? html`
                  <${TableRow}>
                    <${TableCell} colSpan=${8} sx=${{ textAlign: 'center', py: 5 }}>
                      <${Typography} variant="body2" color="text.secondary">Keine Mitarbeitenden für diese Filterauswahl.<//>
                    <//>
                  <//>
                ` : visible.map(c => {
                  const av  = AV_STATUS[c.avKey] || AV_STATUS.bench;
                  return html`
                    <${TableRow} key=${c.name} hover>

                      <!-- Name + Status-Dot -->
                      <${TableCell}>
                        <${Stack} direction="row" alignItems="center" gap=${1.25}>
                          <${Box} sx=${{
                            width: 34, height: 34, borderRadius: '50%', bgcolor: c.avatarColor, color: '#fff',
                            fontWeight: 700, fontSize: '12px', flexShrink: 0,
                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                          }}>${c.initials}<//>
                          <${Box}>
                            <${Stack} direction="row" alignItems="center" gap=${0.75}>
                              <${Typography} variant="body2" fontWeight=${600}>${c.name}<//>
                              <${Box} sx=${{ width: 8, height: 8, borderRadius: '50%', bgcolor: av.color, flexShrink: 0 }} title=${av.label} />
                            <//>
                            <${Typography} variant="caption" color="text.secondary">${av.label}<//>
                          <//>
                        <//>
                      <//>

                      <!-- Level -->
                      <${TableCell}>
                        <${Typography} variant="body2">${c.level}<//>
                      <//>

                      <!-- Customer -->
                      <${TableCell}>
                        <${Typography} variant="body2" color=${c.customer ? 'text.primary' : 'text.disabled'}>
                          ${c.customer || '—'}
                        <//>
                      <//>

                      <!-- Offered to -->
                      <${TableCell}>
                        ${c.offeredTo ? html`
                          <${Box} sx=${{ display: 'inline-flex', alignItems: 'center', gap: 0.5, bgcolor: '#E3F0FC', color: '#1256A0', px: 1, py: 0.25, borderRadius: '10px', fontSize: '12px', fontWeight: 500 }}>
                            ${c.offeredTo}
                          <//>
                        ` : html`<${Typography} variant="body2" color="text.disabled">—<//>` }
                      <//>

                      <!-- Comments -->
                      <${TableCell} sx=${{ maxWidth: 220 }}>
                        <${Typography} variant="body2" color=${c.comments ? 'text.secondary' : 'text.disabled'}
                          sx=${{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: 200 }}
                          title=${c.comments || ''}>
                          ${c.comments || '—'}
                        <//>
                      <//>

                      <!-- Part-Time -->
                      <${TableCell}>
                        ${c.partTime ? html`
                          <${Box} sx=${{ display: 'inline-block', bgcolor: '#FFF8E1', color: '#8a6000', px: 1, py: 0.25, borderRadius: '10px', fontSize: '12px', fontWeight: 700 }}>
                            ${c.partTime}%
                          <//>
                        ` : html`<${Typography} variant="body2" color="text.disabled">—<//>` }
                      <//>

                      <!-- Region -->
                      <${TableCell}>
                        <${Typography} variant="body2">${c.region}<//>
                      <//>

                      <!-- Mobility -->
                      <${TableCell}>
                        <${Typography} variant="body2">${c.mobility}<//>
                      <//>

                    <//>
                  `;
                })}
              <//>
            <//>
          <//>
        <//>
      `;
    }

    /* ── Tab 2: Export ── */
    function TabExport() {
      return html`
        <${Box} sx=${{ maxWidth: 680 }}>

          <${Paper} variant="outlined" sx=${{ p: 3, mb: 2, display: 'flex', alignItems: 'center', gap: 2 }}>
            <${Box} sx=${{
              width: 40, height: 40, bgcolor: '#1D6F42', borderRadius: '6px',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              color: '#fff', fontWeight: 700, fontSize: '16px', flexShrink: 0,
            }}>X<//>
            <${Box} sx=${{ flex: 1 }}>
              <${Typography} variant="subtitle1" fontWeight=${700}>Dispoliste exportieren<//>
              <${Typography} variant="body2" color="text.secondary">
                Generiert eine Excel-Datei im Format der bekannten Dispoliste — mit Mitarbeitern als Zeilen und Kalenderwochen als Spalten, farbcodiert nach Verfügbarkeitsstatus.
              <//>
            <//>
            <${Button}
              variant="contained"
              sx=${{ bgcolor: '#1D6F42', '&:hover': { bgcolor: '#155c35' }, whiteSpace: 'nowrap', flexShrink: 0 }}
            >
              Excel exportieren
            <//>
          <//>

          <${Paper} variant="outlined" sx=${{ p: 2.5, mb: 2 }}>
            <${Typography} variant="overline" color="text.secondary" sx=${{ display: 'block', borderBottom: '1px solid', borderColor: 'divider', pb: 1.25, mb: 2 }}>
              Export-Optionen
            <//>
            <${Stack} spacing=${1.5}>
              <${Stack} direction="row" alignItems="center" spacing=${2}>
                <${Typography} variant="body2" color="text.secondary" sx=${{ minWidth: 100 }}>Jahr<//>
                <${TextField} select size="small" defaultValue="2026" sx=${{ minWidth: 80 }}>
                  <${MenuItem} value="2026">2026<//>
                  <${MenuItem} value="2025">2025<//>
                <//>
              <//>
              <${Stack} direction="row" alignItems="center" spacing=${2}>
                <${Typography} variant="body2" color="text.secondary" sx=${{ minWidth: 100 }}>Zeitraum<//>
                <${Stack} direction="row" alignItems="center" spacing=${1}>
                  <${Typography} variant="body2" color="text.secondary">Von KW<//>
                  <${TextField} select size="small" defaultValue="1" sx=${{ minWidth: 70 }}>
                    ${[1,2,3,4,5,10,20,30,40,52].map(v => html`<${MenuItem} key=${v} value=${v}>${v}<//>`) }
                  <//>
                  <${Typography} variant="body2" color="text.secondary">Bis KW<//>
                  <${TextField} select size="small" defaultValue="52" sx=${{ minWidth: 70 }}>
                    ${[1,10,20,30,40,52].map(v => html`<${MenuItem} key=${v} value=${v}>${v}<//>`) }
                  <//>
                <//>
              <//>
              <${Stack} direction="row" alignItems="center" spacing=${2}>
                <${Typography} variant="body2" color="text.secondary" sx=${{ minWidth: 100 }}>Team-Filter<//>
                <${TextField} select size="small" defaultValue="alle" sx=${{ minWidth: 140 }}>
                  <${MenuItem} value="alle">Alle Teams<//>
                  <${MenuItem} value="alpha">Team Alpha<//>
                  <${MenuItem} value="beta">Team Beta<//>
                <//>
              <//>
              <${Stack} direction="row" alignItems="center" spacing=${1}>
                <input type="checkbox" defaultChecked id="active-only" />
                <${Typography} component="label" htmlFor="active-only" variant="body2">
                  Nur aktive Mitarbeitende
                <//>
              <//>
            <//>
          <//>

          <${Typography} variant="body2" color="text.secondary" sx=${{ mb: 2 }}>
            Der Export wird asynchron generiert und du erhältst eine E-Mail-Benachrichtigung mit dem Download-Link. Dateien verfallen nach 30 Tagen.
          <//>

          <${Typography} variant="overline" color="text.secondary" sx=${{ display: 'block', mb: 1 }}>Frühere Exporte<//>
          <${Stack} spacing=${0.75}>
            ${HISTORY.map(h => html`
              <${Paper} key=${h.filename} variant="outlined" sx=${{ px: 2, py: 1.25, display: 'flex', alignItems: 'center', gap: 1.5 }}>
                <${Typography} sx=${{ fontSize: '16px', flexShrink: 0 }}>◻<//>
                <${Typography} variant="body2" fontWeight=${500} sx=${{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                  ${h.filename}
                <//>
                <${Typography} variant="caption" color="text.secondary" sx=${{ whiteSpace: 'nowrap' }}>${h.date}<//>
                <${Box} sx=${{
                  display: 'inline-block', px: 1, py: 0.25, borderRadius: '10px',
                  bgcolor: h.status === 'Fertig' ? '#E1F5EE' : '#F1EFE8',
                  color:   h.status === 'Fertig' ? '#0F6E56' : '#5F5E5A',
                  fontSize: '11px', fontWeight: 700, whiteSpace: 'nowrap',
                }}>
                  ${h.status}
                <//>
                ${h.link
                  ? html`<${Typography} variant="caption" color="primary.main" sx=${{ cursor: 'pointer', whiteSpace: 'nowrap', '&:hover': { textDecoration: 'underline' } }}>Herunterladen<//>`
                  : html`<${Typography} variant="caption" color="text.disabled">—<//>` }
              <//>
            `)}
          <//>

        <//>
      `;
    }

    function App() {
      const [tab, setTab] = useState(0);

      return html`
        <${ThemeProvider} theme=${theme}>
          <${CssBaseline} />
          <${MockupBar} />
          <${Container} maxWidth="lg" sx=${{ py: 4 }}>

            <${Tabs} value=${tab} onChange=${(_, v) => setTab(v)} sx=${{ mb: 3, borderBottom: '1px solid', borderColor: 'divider' }}>
              <${Tab} label="Übersicht" />
              <${Tab} label="Dispolisten-Export" />
            <//>

            ${tab === 0 && html`<${TabUebersicht} />`}
            ${tab === 1 && html`<${TabExport} />`}

          <//>
        <//>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
