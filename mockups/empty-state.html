<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leerer Zustand — Meine Opportunities — Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style> * { box-sizing: border-box; } body { margin: 0; } </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/htm/dist/htm.umd.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: h } = React;
    const { createRoot } = ReactDOM;
    const { Box, Typography, Button, Paper, Container, Stack, Divider,
            Table, TableHead, TableRow, TableCell, TableContainer,
            TextField, MenuItem, ThemeProvider, createTheme, CssBaseline } = MaterialUI;

    const html = htm.bind(h);

    const theme = createTheme({
      palette: { primary: { main: '#1976D2' } },
      components: { MuiButton: { defaultProps: { disableElevation: true } } },
    });

    function MockupBar() {
      return html`
        <${Paper} square elevation=${0} sx=${{
          position: 'sticky', top: 0, zIndex: 1100,
          borderBottom: '1px solid', borderColor: 'divider',
          px: 4, py: 1.25,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <${Typography} variant="overline" color="text.secondary">
            Mockup · <${Box} component="span" sx=${{ color: 'primary.main' }}>Leerer Zustand — Meine Opportunities<//>
          <//>
          <${Button} component="a" href="../index.html" size="small">← Katalog<//>
        <//>
      `;
    }

    const COLS = ['', 'Titel', 'Kunde', 'Abzugeben bis', 'Frist', 'Skills', 'Matches', 'Status', ''];

    function FilterBar({ statusValue, searchValue }) {
      return html`
        <${Stack} direction="row" spacing=${1.5} sx=${{ mb: 2 }} alignItems="flex-end" flexWrap="wrap">
          <${TextField} label="Status" select size="small" defaultValue=${statusValue || ''} sx=${{ minWidth: 140 }}>
            <${MenuItem} value="">Alle<//>
            ${['Offen', 'In Prüfung', 'Genehmigt', 'Abgeschlossen', 'Entwurf'].map(s => html`
              <${MenuItem} key=${s} value=${s}>${s}<//>
            `)}
          <//>
          <${TextField} label="Zeitraum Von" type="date" size="small"
            InputLabelProps=${{ shrink: true }} sx=${{ minWidth: 150 }} />
          <${TextField} label="Bis" type="date" size="small"
            InputLabelProps=${{ shrink: true }} sx=${{ minWidth: 150 }} />
          <${TextField} label="Suche" size="small" placeholder="Titel oder Kunde"
            defaultValue=${searchValue || ''} sx=${{ minWidth: 200 }} />
          <${Box} sx=${{ flex: 1 }} />
          <${Button} variant="outlined" size="small"
            sx=${{ borderColor: 'divider', color: 'text.secondary' }}>
            ☆ Favoriten
          <//>
          <${Button} variant="contained" size="small">+ Neue Opportunity<//>
        <//>
      `;
    }

    function TableShell() {
      return html`
        <${TableContainer} component=${Paper} variant="outlined"
          sx=${{ borderRadius: '4px 4px 0 0', borderBottom: 'none' }}>
          <${Table} size="small">
            <${TableHead}>
              <${TableRow}>
                ${COLS.map((c, i) => html`
                  <${TableCell} key=${i} sx=${{
                    fontWeight: 700, textTransform: 'uppercase',
                    fontSize: '11px', letterSpacing: 0.5, color: 'text.secondary',
                    whiteSpace: 'nowrap',
                    ...(i === 0 ? { width: 40, pr: 0 } : {}),
                  }}>
                    ${c}
                  <//>
                `)}
              <//>
            <//>
          <//>
        <//>
      `;
    }

    function EmptyCard({ icon, title, sub, actions }) {
      return html`
        <${Paper} variant="outlined" sx=${{
          borderTop: 'none', borderRadius: '0 0 4px 4px',
          textAlign: 'center', py: 8, px: 3,
        }}>
          <${Box} sx=${{
            width: 72, height: 72, borderRadius: '50%', bgcolor: '#E3F0FC',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            mx: 'auto', mb: 3, fontSize: 32,
          }}>
            ${icon}
          <//>
          <${Typography} variant="subtitle1" fontWeight=${700} gutterBottom>${title}<//>
          <${Typography} variant="body2" color="text.secondary"
            sx=${{ maxWidth: 360, mx: 'auto', mb: 3 }}>
            ${sub}
          <//>
          <${Stack} direction="row" spacing=${1} justifyContent="center">
            ${actions}
          <//>
        <//>
      `;
    }

    function App() {
      return html`
        <${ThemeProvider} theme=${theme}>
          <${CssBaseline} />
          <${MockupBar} />
          <${Container} maxWidth="lg" sx=${{ py: 4 }}>

            <${Typography} variant="overline" color="text.secondary" sx=${{ mb: 1.5, display: 'block' }}>
              Variante 1 — Noch keine Opportunities angelegt
            <//>
            <${Typography} variant="h6" fontWeight=${700} sx=${{ mb: 2 }}>Meine Opportunities<//>
            <${FilterBar} />
            <${TableShell} />
            <${EmptyCard}
              icon="🎯"
              title="Noch keine Opportunities"
              sub="Du hast noch keine Opportunities erfasst. Starte jetzt und finde passende Kandidaten für dein nächstes Projekt."
              actions=${html`<${Button} variant="contained">+ Erste Opportunity erstellen<//>`}
            />

            <${Divider} sx=${{ my: 6 }} />

            <${Typography} variant="overline" color="text.secondary" sx=${{ mb: 1.5, display: 'block' }}>
              Variante 2 — Filter ergibt keine Treffer
            <//>
            <${Typography} variant="h6" fontWeight=${700} sx=${{ mb: 2 }}>Meine Opportunities<//>
            <${FilterBar} statusValue="Genehmigt" searchValue="xyz123" />
            <${TableShell} />
            <${EmptyCard}
              icon="🔍"
              title="Keine Treffer gefunden"
              sub="Für deine aktuelle Filterauswahl gibt es keine Opportunities. Passe die Filter an oder setze sie zurück."
              actions=${html`
                <${Button} variant="outlined" color="inherit">Filter zurücksetzen<//>
              `}
            />

          <//>
        <//>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
