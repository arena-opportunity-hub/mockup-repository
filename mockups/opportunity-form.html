<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportunity erfassen — Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style> * { box-sizing: border-box; } body { margin: 0; } </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/htm/dist/htm.umd.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: h, useState, useCallback } = React;
    const { createRoot } = ReactDOM;
    const { Box, Typography, Button, Paper, Container, Stack, Grid, Divider, TextField, MenuItem, ToggleButtonGroup, ToggleButton, IconButton, Autocomplete, ThemeProvider, createTheme, CssBaseline } = MaterialUI;
    const acFilter = MaterialUI.createFilterOptions();

    const html = htm.bind(h);

    const theme = createTheme({
      palette: { primary: { main: '#1976D2' }, error: { main: '#E53935' } },
      components: { MuiButton: { defaultProps: { disableElevation: true } } },
    });

    function MockupBar() {
      return html`
        <${Paper} square elevation=${0} sx=${{
          position: 'sticky', top: 0, zIndex: 1100,
          borderBottom: '1px solid', borderColor: 'divider',
          px: 4, py: 1.25,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <${Typography} variant="overline" color="text.secondary">
            Mockup · <${Box} component="span" sx=${{ color: 'primary.main' }}>Opportunity erfassen<//>
          <//>
          <${Button} component="a" href="../index.html" size="small">← Katalog<//>
        <//>
      `;
    }

    function SectionCard({ title, children }) {
      return html`
        <${Paper} variant="outlined" sx=${{ p: 3, mb: 1.5 }}>
          <${Typography} variant="overline" color="text.secondary" sx=${{ display: 'block', mb: 2.5, borderBottom: '1px solid', borderColor: 'divider', pb: 1.5 }}>
            ${title}
          <//>
          ${children}
        <//>
      `;
    }

    const KUNDEN = [
      'Allianz SE', 'Commerzbank AG', 'Deutsche Bank AG', 'Deutsche Telekom AG',
      'Generali Deutschland', 'Munich Re', 'SAP SE', 'Siemens AG',
      'T-Systems International', 'Volkswagen AG',
    ];

    const REGIONEN = [
      'Remote', 'Deutschland',
      'Baden-Württemberg', 'Bayern', 'Berlin', 'Brandenburg', 'Bremen',
      'Hamburg', 'Hessen', 'Mecklenburg-Vorpommern', 'Niedersachsen',
      'Nordrhein-Westfalen', 'Rheinland-Pfalz', 'Saarland', 'Sachsen',
      'Sachsen-Anhalt', 'Schleswig-Holstein', 'Thüringen',
    ];

    function KundeAutocomplete() {
      const [value, setValue] = useState(null);
      return html`
        <${Autocomplete}
          value=${value}
          onChange=${(_, newVal) => {
            if (newVal && typeof newVal === 'object' && newVal.inputValue) {
              setValue(newVal.inputValue);
            } else {
              setValue(newVal);
            }
          }}
          filterOptions=${(options, params) => {
            const filtered = acFilter(options, params);
            const iv = params.inputValue;
            if (iv !== '' && !options.includes(iv)) {
              filtered.push({ inputValue: iv, label: '"' + iv + '" neu anlegen' });
            }
            return filtered;
          }}
          options=${KUNDEN}
          getOptionLabel=${opt => {
            if (typeof opt === 'string') return opt;
            if (opt.inputValue) return opt.inputValue;
            return opt.label || '';
          }}
          isOptionEqualToValue=${(opt, val) => {
            if (opt && opt.inputValue) return opt.inputValue === val;
            return opt === val;
          }}
          freeSolo
          selectOnFocus
          clearOnBlur
          handleHomeEndKeys
          fullWidth
          size="small"
          renderInput=${params => html`<${TextField} ...${params} label="Kunde / Projekt" />`}
        />
      `;
    }

    let nextId = 4;
    const INITIAL_SKILLS = [
      { id: 1, name: 'AML',        type: 'pflicht' },
      { id: 2, name: 'Compliance', type: 'pflicht' },
      { id: 3, name: 'MS Office',  type: 'optional' },
    ];

    function SkillRow({ skill, onChange, onRemove }) {
      return html`
        <${Stack} direction="row" spacing=${1.5} alignItems="center" sx=${{
          border: '1px solid', borderColor: 'divider', borderRadius: 1,
          px: 1.5, py: 0.75, bgcolor: 'background.paper',
          '&:focus-within': { borderColor: 'primary.main' },
        }}>
          <${TextField}
            variant="standard"
            placeholder="Skill"
            value=${skill.name}
            onChange=${e => onChange(skill.id, 'name', e.target.value)}
            InputProps=${{ disableUnderline: true }}
            sx=${{ flex: 1 }}
            size="small"
          />
          <${ToggleButtonGroup}
            value=${skill.type}
            exclusive
            size="small"
            onChange=${(_, v) => v && onChange(skill.id, 'type', v)}
            sx=${{ flexShrink: 0 }}
          >
            <${ToggleButton} value="pflicht" sx=${{
              px: 1.5, py: 0.25, fontSize: '11px', fontWeight: 700,
              '&.Mui-selected': { bgcolor: 'error.main', color: '#fff', '&:hover': { bgcolor: 'error.dark' } },
            }}>
              Pflicht
            <//>
            <${ToggleButton} value="optional" sx=${{
              px: 1.5, py: 0.25, fontSize: '11px', fontWeight: 700,
              '&.Mui-selected': { bgcolor: 'primary.main', color: '#fff', '&:hover': { bgcolor: 'primary.dark' } },
            }}>
              Optional
            <//>
          <//>
          <${IconButton} size="small" onClick=${() => onRemove(skill.id)} sx=${{ color: 'text.disabled', '&:hover': { color: 'error.main' } }}>
            ✕
          <//>
        <//>
      `;
    }

    function App() {
      const [skills, setSkills] = useState(INITIAL_SKILLS);

      const updateSkill = useCallback((id, field, value) => {
        setSkills(s => s.map(sk => sk.id === id ? { ...sk, [field]: value } : sk));
      }, []);

      const removeSkill = useCallback((id) => {
        setSkills(s => s.filter(sk => sk.id !== id));
      }, []);

      const addSkill = useCallback(() => {
        setSkills(s => [...s, { id: nextId++, name: '', type: 'pflicht' }]);
      }, []);

      return html`
        <${ThemeProvider} theme=${theme}>
          <${CssBaseline} />
          <${MockupBar} />
          <${Container} maxWidth="md" sx=${{ py: 4 }}>

            <${SectionCard} title="Projekt">
              <${Grid} container spacing=${2}>
                <${Grid} item xs=${12}>
                  <${TextField} label=${'Titel *'} fullWidth size="small" />
                <//>
                <${Grid} item xs=${6}>
                  <${KundeAutocomplete} />
                <//>
                <${Grid} item xs=${6}>
                  <${TextField} label="Branche" select fullWidth size="small" defaultValue="">
                    ${['Banking','Insurance','Public Sector','Healthcare','Retail','Energy','Telco','Sonstige'].map(b => html`
                      <${MenuItem} key=${b} value=${b}>${b}<//>
                    `)}
                  <//>
                <//>
                <${Grid} item xs=${6}>
                  <${TextField} label="Vertragsart" select fullWidth size="small" defaultValue="">
                    ${['Festpreis','T&M','Rahmenvertrag'].map(v => html`<${MenuItem} key=${v} value=${v}>${v}<//>`) }
                  <//>
                <//>
              <//>
            <//>

            <${SectionCard} title="Beschreibung">
              <${Grid} container spacing=${2}>
                <${Grid} item xs=${12}>
                  <${TextField} label=${'Projektziel *'} fullWidth multiline minRows=${3} size="small" />
                <//>
                <${Grid} item xs=${12}>
                  <${TextField} label="Aufgaben & Verantwortlichkeiten" fullWidth multiline minRows=${3} size="small" />
                <//>
              <//>
            <//>

            <${SectionCard} title=${'Geforderte Skills *'}>
              <${Stack} spacing=${1}>
                ${skills.map(sk => html`
                  <${SkillRow} key=${sk.id} skill=${sk} onChange=${updateSkill} onRemove=${removeSkill} />
                `)}
                <${Button}
                  variant="outlined"
                  color="inherit"
                  onClick=${addSkill}
                  sx=${{ borderStyle: 'dashed', justifyContent: 'flex-start', color: 'primary.main' }}
                >
                  + Skill hinzufügen
                <//>
              <//>
            <//>

            <${SectionCard} title="Zeitleiste & Auslastung">
              <${Grid} container spacing=${2}>
                <${Grid} item xs=${4}>
                  <${TextField} label=${'Startdatum *'} type="date" fullWidth size="small" defaultValue="2026-07-01" InputLabelProps=${{ shrink: true }} />
                <//>
                <${Grid} item xs=${4}>
                  <${TextField} label="Enddatum" type="date" fullWidth size="small" InputLabelProps=${{ shrink: true }} />
                <//>
                <${Grid} item xs=${4}>
                  <${TextField} label="Auslastung" select fullWidth size="small" defaultValue="100">
                    ${['100','75','50','25'].map(v => html`<${MenuItem} key=${v} value=${v}>${v} %<//>`) }
                  <//>
                <//>
                <${Grid} item xs=${4}>
                  <${TextField} label="Reaktionsdeadline" type="date" fullWidth size="small" InputLabelProps=${{ shrink: true }} />
                <//>
                <${Grid} item xs=${4}>
                  <${TextField} label="Positionen (Slots)" type="number" fullWidth size="small" defaultValue="1" inputProps=${{ min: 1 }} />
                <//>
                <${Grid} item xs=${4}>
                  <${TextField} label="Level" select fullWidth size="small" defaultValue="">
                    ${['Junior','Consultant','Senior Consultant','Principal','Manager'].map(v => html`<${MenuItem} key=${v} value=${v}>${v}<//>`) }
                  <//>
                <//>
              <//>
            <//>

            <${SectionCard} title="Anforderungen">
              <${Grid} container spacing=${2}>
                <${Grid} item xs=${4}>
                  <${TextField} label="Sprache" select fullWidth size="small" defaultValue="Deutsch">
                    ${['Deutsch','Englisch','Deutsch & Englisch'].map(v => html`<${MenuItem} key=${v} value=${v}>${v}<//>`) }
                  <//>
                <//>
                <${Grid} item xs=${4}>
                  <${TextField} label="Region" select fullWidth size="small" defaultValue="">
                    ${REGIONEN.map(v => html`<${MenuItem} key=${v} value=${v}>${v}<//>`) }
                  <//>
                <//>
                <${Grid} item xs=${4}>
                  <${TextField} label="Remote-Anteil" select fullWidth size="small" defaultValue="25">
                    ${['0','25','50','75','100'].map(v => html`<${MenuItem} key=${v} value=${v}>${v} %<//>`) }
                  <//>
                <//>
              <//>
            <//>

            <!-- Actions -->
            <${Paper} variant="outlined" sx=${{ px: 3, py: 2, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <${Typography} variant="caption" color="text.secondary">* Pflichtfelder<//>
              <${Stack} direction="row" spacing=${1}>
                <${Button} variant="text" color="inherit">Entwurf speichern<//>
                <${Button} variant="contained">Matches finden<//>
              <//>
            <//>

          <//>
        <//>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
