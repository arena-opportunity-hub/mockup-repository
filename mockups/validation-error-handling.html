<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VEH — Test 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .veh-spinner {
      width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.45);
      border-top-color: #fff; border-radius: 50%; display: inline-block;
      vertical-align: middle; animation: veh-spin 0.7s linear infinite;
    }
    @keyframes veh-spin { to { transform: rotate(360deg); } }
    .veh-skel { background: #ECEFF1; border-radius: 4px; animation: veh-pulse 1.2s ease-in-out infinite; }
    @keyframes veh-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/htm/dist/htm.umd.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: h, useState, useMemo, useRef } = React;
    const { createRoot } = ReactDOM;
    const { Box, Typography, Button, Paper, Container, Stack, Grid,
            TextField, Divider, Chip, Snackbar, ThemeProvider, createTheme, CssBaseline } = MaterialUI;
    const html = htm.bind(h);
    const theme = createTheme({ palette: { primary: { main: '#1976D2' }, error: { main: '#E53935' } } });

    const BANNER = {
      success: { bg: '#E1F5EE', border: '#B8E6D4', fg: '#0F6E56', icon: '✓' },
      error:   { bg: '#FCEBEB', border: '#F3C9C9', fg: '#791F1F', icon: '✕' },
      warning: { bg: '#FAEEDA', border: '#EAD3A6', fg: '#854F0B', icon: '!' },
      info:    { bg: '#E3F0FC', border: '#BBD9F5', fg: '#1256A0', icon: 'ℹ' },
    };

    function Banner({ severity = 'info', title, action, children }) {
      const c = BANNER[severity];
      return html`
        <${Box} sx=${{ display: 'flex', alignItems: 'flex-start', gap: 1.5,
          bgcolor: c.bg, border: '1px solid ' + c.border, borderRadius: 1.5, px: 2.5, py: 1.5 }}>
          <${Box} sx=${{ flexShrink: 0, width: 22, height: 22, borderRadius: '50%',
            bgcolor: c.fg, color: c.bg, fontSize: '13px', fontWeight: 700, mt: 0.25,
            display: 'flex', alignItems: 'center', justifyContent: 'center' }}>${c.icon}<//>
          <${Box} sx=${{ flex: 1 }}>
            ${title && html`<${Typography} variant="body2" fontWeight=${700} sx=${{ color: c.fg, mb: 0.25 }}>${title}<//>`}
            <${Box} sx=${{ color: c.fg, fontSize: '13px' }}>${children}<//>
          <//>
          ${action && html`<${Box} sx=${{ flexShrink: 0 }}>${action}<//>`}
        <//>
      `;
    }

    function ValidationTimingDemo() {
      const [titel, setTitel] = useState('');
      const [email, setEmail] = useState('');
      const [von, setVon] = useState('2026-09-30');
      const [bis, setBis] = useState('2026-07-01');
      const [touched, setTouched] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [saved, setSaved] = useState(false);
      const refs = { titel: useRef(null), email: useRef(null), bis: useRef(null) };

      const errors = useMemo(() => {
        const e = {};
        if (!titel.trim()) e.titel = 'Titel ist ein Pflichtfeld.';
        if (!email.trim()) e.email = 'E-Mail ist ein Pflichtfeld.';
        else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) e.email = 'Bitte gib eine gültige E-Mail ein (z. B. name@reply.de).';
        if (von && bis && von > bis) e.bis = '„Bis" muss nach „Von" liegen.';
        return e;
      }, [titel, email, von, bis]);

      const LABELS = { titel: 'Titel', email: 'E-Mail', bis: 'Zeitraum (Von / Bis)' };
      const show = (f) => (touched[f] || submitted) && errors[f];
      const mark = (f) => setTouched(t => ({ ...t, [f]: true }));
      const handleSubmit = () => { setSubmitted(true); setSaved(Object.keys(errors).length === 0); };
      const summaryKeys = submitted ? Object.keys(errors) : [];
      const jump = (k) => { const el = refs[k] && refs[k].current; if (el) { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } };

      return html`
        <${Paper} variant="outlined" sx=${{ p: 2.5 }}>
          ${saved && html`
            <${Box} sx=${{ mb: 2 }}>
              <${Banner} severity="success" title="Gespeichert">
                Alle Felder gültig — der Eintrag wurde gespeichert.
              <//>
            <//>
          `}
          ${summaryKeys.length > 0 && html`
            <${Box} sx=${{ mb: 2 }}>
              <${Banner} severity="error" title=${summaryKeys.length + (summaryKeys.length === 1 ? ' Feld muss' : ' Felder müssen') + ' korrigiert werden'}>
                <${Box} component="ul" sx=${{ m: 0, mt: 0.5, pl: 2.5 }}>
                  ${summaryKeys.map(k => html`
                    <${Box} component="li" key=${k}>
                      <${Box} component="span" onClick=${() => jump(k)} sx=${{ fontWeight: 700, textDecoration: 'underline', cursor: 'pointer' }}>${LABELS[k]}<//>: ${errors[k]}
                    <//>
                  `)}
                <//>
              <//>
            <//>
          `}
          <${Stack} spacing=${2}>
            <${TextField} label="Titel *" size="small" fullWidth inputRef=${refs.titel}
              value=${titel} onChange=${e => { setTitel(e.target.value); setSaved(false); }} onBlur=${() => mark('titel')}
              error=${!!show('titel')} helperText=${show('titel') || 'Pflichtfeld — wird beim Verlassen geprüft.'} />
            <${TextField} label="E-Mail *" size="small" fullWidth placeholder="name@reply.de" inputRef=${refs.email}
              value=${email} onChange=${e => { setEmail(e.target.value); setSaved(false); }} onBlur=${() => mark('email')}
              error=${!!show('email')} helperText=${show('email') || 'Format wird beim Verlassen geprüft.'} />
            <${Grid} container spacing=${1.5}>
              <${Grid} item xs=${6}>
                <${TextField} label="Von *" type="date" size="small" fullWidth InputLabelProps=${{ shrink: true }}
                  value=${von} onChange=${e => { setVon(e.target.value); setSaved(false); }} onBlur=${() => mark('bis')} error=${!!show('bis')} />
              <//>
              <${Grid} item xs=${6}>
                <${TextField} label="Bis *" type="date" size="small" fullWidth InputLabelProps=${{ shrink: true }} inputRef=${refs.bis}
                  value=${bis} onChange=${e => { setBis(e.target.value); setSaved(false); }} onBlur=${() => mark('bis')}
                  error=${!!show('bis')} helperText=${show('bis') || 'Feldübergreifende Prüfung.'} />
              <//>
            <//>
            <${Button} variant="contained" size="small" onClick=${handleSubmit}>Speichern<//>
          <//>
        <//>
      `;
    }

    function MockupBar() {
      return html`
        <${Paper} square elevation=${0} sx=${{
          position: 'sticky', top: 0, zIndex: 1100,
          borderBottom: '1px solid', borderColor: 'divider', px: 4, py: 1.25,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <${Typography} variant="overline" color="text.secondary">
            Mockup · <${Box} component="span" sx=${{ color: 'primary.main' }}>Validierung & Fehlerbehandlung<//>
          <//>
          <${Button} component="a" href="../index.html" size="small">← Katalog<//>
        <//>
      `;
    }

    function Section({ no, title, desc, children }) {
      return html`
        <${Box} sx=${{ mb: 5 }}>
          <${Stack} direction="row" alignItems="baseline" gap=${1.25} sx=${{ mb: 0.5 }}>
            <${Box} sx=${{ bgcolor: 'primary.main', color: '#fff', borderRadius: '6px',
              minWidth: 26, height: 26, display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: '13px', fontWeight: 700, flexShrink: 0 }}>${no}<//>
            <${Typography} variant="h6" fontWeight=${700}>${title}<//>
          <//>
          ${desc && html`<${Typography} variant="body2" color="text.secondary" sx=${{ mb: 2, ml: '38px' }}>${desc}<//>`}
          <${Box} sx=${{ ml: '38px' }}>${children}<//>
        <//>
      `;
    }

    function Rule({ children }) {
      return html`
        <${Box} sx=${{ display: 'flex', gap: 1.25, mt: 2,
          bgcolor: '#E3F0FC', border: '1px solid #BBD9F5', borderRadius: 1.5, px: 2, py: 1.25 }}>
          <${Box} sx=${{ color: '#1256A0', fontWeight: 700, fontSize: '13px', flexShrink: 0 }}>REGEL<//>
          <${Typography} variant="body2" sx=${{ color: '#1256A0', flex: 1 }}>${children}<//>
        <//>
      `;
    }

    function Discuss({ title, children }) {
      return html`
        <${Box} sx=${{ mt: 2, bgcolor: '#FAEEDA', border: '1px solid #EAD3A6', borderRadius: 1.5, px: 2, py: 1.5 }}>
          <${Stack} direction="row" gap=${1} alignItems="center" sx=${{ mb: 1 }}>
            <${Box} sx=${{ color: '#854F0B', fontWeight: 700, fontSize: '12px', letterSpacing: 0.5 }}>ZUR DISKUSSION<//>
            ${title && html`<${Typography} variant="body2" fontWeight=${700} sx=${{ color: '#854F0B' }}>${title}<//>`}
          <//>
          <${Box} sx=${{ color: '#5b3805' }}>${children}<//>
        <//>
      `;
    }

    function ErrorSummaryDemo() {
      const [open, setOpen] = useState(false);
      const errs = [
        { field: 'Projektziel',       msg: 'Pflichtfeld ist leer.' },
        { field: 'Skills',            msg: 'Mindestens ein Pflicht-Skill erforderlich.' },
        { field: 'Reaktionsdeadline', msg: 'Datum liegt in der Vergangenheit.' },
      ];
      return html`
        <${Stack} spacing=${1.5}>
          ${open && html`
            <${Banner} severity="error" title=${errs.length + ' Felder müssen korrigiert werden'}>
              <${Box} component="ul" sx=${{ m: 0, mt: 0.5, pl: 2.5 }}>
                ${errs.map(e => html`
                  <${Box} component="li" key=${e.field} sx=${{ mb: 0.25 }}>
                    <${Box} component="span" sx=${{ fontWeight: 700, textDecoration: 'underline', cursor: 'pointer' }}>${e.field}<//>: ${e.msg}
                  <//>
                `)}
              <//>
            <//>
          `}
          <${Button} variant="contained" size="small" sx=${{ alignSelf: 'flex-start' }} onClick=${() => setOpen(o => !o)}>
            ${open ? 'Zusammenfassung ausblenden' : 'Mit Fehlern absenden'}
          <//>
        <//>
      `;
    }

    const API_ERRORS = {
      validation: { sev: 'warning', label: 'Validierung', title: 'Eingabe wurde nicht akzeptiert (400)',
        body: 'Das Backend hat einzelne Felder abgelehnt. Die markierten Felder korrigieren und erneut speichern.',
        action: null, note: 'Server-Validierung. Eingaben bleiben erhalten, Fehler werden den Feldern zugeordnet.' },
      auth: { sev: 'error', label: 'Berechtigung', title: 'Keine Berechtigung (403)',
        body: 'Für diese Aktion fehlt dir die Berechtigung. Wende dich an deinen Manager oder das Service Center.',
        action: null, note: 'Kein Retry — die Aktion ist für die Rolle nicht erlaubt.' },
      notfound: { sev: 'warning', label: 'Nicht gefunden', title: 'Eintrag nicht gefunden (404)',
        body: 'Dieser Eintrag wurde zwischenzeitlich gelöscht oder verschoben. Liste neu laden, um den aktuellen Stand zu sehen.',
        action: 'Neu laden', note: 'Daten sind veraltet. Aktion = neu laden, kein blindes Wiederholen.' },
      server: { sev: 'error', label: 'Serverfehler', title: 'Serverfehler (500)',
        body: 'Beim Speichern ist ein Fehler aufgetreten. Bitte versuche es erneut. Tritt es weiter auf, beim Support melden.',
        action: 'Erneut versuchen', note: 'Vorübergehend. Retry anbieten, Eingaben nie verwerfen.' },
      network: { sev: 'error', label: 'Netzwerk', title: 'Keine Verbindung',
        body: 'Die Anfrage konnte nicht gesendet werden. Prüfe deine Internetverbindung und versuche es erneut.',
        action: 'Erneut versuchen', note: 'Netzwerk/Timeout. Retry anbieten, Eingaben bleiben erhalten.' },
    };

    function ApiErrorDemo() {
      const [kind, setKind] = useState('server');
      const cfg = API_ERRORS[kind];
      const retryBtn = cfg.action ? html`<${Button} size="small" variant="outlined" color="inherit" sx=${{ fontWeight: 700, whiteSpace: 'nowrap' }}>${cfg.action}<//>` : null;
      return html`
        <${Stack} spacing=${2}>
          <${Stack} direction="row" gap=${1} flexWrap="wrap">
            ${Object.keys(API_ERRORS).map(k => html`
              <${Chip} key=${k} label=${API_ERRORS[k].label} onClick=${() => setKind(k)}
                color=${kind === k ? 'primary' : 'default'} variant=${kind === k ? 'filled' : 'outlined'}
                sx=${{ fontWeight: 700 }} />
            `)}
          <//>
          <${Banner} severity=${cfg.sev} title=${cfg.title} action=${retryBtn}>${cfg.body}<//>
          <${Box} sx=${{ display: 'flex', gap: 1, bgcolor: '#fff', border: '1px solid', borderColor: 'divider', borderRadius: 1, px: 2, py: 1.25 }}>
            <${Box} sx=${{ fontSize: '15px', flexShrink: 0, color: 'text.secondary' }}>ℹ<//>
            <${Typography} variant="caption" color="text.secondary">${cfg.note}<//>
          <//>
        <//>
      `;
    }

    function LoadingDemo() {
      const [saving, setSaving] = useState(false);
      const [loading, setLoading] = useState(false);
      const timer = useRef(null);
      const fakeSave = () => { setSaving(true);  timer.current = setTimeout(() => setSaving(false), 1600); };
      const fakeLoad = () => { setLoading(true); timer.current = setTimeout(() => setLoading(false), 1600); };

      return html`
        <${Grid} container spacing=${2}>
          <${Grid} item xs=${12} md=${6}>
            <${Paper} variant="outlined" sx=${{ p: 2.5, height: '100%' }}>
              <${Typography} variant="subtitle2" fontWeight=${700} sx=${{ mb: 0.5 }}>Aktion läuft<//>
              <${Typography} variant="caption" color="text.secondary" sx=${{ display: 'block', mb: 2 }}>
                Button zeigt Spinner und ist gesperrt, bis die Anfrage fertig ist. Verhindert Doppel-Submit.
              <//>
              <${Button} variant="contained" size="small" disabled=${saving} onClick=${fakeSave}
                startIcon=${saving ? html`<span className="veh-spinner" />` : null}>
                ${saving ? 'Speichert …' : 'Speichern'}
              <//>
            <//>
          <//>
          <${Grid} item xs=${12} md=${6}>
            <${Paper} variant="outlined" sx=${{ p: 2.5, height: '100%' }}>
              <${Typography} variant="subtitle2" fontWeight=${700} sx=${{ mb: 0.5 }}>Daten werden geladen<//>
              <${Typography} variant="caption" color="text.secondary" sx=${{ display: 'block', mb: 2 }}>
                Skeleton-Platzhalter statt leerer Fläche. Layout bleibt stabil.
              <//>
              <${Button} variant="outlined" size="small" sx=${{ mb: 1.5 }} onClick=${fakeLoad} disabled=${loading}>Laden simulieren<//>
              ${loading ? html`
                <${Stack} spacing=${0.75}>
                  <${Box} className="veh-skel" sx=${{ height: 14, width: '70%' }} />
                  <${Box} className="veh-skel" sx=${{ height: 14, width: '90%' }} />
                  <${Box} className="veh-skel" sx=${{ height: 32, width: '100%' }} />
                <//>
              ` : html`
                <${Stack} spacing=${0.5}>
                  <${Typography} variant="body2" fontWeight=${700}>Allianz SE — IFRS9-Migration<//>
                  <${Typography} variant="body2" color="text.secondary">Start 01.07.2026 · 3 Pflicht-Skills<//>
                  <${Box} sx=${{ alignSelf: 'flex-start', bgcolor: '#E3F0FC', color: '#1256A0', fontWeight: 700, fontSize: '11px', px: 1, py: 0.25, borderRadius: '10px' }}>Offen<//>
                <//>
              `}
            <//>
          <//>
        <//>
      `;
    }

    function SuccessDemo() {
      const [snack, setSnack] = useState(false);
      const [banner, setBanner] = useState(false);
      return html`
        <${Grid} container spacing=${2}>
          <${Grid} item xs=${12} md=${6}>
            <${Paper} variant="outlined" sx=${{ p: 2.5, height: '100%' }}>
              <${Typography} variant="subtitle2" fontWeight=${700} sx=${{ mb: 0.5 }}>Snackbar (kurze Aktionen)<//>
              <${Typography} variant="caption" color="text.secondary" sx=${{ display: 'block', mb: 2 }}>
                Für Listen- und Einzelaktionen: löschen, favorisieren, archivieren. Optional „Rückgängig".
              <//>
              <${Button} variant="contained" size="small" onClick=${() => setSnack(true)}>Favorit setzen<//>
              <${Snackbar} open=${snack} autoHideDuration=${3000} onClose=${() => setSnack(false)}
                anchorOrigin=${{ vertical: 'bottom', horizontal: 'center' }} message="Als Favorit markiert"
                action=${html`<${Button} color="primary" size="small" onClick=${() => setSnack(false)}>Rückgängig<//>`} />
            <//>
          <//>
          <${Grid} item xs=${12} md=${6}>
            <${Paper} variant="outlined" sx=${{ p: 2.5, height: '100%' }}>
              <${Typography} variant="subtitle2" fontWeight=${700} sx=${{ mb: 0.5 }}>Inline-Banner (Formular gespeichert)<//>
              <${Typography} variant="caption" color="text.secondary" sx=${{ display: 'block', mb: 2 }}>
                Bleibt stehen, beschreibt die Folge der Aktion und bietet den nächsten Schritt an.
              <//>
              ${banner ? html`
                <${Banner} severity="success" title="Eintrag gespeichert"
                  action=${html`<${Button} size="small" sx=${{ color: '#0F6E56', fontWeight: 700, whiteSpace: 'nowrap' }} onClick=${() => setBanner(false)}>Weiteren anlegen<//>`}>
                  Wird beim nächsten Match-Run berücksichtigt.
                <//>
              ` : html`
                <${Button} variant="contained" size="small" onClick=${() => setBanner(true)}>Eintrag speichern<//>
              `}
            <//>
          <//>
        <//>
      `;
    }

    const SUMMARY = [
      ['Pflichtfeld leer',              'Inline unter Feld + rote Markierung',    'Beim Verlassen / beim Absenden'],
      ['Formatfehler (E-Mail, Zahl)',   'Inline mit Beispiel der korrekten Form', 'Beim Verlassen'],
      ['Feldübergreifend (Von/Bis)',    'Inline am betroffenen Feld',             'Live, sobald beide gefüllt'],
      ['Mehrere Fehler beim Absenden',  'Zusammenfassung oben + Sprung zum Feld', 'Beim Absenden'],
      ['Validierung vom Backend (400)', 'Felder markieren, Eingaben behalten',    'Nach Antwort'],
      ['Server-/Netzwerkfehler',        'Banner mit „Erneut versuchen"',          'Nach Antwort'],
      ['Kurze Aktion erfolgreich',      'Snackbar (optional Rückgängig)',         'Sofort'],
      ['Formular gespeichert',          'Inline-Erfolgs-Banner',                  'Sofort'],
    ];

    function SummaryTable() {
      return html`
        <${Paper} variant="outlined" sx=${{ overflow: 'hidden' }}>
          <${Box} sx=${{ display: 'grid', gridTemplateColumns: '1.1fr 1.4fr 1fr' }}>
            ${['Situation', 'Anzeige', 'Zeitpunkt'].map(hd => html`
              <${Box} key=${hd} sx=${{ bgcolor: '#F5F6F8', px: 2, py: 1.25, fontWeight: 700, fontSize: '12px',
                textTransform: 'uppercase', letterSpacing: 0.5, color: 'text.secondary', borderBottom: '1px solid', borderColor: 'divider' }}>${hd}<//>
            `)}
            ${SUMMARY.map((row, i) => row.map((cell, j) => html`
              <${Box} key=${i + '-' + j} sx=${{ px: 2, py: 1.25, fontSize: '13px',
                borderBottom: i < SUMMARY.length - 1 ? '1px solid' : 'none', borderColor: 'divider',
                fontWeight: j === 0 ? 700 : 400, color: j === 0 ? 'text.primary' : 'text.secondary' }}>${cell}<//>
            `))}
          <//>
        <//>
      `;
    }

    function App() {
      return html`
        <${ThemeProvider} theme=${theme}>
          <${CssBaseline} />
          <${MockupBar} />
          <${Container} maxWidth="md" sx=${{ py: 4 }}>

            <${Box} sx=${{ mb: 4 }}>
              <${Box} sx=${{ display: 'inline-block', bgcolor: '#FAEEDA', color: '#854F0B', fontWeight: 700,
                fontSize: '11px', textTransform: 'uppercase', letterSpacing: 0.5, px: 1, py: 0.25, borderRadius: '10px', mb: 1 }}>
                Entwurf · Diskussionsgrundlage
              <//>
              <${Typography} variant="h5" fontWeight=${700}>Validierung & Fehlerbehandlung<//>
              <${Typography} variant="body2" color="text.secondary" sx=${{ mt: 0.5 }}>
                App-weite UX-Konvention für Eingabe-Validierung, Fehlermeldungen, API-/Netzwerk-Fehler und Lade-/Erfolgs-Feedback.
                Grundlage für ADR und fachliches Ticket.
              <//>
            <//>

            <!-- Leitprinzipien -->
            <${Paper} variant="outlined" sx=${{ p: 2.5, mb: 5 }}>
              <${Typography} variant="overline" color="text.secondary" fontWeight=${700}>Leitprinzipien<//>
              <${Box} component="ol" sx=${{ m: 0, mt: 1, pl: 2.5, '& li': { mb: 0.75 } }}>
                <${Box} component="li"><strong>Früh, aber nicht nervig:</strong> Felder beim Verlassen prüfen, nicht bei jedem Tastendruck. Ein einmal fehlerhaftes Feld wird live nachvalidiert.<//>
                <${Box} component="li"><strong>Fehler doppelt zeigen:</strong> immer feldnah (inline), bei Absende-Fehlern zusätzlich eine Zusammenfassung oben mit Sprung zum Feld.<//>
                <${Box} component="li"><strong>Eingaben nie verwerfen:</strong> bei API- oder Netzwerkfehlern bleiben alle Eingaben erhalten und die Aktion ist wiederholbar.<//>
                <${Box} component="li"><strong>Lösungsorientierte Sprache:</strong> sagen, was zu tun ist, nicht nur was falsch ist. Deutsch, kein Techniksprech, kein HTTP-Code als Hauptaussage.<//>
                <${Box} component="li"><strong>Pflichtfelder einheitlich</strong> mit Sternchen markieren.<//>
                <${Box} component="li"><strong>Feedback passend zum Kanal:</strong> Inline-Banner fürs Formular, Snackbar für kurze Aktionen, Dialog nur für destruktive Bestätigung.<//>
              <//>
            <//>

            <${Section} no=${1} title="Inline-Validierung & Timing"
              desc="Fehler erscheinen erst beim Verlassen eines Felds, danach wird live nachvalidiert. Beim Klick auf „Speichern" mit Fehlern erscheint zusätzlich die Zusammenfassung oben (das Prinzip „Fehler doppelt zeigen").">
              <${ValidationTimingDemo} />
              <${Rule}>Validieren beim <strong>Verlassen</strong> des Felds. Ist ein Feld einmal fehlerhaft, <strong>live</strong> nachvalidieren. Beim Absenden <strong>alle</strong> Felder prüfen.<//>
            <//>

            <${Section} no=${2} title="Globale Fehler-Zusammenfassung"
              desc="Beim Absenden mit mehreren Fehlern: eine Zusammenfassung oben am Formular, mit Sprung zum Feld.">
              <${ErrorSummaryDemo} />
              <${Rule}>Bei <strong>mehreren</strong> Fehlern beim Absenden zusätzlich zur Inline-Anzeige eine Zusammenfassung oben zeigen.<//>
            <//>

            <${Section} no=${3} title="API- & Netzwerk-Fehler"
              desc="Schalte die Fehlertypen durch. Jeder Typ hat ein eigenes Verhalten — korrigierbar, wiederholbar oder Eskalation.">
              <${ApiErrorDemo} />
              <${Rule}>Fehlertypen unterscheiden: <strong>Validierung (400)</strong> → Felder markieren · <strong>Berechtigung (403)</strong> → kein Retry · <strong>Nicht gefunden (404)</strong> → neu laden · <strong>Server (500) / Netzwerk</strong> → „Erneut versuchen".<//>
            <//>

            <${Section} no=${4} title="Lade-Feedback"
              desc="Während eine Anfrage läuft, gibt das UI sichtbar Rückmeldung und sperrt Doppel-Aktionen.">
              <${LoadingDemo} />
              <${Rule}>Aktions-Buttons während der Anfrage <strong>sperren</strong> und mit Spinner versehen. Beim Laden von Daten <strong>Skeleton</strong>-Platzhalter statt leerer Fläche.<//>
            <//>

            <${Section} no=${5} title="Erfolgs-Feedback"
              desc="Erfolg sichtbar bestätigen — Kanal je nach Aktion.">
              <${SuccessDemo} />
              <${Rule}><strong>Snackbar</strong> für kurze Aktionen, optional mit „Rückgängig". <strong>Inline-Banner</strong> nach dem Speichern eines Formulars.<//>
              <${Discuss} title="Banner vs. Snackbar — wann was?">
                <${Grid} container spacing=${1.5} sx=${{ mb: 1.5 }}>
                  <${Grid} item xs=${12} sm=${6}>
                    <${Box} sx=${{ bgcolor: '#fff', border: '1px solid #EAD3A6', borderRadius: 1, p: 1.5, height: '100%' }}>
                      <${Typography} variant="body2" fontWeight=${700} sx=${{ mb: 0.5 }}>Snackbar (Toast)<//>
                      <${Box} component="ul" sx=${{ m: 0, pl: 2.25, fontSize: '13px', '& li': { mb: 0.25 } }}>
                        <${Box} component="li">verschwindet von selbst, überlagert kurz, unterbricht nicht<//>
                        <${Box} component="li">für kurze, reversible Aktionen: favorisieren, löschen mit „Rückgängig", kopiert<//>
                        <${Box} component="li"><strong>Risiko:</strong> leicht zu übersehen, weg bevor gelesen<//>
                      <//>
                    <//>
                  <//>
                  <${Grid} item xs=${12} sm=${6}>
                    <${Box} sx=${{ bgcolor: '#fff', border: '1px solid #EAD3A6', borderRadius: 1, p: 1.5, height: '100%' }}>
                      <${Typography} variant="body2" fontWeight=${700} sx=${{ mb: 0.5 }}>Inline-Banner<//>
                      <${Box} component="ul" sx=${{ m: 0, pl: 2.25, fontSize: '13px', '& li': { mb: 0.25 } }}>
                        <${Box} component="li">bleibt stehen, sitzt am Ort der Aktion im Inhaltsfluss<//>
                        <${Box} component="li">für Ergebnisse die sichtbar bleiben oder eine Handlung auslösen sollen<//>
                        <${Box} component="li"><strong>Risiko:</strong> nimmt Platz, wirkt bei zu vielen wie Rauschen<//>
                      <//>
                    <//>
                  <//>
                <//>
                <${Typography} variant="body2"><strong>Faustregel-Vorschlag:</strong> kurze Aktion ohne Folgeschritt → Snackbar. Ergebnis eines Formulars oder etwas das sichtbar bleiben/eine Handlung auslösen soll → Banner. <strong>Fehler immer als Banner</strong>, nie nur Snackbar (verschwindet, bevor gehandelt wird).<//>
              <//>
            <//>

            <${Section} no=${6} title="Übersicht der Konventionen"
              desc="Kurzreferenz für die Diskussion und das spätere ADR.">
              <${SummaryTable} />
            <//>

            <${Divider} sx=${{ my: 3 }} />
            <${Typography} variant="caption" color="text.secondary">
              Offene Diskussionspunkte fürs Daily: Soll die Validierung zentral (Schema-basiert) oder pro Formular leben?
              Wie werden Backend-Feldfehler (400) generisch auf die richtigen Felder gemappt? Brauchen wir einen globalen
              Error-Boundary / Toast-Service als Shared Infra?
            <//>
          <//>
        <//>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
