    /* ── Helper ──────────────────────────────────────────────────────── */
    function fmtDate(iso) {
      if (!iso) return '—';
      return new Date(iso + 'T00:00:00').toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
    }

    /* ── Avatar ──────────────────────────────────────────────────────── */
    function Avatar({ initials, color, size = 34 }) {
      return html`
        <${Box} sx=${{
          width: size, height: size, borderRadius: '50%',
          bgcolor: color, color: '#fff',
          fontWeight: 700, fontSize: (size * 0.38) + 'px', flexShrink: 0,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>${initials}<//>
      `;
    }

    /* ── MockupBar ───────────────────────────────────────────────────── */
    function MockupBar() {
      return html`
        <${Paper} square elevation=${0} sx=${{
          position: 'sticky', top: 0, zIndex: 1300,
          borderBottom: '1px solid', borderColor: 'divider',
          px: 4, py: 1.25, display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <${Typography} variant="overline" color="text.secondary">
            Mockup · <${Box} component="span" sx=${{ color: 'primary.main' }}>Administration — Stammdaten & Mapping<//>
          <//>
          <${Button} component="a" href="../index.html" size="small">← Katalog<//>
        <//>
      `;
    }

    /* ── DecidaloChip ────────────────────────────────────────────────── */
    function DecidaloChip({ emp }) {
      if (emp.decidaloProfileId) {
        const isManual = emp.mappingSource === 'manual';
        return html`
          <${Tooltip} title=${isManual ? 'Manuell verknüpft' : 'Automatisch gemappt'} placement="top">
            <${Box} sx=${{
              display: 'inline-flex', alignItems: 'center', gap: 0.5,
              bgcolor: isManual ? '#E3F0FC' : '#E1F5EE',
              color: isManual ? '#1256A0' : '#0F6E56',
              px: 1, py: 0.25, borderRadius: '10px',
              fontSize: '11px', fontWeight: 700, whiteSpace: 'nowrap', cursor: 'default',
            }}>
              ✓ ${isManual ? 'Manuell' : 'Gemappt'}
            <//>
          <//>
        `;
      }
      return html`
        <${Tooltip} title="Kein Decidalo-Profil zugeordnet — nicht im Matching berücksichtigt" placement="top">
          <${Box} sx=${{
            display: 'inline-flex', alignItems: 'center', gap: 0.5,
            bgcolor: '#FFF3E0', color: '#E65100',
            px: 1, py: 0.25, borderRadius: '10px',
            fontSize: '11px', fontWeight: 700, whiteSpace: 'nowrap', cursor: 'default',
          }}>
            ⚠ Kein Mapping
          <//>
        <//>
      `;
    }

    /* ── SectionHeader ───────────────────────────────────────────────── */
    function SectionHeader({ label, hint }) {
      return html`
        <${Box} sx=${{ mb: 1.5 }}>
          <${Typography} variant="overline" sx=${{
            color: 'text.secondary', fontWeight: 700, letterSpacing: 0.8,
            fontSize: '11px', display: 'block', lineHeight: 1.5,
          }}>
            ${label}
          <//>
          ${hint && html`
            <${Typography} variant="caption" color="text.secondary" sx=${{ fontStyle: 'italic', display: 'block', mt: 0.25 }}>
              ${hint}
            <//>
          `}
        <//>
      `;
    }

    /* ── EditDrawer ──────────────────────────────────────────────────── */
    function EditDrawer({ emp, onClose, onSave }) {
      const [form, setForm] = useState({
        buId: emp.buId || '',
        teamId: emp.teamId || '',
        region: emp.region || '',
        mobility: emp.mobility ?? 0,
        dayRateMin: emp.dayRateMin != null ? String(emp.dayRateMin) : '',
        isTeamlead: emp.isTeamlead || false,
        roleA: emp.roleA || '',
        roleB: emp.roleB || '',
        roleC: emp.roleC || '',
        industryExperience: emp.industryExperience.map(e => ({ ...e })),
        manualProfileId: '',
        showOverride: false,
      });

      const set = useCallback((key, value) => setForm(prev => ({ ...prev, [key]: value })), []);

      const addIndustry = useCallback(() => {
        setForm(prev => ({
          ...prev,
          industryExperience: [
            ...prev.industryExperience,
            { id: 'new_' + prev.industryExperience.length, industry: 'Banking', customer: '', years: 1, source: 'manual_admin' },
          ],
        }));
      }, []);

      const updateIndustry = useCallback((id, key, value) => {
        setForm(prev => ({
          ...prev,
          industryExperience: prev.industryExperience.map(e => e.id === id ? { ...e, [key]: value } : e),
        }));
      }, []);

      const removeIndustry = useCallback((id) => {
        setForm(prev => ({
          ...prev,
          industryExperience: prev.industryExperience.filter(e => e.id !== id),
        }));
      }, []);

      return html`
        <${Drawer} anchor="right" open=${true} onClose=${onClose}
          sx=${{ zIndex: 1400 }}
          PaperProps=${{ sx: { width: 540, display: 'flex', flexDirection: 'column' } }}>

          <!-- Drawer-Header -->
          <${Box} sx=${{
            px: 3, py: 2, borderBottom: '1px solid', borderColor: 'divider',
            display: 'flex', alignItems: 'center', gap: 1.5, flexShrink: 0,
          }}>
            <${Avatar} initials=${emp.initials} color=${emp.avatarColor} size=${40} />
            <${Box} sx=${{ flex: 1 }}>
              <${Typography} variant="subtitle1" fontWeight=${700}>${emp.firstName} ${emp.lastName}<//>
              <${Typography} variant="caption" color="text.secondary">
                ${emp.employeeNo} · ${LEVEL_LABELS[emp.level]}
              <//>
            <//>
            <${Button} size="small" color="inherit" onClick=${onClose} sx=${{ minWidth: 0, px: 1 }}>✕<//>
          <//>

          <!-- Scrollbarer Inhalt -->
          <${Box} sx=${{ flex: 1, overflowY: 'auto', px: 3, py: 3 }}>

            <!-- 1. Synchronisierte Felder (FR-50) — read-only -->
            <${SectionHeader} label="Synchronisierte Stammdaten" />
            <${Paper} variant="outlined" sx=${{ p: 2, mb: 3, bgcolor: '#FAFAFA' }}>
              <${Box} sx=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px 24px' }}>
                ${[
                  ['Name',          emp.firstName + ' ' + emp.lastName],
                  ['Personalnummer', emp.employeeNo],
                  ['E-Mail',         emp.email],
                  ['Level',          LEVEL_LABELS[emp.level]],
                  ['Vorgesetzter',   emp.managerName],
                ].map(([label, value]) => html`
                  <${Box} key=${label}>
                    <${Typography} variant="caption" color="text.secondary" sx=${{ display: 'block', fontWeight: 600, mb: 0.25 }}>${label}<//>
                    <${Typography} variant="body2">${value}<//>
                  <//>
                `)}
              <//>
            <//>

            <${Divider} sx=${{ mb: 3 }} />

            <!-- 2. Decidalo-Mapping (FR-51, FR-52, FR-53) -->
            <${SectionHeader} label="Decidalo-Mapping" />
            <${Box} sx=${{ mb: 3 }}>
              ${emp.decidaloProfileId && !form.showOverride ? html`
                <${Paper} variant="outlined" sx=${{
                  p: 2, display: 'flex', alignItems: 'center', gap: 2,
                  bgcolor: emp.mappingSource === 'manual' ? '#EEF4FC' : '#F0FBF5',
                }}>
                  <${Box} sx=${{ flex: 1 }}>
                    <${Typography} variant="body2" fontWeight=${600} sx=${{ mb: 0.25 }}>
                      ${emp.mappingSource === 'manual' ? '✓ Manuell verknüpft' : '✓ Automatisch gemappt'}
                    <//>
                    <${Typography} variant="caption" color="text.secondary">
                      Decidalo Profile-ID: <${Box} component="span" sx=${{ fontFamily: 'monospace' }}>${emp.decidaloProfileId}<//>
                    <//>
                  <//>
                  <${Button} size="small" variant="outlined" color="inherit" sx=${{ fontSize: '11px', flexShrink: 0 }}
                    onClick=${() => set('showOverride', true)}
                  >
                    Überschreiben
                  <//>
                <//>
              ` : html`
                <${Box}>
                  ${!emp.decidaloProfileId && html`
                    <${Box} sx=${{
                      bgcolor: '#FFF3E0', border: '1px solid #FFCC80', borderRadius: 1,
                      px: 2, py: 1.25, mb: 1.5,
                      display: 'flex', alignItems: 'flex-start', gap: 1,
                    }}>
                      <${Box} sx=${{ color: '#E65100', fontSize: '18px', lineHeight: 1.3 }}>⚠<//>
                      <${Box}>
                        <${Typography} variant="body2" fontWeight=${600} sx=${{ color: '#BF360C', mb: 0.25 }}>
                          Kein Decidalo-Profil zugeordnet
                        <//>
                        <${Typography} variant="caption" color="text.secondary">
                          Dieser Mitarbeitende erscheint nicht in Match-Ergebnissen.
                          Profil-ID manuell hinterlegen oder Mapping-Schlüssel klären.
                        <//>
                      <//>
                    <//>
                  `}
                  <${TextField}
                    label="Decidalo Profile-ID (manuell)"
                    size="small" fullWidth
                    value=${form.manualProfileId}
                    onChange=${e => set('manualProfileId', e.target.value)}
                    placeholder="z. B. DEC-9999"
                    helperText="Manuelles Mapping überschreibt das automatische"
                  />
                  ${form.showOverride && html`
                    <${Button} size="small" color="inherit" sx=${{ mt: 0.75, fontSize: '11px' }}
                      onClick=${() => { set('showOverride', false); set('manualProfileId', ''); }}
                    >
                      Abbrechen
                    <//>
                  `}
                <//>
              `}
            <//>

            <${Divider} sx=${{ mb: 3 }} />

            <!-- 3. Operative Felder (FR-56) -->
            <${SectionHeader} label="Operative Felder" />
            <${Stack} spacing=${2} sx=${{ mb: 3 }}>

              <${Stack} direction="row" gap=${2}>
                <${TextField} label="Business Unit" size="small" select fullWidth
                  value=${form.buId} onChange=${e => set('buId', e.target.value)}>
                  ${BU_OPTIONS.map(bu => html`<${MenuItem} key=${bu} value=${bu}>${bu}<//>`)}
                <//>
                <${TextField} label="Team" size="small" fullWidth
                  value=${form.teamId} onChange=${e => set('teamId', e.target.value)}
                  placeholder="z. B. Cloud & Infrastructure" />
              <//>

              <${Stack} direction="row" gap=${2}>
                <${TextField} label="Region / Standort" size="small" select fullWidth
                  value=${form.region} onChange=${e => set('region', e.target.value)}>
                  ${REGIONS.map(r => html`<${MenuItem} key=${r} value=${r}>${r}<//>`)}
                <//>
                <${TextField} label="Min-Tagessatz (€)" size="small" fullWidth
                  type="number" value=${form.dayRateMin}
                  onChange=${e => set('dayRateMin', e.target.value)}
                  placeholder="optional"
                  inputProps=${{ min: 0, step: 50 }} />
              <//>

              <!-- Mobilität -->
              <${Box}>
                <${Typography} variant="caption" color="text.secondary"
                  sx=${{ fontWeight: 600, display: 'block', mb: 1 }}>
                  Mobilität — ${form.mobility} · ${MOBILITY_LABELS[form.mobility]}
                <//>
                <${Box} sx=${{ px: 1 }}>
                  <${Slider}
                    value=${form.mobility}
                    onChange=${(_, v) => set('mobility', v)}
                    min=${0} max=${5} step=${1}
                    marks=${[0,1,2,3,4,5].map(v => ({ value: v, label: String(v) }))}
                    size="small"
                  />
                <//>
              <//>

              <!-- Teamlead -->
              <${Stack} direction="row" alignItems="center" gap=${1}>
                <${Checkbox}
                  size="small"
                  checked=${form.isTeamlead}
                  onChange=${e => set('isTeamlead', e.target.checked)}
                  sx=${{ p: 0.5 }}
                />
                <${Typography} variant="body2">Teamlead<//>
              <//>

            <//>

            <${Divider} sx=${{ mb: 3 }} />

            <!-- 4. Rollen A / B / C (FR-54) -->
            <${SectionHeader} label="Rollen" />
            <${Stack} spacing=${1.5} sx=${{ mb: 3 }}>
              <${TextField} label="Rolle A (Primär)" size="small" fullWidth required
                value=${form.roleA} onChange=${e => set('roleA', e.target.value)}
                placeholder="z. B. Senior Consultant" />
              <${TextField} label="Rolle B (optional)" size="small" fullWidth
                value=${form.roleB} onChange=${e => set('roleB', e.target.value)}
                placeholder="z. B. Cloud Architect" />
              <${TextField} label="Rolle C (optional)" size="small" fullWidth
                value=${form.roleC} onChange=${e => set('roleC', e.target.value)}
                placeholder="z. B. PMO" />
            <//>

            <${Divider} sx=${{ mb: 3 }} />

            <!-- 5. Branchen- & Kundenerfahrung (FR-55) -->
            <${SectionHeader} label="Branchen- & Kundenerfahrung" />
            <${Stack} spacing=${1.5} sx=${{ mb: 1.5 }}>
              ${form.industryExperience.length === 0 && html`
                <${Typography} variant="body2" color="text.secondary" sx=${{ fontStyle: 'italic' }}>
                  Noch keine Einträge vorhanden.
                <//>
              `}
              ${form.industryExperience.map(entry => html`
                <${Paper} key=${entry.id} variant="outlined" sx=${{ p: 1.5 }}>
                  <${Stack} direction="row" alignItems="flex-start" gap=${1}>
                    <${Box} sx=${{ flex: 1 }}>
                      <${Stack} direction="row" gap=${1} sx=${{ mb: 1 }}>
                        <${TextField} label="Branche" size="small" select
                          value=${entry.industry}
                          onChange=${e => updateIndustry(entry.id, 'industry', e.target.value)}
                          sx=${{ flex: 2 }}
                          disabled=${entry.source === 'decidalo'}>
                          ${INDUSTRIES.map(ind => html`<${MenuItem} key=${ind} value=${ind}>${ind}<//>`)}
                        <//>
                        <${TextField} label="Jahre" size="small" type="number"
                          value=${entry.years}
                          onChange=${e => updateIndustry(entry.id, 'years', parseInt(e.target.value) || 1)}
                          sx=${{ flex: 1 }}
                          disabled=${entry.source === 'decidalo'}
                          inputProps=${{ min: 1, max: 30 }} />
                      <//>
                      <${TextField} label="Kunde (optional)" size="small" fullWidth
                        value=${entry.customer || ''}
                        onChange=${e => updateIndustry(entry.id, 'customer', e.target.value)}
                        disabled=${entry.source === 'decidalo'} />
                    <//>
                    <!-- Quelle-Badge + Löschen -->
                    <${Box} sx=${{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 0.75, pt: 0.5 }}>
                      <${Box} sx=${{
                        fontSize: '10px', fontWeight: 700, textTransform: 'uppercase',
                        px: 0.75, py: 0.25, borderRadius: '8px', whiteSpace: 'nowrap',
                        bgcolor: entry.source === 'decidalo' ? '#E3F0FC' : '#F1EFE8',
                        color: entry.source === 'decidalo' ? '#1256A0' : '#5F5E5A',
                      }}>
                        ${entry.source === 'decidalo' ? 'Decidalo' : 'Manuell'}
                      <//>
                      ${entry.source !== 'decidalo' && html`
                        <${Button} size="small" color="error" sx=${{ minWidth: 0, px: 0.75, py: 0.25, fontSize: '13px' }}
                          onClick=${() => removeIndustry(entry.id)}>
                          ✕
                        <//>
                      `}
                    <//>
                  <//>
                <//>
              `)}
            <//>
            <${Button} variant="outlined" size="small" onClick=${addIndustry} sx=${{ mb: 3 }}>
              + Erfahrung hinzufügen
            <//>

          <//><!-- end scroll -->

          <!-- Drawer-Footer -->
          <${Box} sx=${{
            px: 3, py: 2, borderTop: '1px solid', borderColor: 'divider',
            display: 'flex', gap: 1.5, justifyContent: 'flex-end',
            flexShrink: 0, bgcolor: '#FAFAFA',
          }}>
            <${Button} color="inherit" onClick=${onClose}>Abbrechen<//>
            <${Button} variant="contained" onClick=${() => onSave(emp.id, form)}
              disabled=${!form.roleA.trim()}>
              Speichern
            <//>
          <//>

        <//>
      `;
    }

    /* ── App ─────────────────────────────────────────────────────────── */
    function App() {
      const [employees, setEmployees] = useState(INITIAL_EMPLOYEES);
      const [search, setSearch]       = useState('');
      const [filterMap, setFilterMap] = useState('alle');
      const [filterLvl, setFilterLvl] = useState('alle');
      const [drawerEmp, setDrawerEmp] = useState(null);
      const [snackOpen, setSnackOpen] = useState(false);

      const filtered = useMemo(() => employees.filter(e => {
        const q = (e.firstName + ' ' + e.lastName + ' ' + e.employeeNo).toLowerCase();
        if (search && !q.includes(search.toLowerCase())) return false;
        if (filterMap === 'gemappt'   && !e.decidaloProfileId) return false;
        if (filterMap === 'ungemappt' &&  e.decidaloProfileId) return false;
        if (filterLvl !== 'alle' && e.level !== filterLvl) return false;
        return true;
      }), [employees, search, filterMap, filterLvl]);

      const unmappedCount = useMemo(() => employees.filter(e => !e.decidaloProfileId).length, [employees]);

      const filtersActive = search || filterMap !== 'alle' || filterLvl !== 'alle';

      const handleSave = useCallback((empId, form) => {
        setEmployees(prev => prev.map(e => {
          if (e.id !== empId) return e;
          const mappingUpdate = form.manualProfileId
            ? { decidaloProfileId: form.manualProfileId, mappingSource: 'manual' }
            : {};
          return {
            ...e,
            buId: form.buId,
            teamId: form.teamId,
            region: form.region,
            mobility: form.mobility,
            dayRateMin: form.dayRateMin !== '' ? Number(form.dayRateMin) : null,
            isTeamlead: form.isTeamlead,
            roleA: form.roleA,
            roleB: form.roleB,
            roleC: form.roleC,
            industryExperience: form.industryExperience,
            ...mappingUpdate,
          };
        }));
        setDrawerEmp(null);
        setSnackOpen(true);
      }, []);

      return html`
        <${ThemeProvider} theme=${theme}>
          <${CssBaseline} />
          <${MockupBar} />

          <${Container} maxWidth="xl" sx=${{ py: 4 }}>

            <!-- Page Header -->
            <${Stack} direction="row" alignItems="flex-start" sx=${{ mb: 3 }}>
              <${Box} sx=${{ flex: 1 }}>
                <${Typography} variant="h6" fontWeight=${700}>Administration — Stammdaten & Mapping<//>
                <${Typography} variant="body2" color="text.secondary">
                  ${employees.length} Mitarbeitende synchronisiert
                  · Hub-eigene Felder hier pflegbar
                <//>
              <//>
              ${unmappedCount > 0 && html`
                <${Box} sx=${{
                  bgcolor: '#FFF3E0', color: '#E65100', border: '1px solid #FFCC80',
                  borderRadius: 1, px: 1.5, py: 0.875,
                  fontSize: '13px', fontWeight: 600,
                  display: 'flex', alignItems: 'center', gap: 0.75,
                }}>
                  ⚠ ${unmappedCount} ohne Decidalo-Mapping
                <//>
              `}
            <//>

            <!-- Filter-Leiste -->
            <${Stack} direction="row" gap=${1.5} sx=${{ mb: 2 }} flexWrap="wrap" alignItems="center">
              <${TextField}
                size="small" placeholder="Name oder Personalnummer …"
                value=${search} onChange=${e => setSearch(e.target.value)}
                sx=${{ minWidth: 260 }} />
              <${TextField} size="small" select label="Decidalo-Status"
                value=${filterMap} onChange=${e => setFilterMap(e.target.value)}
                sx=${{ minWidth: 190 }}>
                <${MenuItem} value="alle">Alle Mitarbeitenden<//>
                <${MenuItem} value="gemappt">✓ Gemappt<//>
                <${MenuItem} value="ungemappt">⚠ Kein Mapping<//>
              <//>
              <${TextField} size="small" select label="Level"
                value=${filterLvl} onChange=${e => setFilterLvl(e.target.value)}
                sx=${{ minWidth: 180 }}>
                <${MenuItem} value="alle">Alle Level<//>
                ${Object.entries(LEVEL_LABELS).map(([k, v]) => html`
                  <${MenuItem} key=${k} value=${k}>${v}<//>
                `)}
              <//>
              ${filtersActive && html`
                <${Button} variant="text" color="inherit" size="small"
                  onClick=${() => { setSearch(''); setFilterMap('alle'); setFilterLvl('alle'); }}>
                  Zurücksetzen
                <//>
              `}
              <${Typography} variant="caption" color="text.secondary" sx=${{ ml: 'auto' }}>
                ${filtered.length} von ${employees.length} Einträgen
              <//>
            <//>

            <!-- Tabelle -->
            <${TableContainer} component=${Paper} variant="outlined">
              <${Table} size="small">
                <${TableHead}>
                  <${TableRow} sx=${{ bgcolor: '#FAFAFA' }}>
                    ${[
                      'Mitarbeiter', 'BU / Team', 'Region & Mobilität',
                      'Rollen', 'Decidalo',
                    ].map(col => html`
                      <${TableCell} key=${col} sx=${{
                        fontWeight: 700, fontSize: '11px', textTransform: 'uppercase',
                        letterSpacing: 0.5, color: 'text.secondary', py: 0.75,
                        ...(col === '' ? { width: 100, textAlign: 'right' } : {}),
                      }}>${col}<//>
                    `)}
                  <//>
                <//>
                <${TableBody}>
                  ${filtered.length === 0 ? html`
                    <${TableRow}>
                      <${TableCell} colSpan=${5} sx=${{ textAlign: 'center', py: 5 }}>
                        <${Typography} variant="body2" color="text.secondary">
                          Keine Mitarbeitenden gefunden.
                        <//>
                      <//>
                    <//>
                  ` : filtered.map(emp => html`
                    <${TableRow} key=${emp.id} hover
                      onClick=${() => setDrawerEmp(emp)}
                      sx=${{
                        cursor: 'pointer',
                        bgcolor: !emp.decidaloProfileId ? 'rgba(255,152,0,0.03)' : 'inherit',
                      }}>

                      <!-- Mitarbeiter -->
                      <${TableCell}>
                        <${Stack} direction="row" alignItems="center" gap=${1.25}>
                          <${Avatar} initials=${emp.initials} color=${emp.avatarColor} size=${34} />
                          <${Box}>
                            <${Stack} direction="row" alignItems="center" gap=${0.75}>
                              <${Typography} variant="body2" fontWeight=${600}>
                                ${emp.firstName} ${emp.lastName}
                              <//>
                              ${emp.isTeamlead && html`
                                <${Box} sx=${{
                                  fontSize: '10px', fontWeight: 700,
                                  bgcolor: '#E3F0FC', color: '#1256A0',
                                  px: 0.75, py: 0.125, borderRadius: '8px',
                                }}>TL<//>
                              `}
                            <//>
                            <${Typography} variant="caption" color="text.secondary">
                              ${LEVEL_LABELS[emp.level]}
                            <//>
                          <//>
                        <//>
                      <//>

                      <!-- BU / Team -->
                      <${TableCell}>
                        <${Typography} variant="body2">${emp.buId || '—'}<//>
                        <${Typography} variant="caption" color="text.secondary">
                          ${emp.teamId || '—'}
                        <//>
                      <//>

                      <!-- Region & Mobilität -->
                      <${TableCell}>
                        <${Typography} variant="body2">${emp.region || '—'}<//>
                        <${Typography} variant="caption" color="text.secondary">
                          Mob. ${emp.mobility} · ${MOBILITY_LABELS[emp.mobility]}
                        <//>
                      <//>

                      <!-- Rollen -->
                      <${TableCell}>
                        <${Typography} variant="body2">${emp.roleA || '—'}<//>
                        ${(emp.roleB || emp.roleC) && html`
                          <${Typography} variant="caption" color="text.secondary">
                            ${[emp.roleB, emp.roleC].filter(Boolean).join(' · ')}
                          <//>
                        `}
                      <//>

                      <!-- Decidalo -->
                      <${TableCell}>
                        <${DecidaloChip} emp=${emp} />
                      <//>

                    <//>
                  `)}
                <//>
              <//>
            <//>

          <//>

          <!-- Edit-Drawer -->
          ${drawerEmp && html`
            <${EditDrawer}
              emp=${drawerEmp}
              onClose=${() => setDrawerEmp(null)}
              onSave=${handleSave}
            />
          `}

          <!-- Snackbar -->
          <${Snackbar}
            open=${snackOpen}
            autoHideDuration=${3000}
            onClose=${() => setSnackOpen(false)}
            anchorOrigin=${{ vertical: 'bottom', horizontal: 'left' }}
            message="Änderungen gespeichert."
          />

        <//>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
