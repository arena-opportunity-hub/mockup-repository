<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dokument-Links an einer Opportunity — Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style> * { box-sizing: border-box; } body { margin: 0; } </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/htm/dist/htm.umd.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: h, useState, useCallback } = React;
    const { createRoot } = ReactDOM;
    const { Box, Typography, Button, Paper, Container, Stack, Tabs, Tab, TextField, IconButton, Tooltip, ThemeProvider, createTheme, CssBaseline } = MaterialUI;

    const html = htm.bind(h);

    const theme = createTheme({
      palette: { primary: { main: '#1976D2' }, error: { main: '#E53935' } },
      components: { MuiButton: { defaultProps: { disableElevation: true } } },
    });

    function StatusPill({ label }) {
      return html`<${Box} sx=${{ display: 'inline-block', bgcolor: '#E3F0FC', color: '#1256A0', px: 1.25, py: 0.25, borderRadius: '12px', fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.4 }}>${label}<//>`;
    }
    function DaysBadge({ days }) {
      return html`<${Box} sx=${{ display: 'inline-block', bgcolor: '#FFF3E0', color: '#E65100', px: 1, py: 0.25, borderRadius: '10px', fontSize: '12px', fontWeight: 600 }}>${days} Tage<//>`;
    }

    function MockupBar() {
      return html`
        <${Paper} square elevation=${0} sx=${{ position: 'sticky', top: 0, zIndex: 1100, borderBottom: '1px solid', borderColor: 'divider', px: 4, py: 1.25, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <${Typography} variant="overline" color="text.secondary">
            Mockup · <${Box} component="span" sx=${{ color: 'primary.main' }}>Issue #570 · Dokument-Links an einer Opportunity hinterlegen<//>
          <//>
          <${Button} component="a" href="../index.html" size="small">← Katalog<//>
        <//>
      `;
    }

    const INITIAL_LINKS = [
      { id: 1, title: 'Ausschreibungsunterlagen (SharePoint)', url: 'https://reply.sharepoint.com/sites/hypoteq-rfp/ausschreibung.pdf', addedBy: 'Jannik Schröder', meta: '12.04.2026' },
      { id: 2, title: 'Kunden-Architektur-Dokument',            url: 'https://reply.sharepoint.com/sites/hypoteq-rfp/architektur-v3.docx', addedBy: 'Anna Schmidt',    meta: '15.04.2026' },
    ];

    function LinkList({ links }) {
      return html`
        <${Stack} spacing=${1}>
          ${links.map(l => html`
            <${Paper} key=${l.id} variant="outlined" sx=${{ p: 1.5, display: 'flex', alignItems: 'center', gap: 1.5 }}>
              <${Box} sx=${{ fontSize: '18px', flexShrink: 0 }}>🔗<//>
              <${Box} sx=${{ flex: 1, minWidth: 0 }}>
                <${Typography} component="a" href=${l.url} target="_blank" variant="body2" fontWeight=${700}
                  sx=${{ color: 'primary.main', textDecoration: 'none', display: 'block', '&:hover': { textDecoration: 'underline' } }}>
                  ${l.title}
                <//>
                <${Typography} variant="caption" color="text.disabled" noWrap sx=${{ display: 'block' }}>${l.url}<//>
              <//>
              <${Typography} variant="caption" color="text.secondary" sx=${{ flexShrink: 0, textAlign: 'right' }}>
                Hinzugefügt von ${l.addedBy}<${Box} component="span" sx=${{ display: 'block' }}>${l.meta}<//>
              <//>
            <//>
          `)}
        <//>
      `;
    }

    function TabDocuments() {
      const [links, setLinks] = useState(INITIAL_LINKS);
      const [title, setTitle] = useState('');
      const [url, setUrl]     = useState('');

      const add = useCallback(() => {
        if (!title.trim() || !url.trim()) return;
        setLinks(prev => [...prev, { id: prev.length + 1, title: title.trim(), url: url.trim(), addedBy: 'Jannik Schröder', meta: 'gerade eben' }]);
        setTitle(''); setUrl('');
      }, [title, url]);

      return html`
        <${Paper} variant="outlined" sx=${{ p: 3 }}>
          <${Typography} variant="overline" color="text.secondary" sx=${{ display: 'block', borderBottom: '1px solid', borderColor: 'divider', pb: 1.25, mb: 2 }}>
            Dokument-Links (${links.length})
          <//>

          <${LinkList} links=${links} />

          <${Box} sx=${{ borderTop: '1px solid', borderColor: 'divider', mt: 3, pt: 2.5 }}>
            <${Typography} variant="body2" fontWeight=${700} sx=${{ mb: 1 }}>Link hinzufügen<//>
            <${Stack} direction="row" spacing=${1.5} sx=${{ mb: 1 }}>
              <${TextField} label="Titel" size="small" fullWidth value=${title} onChange=${e => setTitle(e.target.value)} />
              <${TextField} label="URL" size="small" fullWidth value=${url} onChange=${e => setUrl(e.target.value)} />
            <//>
            <${Stack} direction="row" justifyContent="space-between" alignItems="center">
              <${Typography} variant="caption" color="text.secondary">
                Der Link ist für alle Berechtigten dieser Opportunity sichtbar.
              <//>
              <${Button} variant="contained" size="small" disabled=${!title.trim() || !url.trim()} onClick=${add}>
                Link hinzufügen
              <//>
            <//>
          <//>
        <//>
      `;
    }

    function App() {
      const [tab, setTab] = useState(2);
      return html`
        <${ThemeProvider} theme=${theme}>
          <${CssBaseline} />
          <${MockupBar} />
          <${Box} sx=${{ bgcolor: '#F5F6F8', minHeight: '100vh', pb: 6 }}>
          <${Container} maxWidth="md" sx=${{ pt: 3 }}>

            <${Paper} variant="outlined" sx=${{ p: 3, mb: 2 }}>
              <${Typography} variant="caption" color="primary.main" sx=${{ display: 'block', mb: 1, cursor: 'pointer' }}>← Opportunity-Liste<//>
              <${Box} sx=${{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 2 }}>
                <${Box} sx=${{ flex: 1, minWidth: 0 }}>
                  <${Stack} direction="row" alignItems="center" gap=${1.25} flexWrap="wrap" sx=${{ mb: 1 }}>
                    <${Typography} variant="h6" fontWeight=${700}>Backend-Projekt Datenmigration<//>
                    <${StatusPill} label="Offen" />
                  <//>
                  <${Stack} direction="row" alignItems="center" flexWrap="wrap" gap=${0} sx=${{ fontSize: '12px', color: 'text.secondary' }}>
                    <${Typography} variant="caption">Erstellt von Jannik Schröder<//>
                    <${Box} component="span" sx=${{ mx: 1.25, color: 'divider' }}>|<//>
                    <${Typography} variant="caption">12.04.2026<//>
                    <${Box} component="span" sx=${{ mx: 1.25, color: 'divider' }}>|<//>
                    <${Box} sx=${{ display: 'inline-flex', alignItems: 'center', gap: 0.5 }}>
                      <${Typography} variant="caption">Reaktionsfrist:<//>
                      <${DaysBadge} days=${3} />
                    <//>
                  <//>
                <//>
                <${Stack} direction="row" spacing=${1} sx=${{ flexShrink: 0, pt: 0.25 }}>
                  <${Button} variant="outlined" size="small">Bearbeiten<//>
                  <${Button} variant="contained" size="small">Matches neu berechnen<//>
                <//>
              <//>
            <//>

            <${Tabs} value=${tab} onChange=${(_, v) => setTab(v)} sx=${{ mb: 2.5, borderBottom: '1px solid', borderColor: 'divider' }}>
              <${Tab} label="Matches" />
              <${Tab} label="Status & Historie" />
              <${Tab} label=${html`
                <${Stack} direction="row" alignItems="center" gap=${0.75}>
                  Dokumente
                  <${Box} sx=${{ bgcolor: '#E3F0FC', color: '#1256A0', borderRadius: '10px', px: 0.875, fontSize: '11px', fontWeight: 700 }}>${INITIAL_LINKS.length}<//>
                <//>
              `} />
              <${Tab} label="Details" />
            <//>

            ${tab === 0 && html`<${Typography} variant="body2" color="text.secondary" sx=${{ fontStyle: 'italic', py: 4, textAlign: 'center' }}>Matches-Tab unverändert — siehe opportunity-details-sprint2.html.<//>`}
            ${tab === 1 && html`<${Typography} variant="body2" color="text.secondary" sx=${{ fontStyle: 'italic', py: 4, textAlign: 'center' }}>Status & Historie unverändert — siehe opportunity-details-sprint2.html.<//>`}
            ${tab === 2 && html`<${TabDocuments} />`}
            ${tab === 3 && html`<${Typography} variant="body2" color="text.secondary" sx=${{ fontStyle: 'italic', py: 4, textAlign: 'center' }}>Details unverändert — siehe opportunity-details-sprint2.html.<//>`}

          <//>
          <//>
        <//>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
