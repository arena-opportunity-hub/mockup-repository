<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportunity-Details — Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style> * { box-sizing: border-box; } body { margin: 0; } </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/htm/dist/htm.umd.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: h, useState, useCallback, useMemo } = React;
    const { createRoot } = ReactDOM;
    const { Box, Typography, Button, Paper, Container, Stack, Grid, Divider, Table, TableHead, TableBody, TableRow, TableCell, TableContainer, TextField, MenuItem, Tabs, Tab, Drawer, IconButton, Tooltip, ThemeProvider, createTheme, CssBaseline } = MaterialUI;

    const html = htm.bind(h);

    const theme = createTheme({
      palette: { primary: { main: '#1976D2' }, error: { main: '#E53935' } },
      components: { MuiButton: { defaultProps: { disableElevation: true } } },
    });

    /* ── Helpers ─────────────────────────────────────────────── */
    const STATUS_COLORS = {
      'Offen':      { bgcolor: '#E3F0FC', color: '#1256A0' },
      'Genehmigt':  { bgcolor: '#E1F5EE', color: '#0F6E56' },
      'In Prüfung': { bgcolor: '#E6F1FB', color: '#0C447C' },
      'Abgelehnt':  { bgcolor: '#FCEBEB', color: '#791F1F' },
      'Ausstehend': { bgcolor: '#FAEEDA', color: '#854F0B' },
      'Entwurf':    { bgcolor: '#F1EFE8', color: '#5F5E5A' },
    };

    function StatusPill({ label }) {
      const s = STATUS_COLORS[label] || STATUS_COLORS['Entwurf'];
      return html`
        <${Box} sx=${{
          display: 'inline-block', bgcolor: s.bgcolor, color: s.color,
          px: 1.25, py: 0.25, borderRadius: '12px',
          fontSize: '11px', fontWeight: 700, textTransform: 'uppercase',
          letterSpacing: 0.4, whiteSpace: 'nowrap',
        }}>${label}<//>
      `;
    }

    function DaysBadge({ days }) {
      let bgcolor, color;
      if (days <= 7)  { bgcolor = '#FFEBEE'; color = '#C62828'; }
      else if (days <= 14) { bgcolor = '#FFF3E0'; color = '#E65100'; }
      else            { bgcolor = '#E8F5E9'; color = '#2E7D32'; }
      return html`
        <${Box} sx=${{ display: 'inline-block', bgcolor, color, px: 1, py: 0.25, borderRadius: '10px', fontSize: '12px', fontWeight: 600, whiteSpace: 'nowrap' }}>
          ${days} Tage
        <//>
      `;
    }

    function Avatar({ initials, bgcolor }) {
      return html`
        <${Box} sx=${{
          width: 40, height: 40, borderRadius: '50%', bgcolor, color: '#fff',
          fontWeight: 700, fontSize: '14px', flexShrink: 0,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>${initials}<//>
      `;
    }

    function ScoreBar({ score, width = 160 }) {
      const color = score >= 85 ? '#2E7D32' : score >= 70 ? '#1976D2' : '#E65100';
      return html`
        <${Stack} direction="row" alignItems="center" spacing=${1.25} sx=${{ minWidth: width, flexShrink: 0 }}>
          <${Typography} variant="caption" color="text.secondary">Score<//>
          <${Box} sx=${{ flex: 1, height: 6, bgcolor: '#E0E0E0', borderRadius: '3px', overflow: 'hidden' }}>
            <${Box} sx=${{ width: score + '%', height: '100%', bgcolor: color, borderRadius: '3px' }} />
          <//>
          <${Typography} variant="body2" fontWeight=${700} sx=${{ minWidth: 24, textAlign: 'right' }}>${score}<//>
        <//>
      `;
    }

    /* ── Data ────────────────────────────────────────────────── */
    const CANDIDATES = [
      // direct (8)
      { pool:'direct',  name:'Max Mustermann',   initials:'MM',  avatarColor:'#1976D2', role:'Senior Consultant',    manager:'Anna Schmidt',  score:80, status:'Genehmigt',  comment:'Anna Schmidt: «Hervorragende Passung. Max hat exakt die benötigte AWS-Erfahrung.»', chips:[{label:'AML',matched:true},{label:'Compliance',matched:true},{label:'EU-AML-Paket',matched:true},{label:'MS Office',matched:false}] },
      { pool:'direct',  name:'Sandra Koch',      initials:'SK',  avatarColor:'#388E3C', role:'Consultant',           manager:'Anna Schmidt',  score:84, status:'In Prüfung', comment:'Anna Schmidt: «Sandra ist interessiert, ich spreche noch mit ihr.»',             chips:[{label:'AML',matched:true},{label:'Compliance',matched:true},{label:'EU-AML-Paket',matched:false},{label:'MS Office',matched:false}] },
      { pool:'direct',  name:'David Klein',      initials:'DK',  avatarColor:'#37474F', role:'Backend Developer',    manager:'Anna Schmidt',  score:83, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'Compliance',matched:true},{label:'EU-AML-Paket',matched:true},{label:'MS Office',matched:true}] },
      { pool:'direct',  name:'Julia Neumann',    initials:'JN',  avatarColor:'#6A1B9A', role:'Senior Consultant',    manager:'Klaus Bauer',   score:77, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'Compliance',matched:true},{label:'EU-AML-Paket',matched:false}] },
      { pool:'direct',  name:'Patrick Hoffmann', initials:'PH',  avatarColor:'#00838F', role:'Consultant',           manager:'Klaus Bauer',   score:75, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'Compliance',matched:false},{label:'MS Office',matched:true}] },
      { pool:'direct',  name:'Maria Keller',     initials:'MK',  avatarColor:'#AD1457', role:'Principal Consultant', manager:'Marco Lehmann', score:72, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'Compliance',matched:true},{label:'EU-AML-Paket',matched:false}] },
      { pool:'direct',  name:'Tobias Schulz',    initials:'TS',  avatarColor:'#558B2F', role:'Backend Developer',    manager:'Anna Schmidt',  score:68, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'MS Office',matched:false}] },
      { pool:'direct',  name:'Sarah Braun',      initials:'SB',  avatarColor:'#E65100', role:'Consultant',           manager:'Klaus Bauer',   score:65, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:false},{label:'Compliance',matched:true},{label:'MS Office',matched:true}] },
      // soon (12)
      { pool:'soon',    name:'Thomas Berger',    initials:'TB',  avatarColor:'#7B1FA2', role:'Senior Consultant',    manager:'Klaus Bauer',   score:78, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'Compliance',matched:true},{label:'EU-AML-Paket',matched:false}] },
      { pool:'soon',    name:'Kai Fischer',      initials:'KF',  avatarColor:'#1565C0', role:'Senior Consultant',    manager:'Marco Lehmann', score:76, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'Compliance',matched:true},{label:'EU-AML-Paket',matched:false}] },
      { pool:'soon',    name:'Lisa Müller',      initials:'LM',  avatarColor:'#0097A7', role:'Principal Consultant', manager:'Marco Lehmann', score:74, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'MS Office',matched:true},{label:'Compliance',matched:false}] },
      { pool:'soon',    name:'Nina Wagner',      initials:'NW',  avatarColor:'#2E7D32', role:'Consultant',           manager:'Anna Schmidt',  score:73, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'Compliance',matched:false},{label:'MS Office',matched:true}] },
      { pool:'soon',    name:'Robert Becker',    initials:'RB',  avatarColor:'#4527A0', role:'Principal',            manager:'Klaus Bauer',   score:71, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'Compliance',matched:true}] },
      { pool:'soon',    name:'Laura Zimmer',     initials:'LZ',  avatarColor:'#00695C', role:'Consultant',           manager:'Anna Schmidt',  score:70, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:false},{label:'Compliance',matched:true},{label:'MS Office',matched:true}] },
      { pool:'soon',    name:'Michael Krause',   initials:'MKr', avatarColor:'#C62828', role:'Senior Consultant',    manager:'Marco Lehmann', score:67, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'Compliance',matched:false}] },
      { pool:'soon',    name:'Anna Richter',     initials:'AR',  avatarColor:'#F57F17', role:'Consultant',           manager:'Klaus Bauer',   score:66, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'EU-AML-Paket',matched:false}] },
      { pool:'soon',    name:'Stefan Vogel',     initials:'SV',  avatarColor:'#01579B', role:'Backend Developer',    manager:'Anna Schmidt',  score:63, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'MS Office',matched:false}] },
      { pool:'soon',    name:'Petra Schwarz',    initials:'PS',  avatarColor:'#880E4F', role:'Consultant',           manager:'Marco Lehmann', score:61, status:'Ausstehend', comment:null, chips:[{label:'Compliance',matched:true},{label:'EU-AML-Paket',matched:false}] },
      { pool:'soon',    name:'Jan Lange',        initials:'JL',  avatarColor:'#827717', role:'Senior Consultant',    manager:'Klaus Bauer',   score:59, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:false},{label:'Compliance',matched:true}] },
      { pool:'soon',    name:'Eva Wolf',         initials:'EW',  avatarColor:'#4E342E', role:'Consultant',           manager:'Anna Schmidt',  score:57, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'Compliance',matched:false}] },
      // partial (12)
      { pool:'partial', name:'Felix Weber',      initials:'FW',  avatarColor:'#F57C00', role:'Consultant',           manager:'Anna Schmidt',  score:69, status:'In Prüfung', comment:'Anna Schmidt: «Prüfe die Verfügbarkeit noch einmal ab.»', chips:[{label:'AML',matched:true},{label:'Compliance',matched:false}] },
      { pool:'partial', name:'Chris Huber',      initials:'CH',  avatarColor:'#5C6BC0', role:'Consultant',           manager:'Marco Lehmann', score:55, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'Compliance',matched:false}] },
      { pool:'partial', name:'Sabine Hartmann',  initials:'SH',  avatarColor:'#00897B', role:'Senior Consultant',    manager:'Anna Schmidt',  score:53, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:false},{label:'MS Office',matched:true}] },
      { pool:'partial', name:'Marco Kremer',     initials:'MKr2',avatarColor:'#8D6E63', role:'Consultant',           manager:'Klaus Bauer',   score:51, status:'Ausstehend', comment:null, chips:[{label:'Compliance',matched:true},{label:'EU-AML-Paket',matched:false}] },
      { pool:'partial', name:'Claudia Bauer',    initials:'CB',  avatarColor:'#78909C', role:'Principal',            manager:'Marco Lehmann', score:49, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:false},{label:'Compliance',matched:true}] },
      { pool:'partial', name:'Daniel Schubert',  initials:'DS',  avatarColor:'#BF360C', role:'Consultant',           manager:'Anna Schmidt',  score:47, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'EU-AML-Paket',matched:false}] },
      { pool:'partial', name:'Gabi Schröder',    initials:'GS',  avatarColor:'#1A237E', role:'Senior Consultant',    manager:'Klaus Bauer',   score:45, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:false},{label:'Compliance',matched:false}] },
      { pool:'partial', name:'Hans Zimmermann',  initials:'HZ',  avatarColor:'#006064', role:'Consultant',           manager:'Marco Lehmann', score:43, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:true},{label:'MS Office',matched:false}] },
      { pool:'partial', name:'Ines Braun',       initials:'IB',  avatarColor:'#4A148C', role:'Consultant',           manager:'Anna Schmidt',  score:41, status:'Ausstehend', comment:null, chips:[{label:'Compliance',matched:false},{label:'MS Office',matched:false}] },
      { pool:'partial', name:'Klaus Werner',     initials:'KW',  avatarColor:'#263238', role:'Senior Consultant',    manager:'Klaus Bauer',   score:39, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:false},{label:'EU-AML-Paket',matched:false}] },
      { pool:'partial', name:'Lena Meyer',       initials:'LMy', avatarColor:'#B71C1C', role:'Consultant',           manager:'Marco Lehmann', score:37, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:false},{label:'Compliance',matched:false}] },
      { pool:'partial', name:'Markus Peters',    initials:'MP',  avatarColor:'#33691E', role:'Consultant',           manager:'Anna Schmidt',  score:35, status:'Ausstehend', comment:null, chips:[{label:'AML',matched:false},{label:'MS Office',matched:false}] },
    ];

    const GROUPS = [
      { pool: 'direct',  label: 'Sofort verfügbar',    subtitle: 'Status: Bench / Reserviert — bereit für sofortige Projekte', headerBg: '#2E7D32', countColor: '#2E7D32' },
      { pool: 'soon',    label: 'Bald verfügbar',       subtitle: 'Wird voraussichtlich frei ab 01.07.2026',                    headerBg: '#E65100', countColor: '#E65100' },
      { pool: 'partial', label: 'Teilweise verfügbar',  subtitle: 'Verfügbar mit eingeschränkter Kapazität (50 %)',             headerBg: '#B71C1C', countColor: '#B71C1C' },
    ];

    const POOL_CONFIG = {
      direct:  { status: 'Sofort verfügbar (Bench)',    sub: 'Derzeit auf Bench — sofort einsetzbar',          dotColor: '#2E7D32', factor: '× 1,0' },
      soon:    { status: 'Bald verfügbar',               sub: 'Frei ab ca. 01.07.2026 (Prolongation endet)',    dotColor: '#E65100', factor: '× 1,0' },
      partial: { status: 'Teilweise verfügbar (50 %)',   sub: 'Kapazität eingeschränkt — teilzeitig einsetzbar', dotColor: '#B71C1C', factor: '× 0,7' },
    };

    const TIMELINE = [
      { icon: '➕', dotClass: 'grey',   title: 'Opportunity erstellt',       desc: 'von Jannik Schröder',                                                      meta: 'vor 3 Tagen',    comment: null },
      { icon: '◎',  dotClass: 'blue',   title: 'Matching gestartet',         desc: '6 Kandidaten gefunden: 3 sofort verfügbar, 2 bald, 1 teilweise',           meta: 'vor 3 Tagen',    comment: null },
      { icon: '✉',  dotClass: 'blue',   title: 'Manager informiert',         desc: 'Anna Schmidt, Klaus Bauer, Marco Lehmann per E-Mail benachrichtigt',       meta: 'vor 3 Tagen',    comment: null },
      { icon: '✓',  dotClass: 'green',  title: 'Genehmigt — Max Mustermann', desc: null,                                                                         meta: 'gestern, 14:32', comment: 'Anna Schmidt: «Hervorragende Passung. Max hat exakt die benötigte AWS-Erfahrung.»' },
      { icon: '⏸',  dotClass: 'yellow', title: 'In Prüfung — Sandra Koch',   desc: null,                                                                         meta: 'gestern, 14:35', comment: 'Anna Schmidt: «Sandra ist interessiert, ich spreche noch mit ihr.»' },
      { icon: '⏸',  dotClass: 'yellow', title: 'In Prüfung — Felix Weber',   desc: null,                                                                         meta: 'heute, 09:14',   comment: 'Anna Schmidt: «Prüfe die Verfügbarkeit.»' },
    ];

    const DOT_COLORS = {
      grey:   { bgcolor: '#F1EFE8', color: '#5F5E5A' },
      blue:   { bgcolor: '#E3F0FC', color: '#1976D2' },
      green:  { bgcolor: '#E1F5EE', color: '#0F6E56' },
      yellow: { bgcolor: '#FAEEDA', color: '#854F0B' },
    };

    /* ── MockupBar ───────────────────────────────────────────── */
    function MockupBar() {
      return html`
        <${Paper} square elevation=${0} sx=${{
          position: 'sticky', top: 0, zIndex: 1100,
          borderBottom: '1px solid', borderColor: 'divider',
          px: 4, py: 1.25,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <${Typography} variant="overline" color="text.secondary">
            Mockup · <${Box} component="span" sx=${{ color: 'primary.main' }}>Opportunity-Details<//>
          <//>
          <${Button} component="a" href="../index.html" size="small">← Katalog<//>
        <//>
      `;
    }

    const PAGE_SIZE = 25;

    /* ── Tab: Matches ────────────────────────────────────────── */
    function TabMatches({ onOpenDrawer }) {
      const [fStatus,      setFStatus]      = useState('');
      const [fManager,     setFManager]     = useState('');
      const [fPool,        setFPool]        = useState('');
      const [visibleCount, setVisibleCount] = useState(PAGE_SIZE);

      const resetPage = useCallback(() => setVisibleCount(PAGE_SIZE), []);

      const filtered = useMemo(() => CANDIDATES.filter(c =>
        (!fStatus  || c.status  === fStatus) &&
        (!fManager || c.manager === fManager) &&
        (!fPool    || c.pool    === fPool)
      ), [fStatus, fManager, fPool]);

      const visible   = useMemo(() => filtered.slice(0, visibleCount), [filtered, visibleCount]);
      const remaining = filtered.length - visible.length;

      return html`
        <${Box}>
          <${Stack} direction="row" spacing=${1.5} sx=${{ mb: 2.5 }} flexWrap="wrap">
            <${TextField} label="Status" select size="small" value=${fStatus}
              onChange=${e => { setFStatus(e.target.value); resetPage(); }} sx=${{ minWidth: 150 }}>
              <${MenuItem} value="">Status: Alle<//>
              ${['Ausstehend','Genehmigt','In Prüfung','Abgelehnt'].map(s =>
                html`<${MenuItem} key=${s} value=${s}>${s}<//>`)}
            <//>
            <${TextField} label="Manager" select size="small" value=${fManager}
              onChange=${e => { setFManager(e.target.value); resetPage(); }} sx=${{ minWidth: 160 }}>
              <${MenuItem} value="">Manager: Alle<//>
              ${['Anna Schmidt','Klaus Bauer','Marco Lehmann'].map(s =>
                html`<${MenuItem} key=${s} value=${s}>${s}<//>`)}
            <//>
            <${TextField} label="Pool" select size="small" value=${fPool}
              onChange=${e => { setFPool(e.target.value); resetPage(); }} sx=${{ minWidth: 170 }}>
              <${MenuItem} value="">Pool: Alle<//>
              <${MenuItem} value="direct">Sofort verfügbar<//>
              <${MenuItem} value="soon">Bald verfügbar<//>
              <${MenuItem} value="partial">Teilweise verfügbar<//>
            <//>
          <//>

          ${GROUPS.filter(g => !fPool || g.pool === fPool).map(g => {
            const poolTotal = filtered.filter(c => c.pool === g.pool).length;
            const rows      = visible.filter(c => c.pool === g.pool);
            const hidden    = poolTotal - rows.length;
            return html`
              <${Box} key=${g.pool} sx=${{ mb: 3.5 }}>
                <${Box} sx=${{
                  bgcolor: g.headerBg, color: '#fff', borderRadius: 1,
                  px: 2, py: 1.125, display: 'flex', alignItems: 'center', gap: 1.25, mb: 0.75,
                }}>
                  <${Box} component="span" sx=${{ fontSize: '18px' }}>●<//>
                  <${Typography} variant="body2" fontWeight=${700} sx=${{ flex: 1, color: '#fff' }}>${g.label}<//>
                  <${Box} sx=${{
                    bgcolor: '#fff', color: g.countColor,
                    px: 1, py: 0.25, borderRadius: '10px', fontSize: '12px', fontWeight: 700,
                  }}>
                    ${poolTotal} Kandidaten
                  <//>
                <//>
                <${Typography} variant="caption" color="text.secondary" sx=${{ display: 'block', mb: 1, ml: 0.5, fontStyle: 'italic' }}>
                  ${g.subtitle}
                <//>

                ${poolTotal === 0
                  ? html`
                    <${Box} sx=${{ border: '1px dashed', borderColor: 'divider', borderRadius: 1, textAlign: 'center', py: 1.75 }}>
                      <${Typography} variant="body2" color="text.secondary" sx=${{ fontStyle: 'italic' }}>
                        Keine Kandidaten für diese Filterauswahl.
                      <//>
                    <//>
                  `
                  : html`
                    ${rows.map(c => html`
                      <${Paper} key=${c.name} variant="outlined" onClick=${() => onOpenDrawer(c)} sx=${{
                        p: 2, mb: 0.75, display: 'flex', alignItems: 'center', gap: 1.75,
                        cursor: 'pointer', transition: 'box-shadow 0.15s',
                        '&:hover': { boxShadow: '0 2px 8px rgba(0,0,0,0.10)' },
                      }}>
                        <${Avatar} initials=${c.initials} bgcolor=${c.avatarColor} />
                        <${Box} sx=${{ flex: 1, minWidth: 0 }}>
                          <${Typography} variant="body2" fontWeight=${700}>${c.name}<//>
                          <${Typography} variant="caption" color="text.secondary" sx=${{ display: 'block', mb: 0.75 }}>${c.role}<//>
                          <${Stack} direction="row" flexWrap="wrap" gap=${0.5}>
                            ${c.chips.map(ch => html`
                              <${Box} key=${ch.label} sx=${{
                                display: 'inline-block', px: 1, py: 0.25, borderRadius: '12px', fontSize: '12px',
                                bgcolor: ch.matched ? '#E1F5EE' : '#FCEBEB',
                                color:   ch.matched ? '#0F6E56' : '#791F1F',
                              }}>${ch.label}<//>
                            `)}
                          <//>
                        <//>
                        <${Stack} alignItems="flex-end" sx=${{ flexShrink: 0, minWidth: 110 }}>
                          <${Typography} variant="caption" color="text.secondary">Führungskraft<//>
                          <${Typography} variant="body2" fontWeight=${500}>${c.manager}<//>
                        <//>
                        <${ScoreBar} score=${c.score} />
                        ${c.comment
                          ? html`
                            <${Tooltip} title=${c.comment} arrow placement="top">
                              <${Box} sx=${{ display: 'inline-block', cursor: 'help' }}>
                                <${StatusPill} label=${c.status} />
                              <//>
                            <//>`
                          : html`<${StatusPill} label=${c.status} />`
                        }
                      <//>
                    `)}
                    ${hidden > 0 && html`
                      <${Box} sx=${{ border: '1px dashed', borderColor: 'divider', borderRadius: 1, textAlign: 'center', py: 1.25, mb: 0.75 }}>
                        <${Typography} variant="caption" color="text.secondary" sx=${{ fontStyle: 'italic' }}>
                          + ${hidden} weitere Kandidaten — unten laden
                        <//>
                      <//>
                    `}
                  `
                }
              <//>
            `;
          })}

          <!-- Pagination footer -->
          <${Box} sx=${{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', pt: 0.5, pb: 1 }}>
            <${Typography} variant="caption" color="text.secondary">
              ${visible.length} von ${filtered.length} Kandidaten angezeigt
            <//>
            ${remaining > 0 && html`
              <${Button}
                variant="outlined" color="inherit" size="small"
                onClick=${() => setVisibleCount(v => v + PAGE_SIZE)}
                sx=${{ borderColor: 'divider' }}
              >
                Mehr laden (${remaining})
              <//>
            `}
          <//>
        <//>
      `;
    }

    /* ── Tab: Status & Historie ──────────────────────────────── */
    function TabHistory() {
      return html`
        <${Paper} variant="outlined" sx=${{ p: 3 }}>
          <${Typography} variant="overline" color="text.secondary" sx=${{ display: 'block', borderBottom: '1px solid', borderColor: 'divider', pb: 1.25, mb: 0.5 }}>
            Aktivitäts-Timeline
          <//>
          <${Box}>
            ${TIMELINE.map((item, i) => {
              const dc = DOT_COLORS[item.dotClass];
              return html`
                <${Stack} key=${i} direction="row" gap=${2} sx=${{ py: 1.75, borderBottom: i < TIMELINE.length - 1 ? '1px solid' : 'none', borderColor: 'divider' }}>
                  <${Stack} alignItems="center" sx=${{ flexShrink: 0, width: 32 }}>
                    <${Box} sx=${{ width: 32, height: 32, borderRadius: '50%', bgcolor: dc.bgcolor, color: dc.color, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '14px', flexShrink: 0 }}>
                      ${item.icon}
                    <//>
                    ${i < TIMELINE.length - 1 && html`<${Box} sx=${{ width: '2px', flex: 1, bgcolor: 'divider', mt: 0.75 }} />`}
                  <//>
                  <${Box} sx=${{ flex: 1, minWidth: 0 }}>
                    <${Typography} variant="body2" fontWeight=${600} sx=${{ mb: 0.25 }}>${item.title}<//>
                    ${item.desc && html`<${Typography} variant="body2" color="text.secondary" sx=${{ mb: 0.5 }}>${item.desc}<//>` }
                    ${item.comment && html`
                      <${Box} sx=${{ bgcolor: '#F5F6F8', borderLeft: '3px solid', borderColor: 'divider', px: 1.5, py: 1, my: 0.75, borderRadius: '0 2px 2px 0' }}>
                        <${Typography} variant="body2" sx=${{ lineHeight: 1.6 }}>${item.comment}<//>
                      <//>
                    `}
                    <${Typography} variant="caption" color="text.disabled">${item.meta}<//>
                  <//>
                <//>
              `;
            })}
          <//>
        <//>
      `;
    }

    /* ── Tab: Details ────────────────────────────────────────── */
    function TabDetails() {
      const PROJECT = [
        ['Kunde', 'Hypoteq AG'], ['Branche', 'Banking'], ['Vertragsart', 'T&M'],
        ['Startdatum', '01.07.2026'], ['Enddatum', '31.12.2026'], ['Auslastung', '100 %'],
        ['Level', 'Senior Consultant'], ['Region', 'Deutschland'], ['Remote-Anteil', '25 %'],
        ['Sprache', 'Deutsch'], ['Abzugeben bis', '30.05.2026'],
      ];
      const SKILL_CATEGORIES = [
        { key: 'domain',          label: 'Domain' },
        { key: 'tool',            label: 'Tool' },
        { key: 'method',          label: 'Methode' },
        { key: 'soft',            label: 'Soft Skill' },
        { key: 'language',        label: 'Sprache' },
        { key: 'industry_system', label: 'Branche / System' },
      ];
      const SKILLS = [
        { cat: 'domain',          name: 'AML',          type: 'pflicht'  },
        { cat: 'domain',          name: 'Compliance',   type: 'pflicht'  },
        { cat: 'industry_system', name: 'EU-AML-Paket', type: 'pflicht'  },
        { cat: 'tool',            name: 'MS Office',    type: 'optional' },
      ];
      return html`
        <${Stack} spacing=${1.5}>
          <${Paper} variant="outlined" sx=${{ p: 3 }}>
            <${Typography} variant="overline" color="text.secondary" sx=${{ display: 'block', borderBottom: '1px solid', borderColor: 'divider', pb: 1.25, mb: 2 }}>
              Projektdaten
            <//>
            <${Grid} container spacing=${2.25}>
              ${PROJECT.map(([label, val]) => html`
                <${Grid} key=${label} item xs=${4}>
                  <${Typography} variant="caption" color="text.secondary" sx=${{ fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.5, display: 'block', mb: 0.25 }}>
                    ${label}
                  <//>
                  <${Typography} variant="body2" fontWeight=${500}>${val}<//>
                <//>
              `)}
            <//>
          <//>

          <${Paper} variant="outlined" sx=${{ p: 3 }}>
            <${Typography} variant="overline" color="text.secondary" sx=${{ display: 'block', borderBottom: '1px solid', borderColor: 'divider', pb: 1.25, mb: 2 }}>
              Beschreibung
            <//>
            <${Grid} container spacing=${2.5}>
              <${Grid} item xs=${6}>
                <${Typography} variant="body2" fontWeight=${700} sx=${{ mb: 0.75 }}>Projektziel<//>
                <${Typography} variant="body2" color="text.secondary" sx=${{ lineHeight: 1.65 }}>
                  Migration der bestehenden On-Premise-Datenpipelines auf eine AWS-basierte Cloud-Infrastruktur. Ziel ist die Skalierbarkeit und Ausfallsicherheit der Datenmigration im Rahmen des strategischen Cloud-Programms der Hypoteq AG.
                <//>
              <//>
              <${Grid} item xs=${6}>
                <${Typography} variant="body2" fontWeight=${700} sx=${{ mb: 0.75 }}>Aufgaben & Verantwortlichkeiten<//>
                <${Typography} variant="body2" color="text.secondary" sx=${{ lineHeight: 1.65 }}>
                  Entwurf und Implementierung der Migrationsstrategie, enge Zusammenarbeit mit dem Kunden-Architekten-Team, Dokumentation der Schnittstellen sowie technische Abnahme der migrierten Datenpipelines.
                <//>
              <//>
            <//>
          <//>

          <${Paper} variant="outlined" sx=${{ p: 3 }}>
            <${Typography} variant="overline" color="text.secondary" sx=${{ display: 'block', borderBottom: '1px solid', borderColor: 'divider', pb: 1.25, mb: 2 }}>
              Geforderte Skills
            <//>
            <${Stack} spacing=${2}>
              ${SKILL_CATEGORIES
                .map(cat => ({ ...cat, skills: SKILLS.filter(sk => sk.cat === cat.key) }))
                .filter(cat => cat.skills.length > 0)
                .map(cat => html`
                  <${Box} key=${cat.key}>
                    <${Box} sx=${{ display: 'flex', alignItems: 'center', gap: 1, mb: 0.75 }}>
                      <${Typography} variant="caption" color="text.secondary" sx=${{ fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.5 }}>
                        ${cat.label}
                      <//>
                      <${Box} sx=${{ width: 18, height: 18, borderRadius: '50%', bgcolor: '#E3F0FC', color: '#1256A0', fontSize: '11px', fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                        ${cat.skills.length}
                      <//>
                    <//>
                    <${Stack} spacing=${0.625}>
                      ${cat.skills.map(sk => html`
                        <${Box} key=${sk.name} sx=${{
                          display: 'flex', alignItems: 'center', gap: 1.5,
                          border: '1px solid', borderColor: 'divider', borderRadius: 1, px: 1.75, py: 1,
                        }}>
                          <${Typography} variant="body2" fontWeight=${500} sx=${{ flex: 1 }}>${sk.name}<//>
                          <${Box} sx=${{
                            display: 'inline-block',
                            bgcolor: sk.type === 'pflicht' ? '#FCEBEB' : '#E3F0FC',
                            color:   sk.type === 'pflicht' ? '#791F1F' : '#1256A0',
                            px: 1.25, py: 0.25, borderRadius: '12px',
                            fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.4,
                          }}>
                            ${sk.type === 'pflicht' ? 'Pflicht' : 'Optional'}
                          <//>
                        <//>
                      `)}
                    <//>
                  <//>
                `)
              }
            <//>
          <//>
        <//>
      `;
    }

    /* ── Score Drawer ────────────────────────────────────────── */
    function ScoreDrawer({ candidate, onClose }) {
      if (!candidate) return null;
      const cfg        = POOL_CONFIG[candidate.pool] || POOL_CONFIG.soon;
      const score      = candidate.score;
      const scoreColor = score >= 85 ? '#2E7D32' : score >= 70 ? '#1976D2' : '#E65100';

      function ScoreComponent({ name, level, barPct, barColor, points, pointsColor }) {
        return html`
          <${Stack} direction="row" alignItems="center" gap=${1.25} sx=${{ py: 1.125, borderBottom: '1px solid', borderColor: 'divider', '&:last-child': { borderBottom: 'none' } }}>
            <${Typography} variant="body2" fontWeight=${500} sx=${{ flex: 1 }}>${name}<//>
            <${Typography} variant="caption" color="text.secondary" sx=${{ minWidth: 130, textAlign: 'right' }}>${level}<//>
            <${Box} sx=${{ width: 80 }}>
              <${Box} sx=${{ height: 5, bgcolor: '#E0E0E0', borderRadius: '3px', overflow: 'hidden' }}>
                <${Box} sx=${{ width: barPct + '%', height: '100%', bgcolor: barColor, borderRadius: '3px' }} />
              <//>
            <//>
            <${Typography} variant="body2" fontWeight=${700} sx=${{ minWidth: 48, textAlign: 'right', color: pointsColor }}>${points}<//>
          <//>
        `;
      }

      function SectionLabel({ children }) {
        return html`
          <${Typography} variant="overline" color="text.secondary" sx=${{ display: 'block', borderBottom: '1px solid', borderColor: 'divider', pb: 1, mb: 1.25, lineHeight: 1.6 }}>
            ${children}
          <//>
        `;
      }

      return html`
        <${Box} sx=${{ width: 520, maxWidth: '95vw', height: '100%', display: 'flex', flexDirection: 'column' }}>

          <!-- Header -->
          <${Box} sx=${{ borderBottom: '1px solid', borderColor: 'divider', px: 2.5, py: 1.75, flexShrink: 0 }}>
            <${Stack} direction="row" alignItems="center" gap=${1.5}>
              <${Avatar} initials=${candidate.initials} bgcolor=${candidate.avatarColor} />
              <${Box} sx=${{ flex: 1, minWidth: 0 }}>
                <${Stack} direction="row" alignItems="center" gap=${1} flexWrap="wrap" sx=${{ mb: 0.25 }}>
                  <${Typography} variant="subtitle1" fontWeight=${700}>${candidate.name}<//>
                  <${StatusPill} label=${candidate.status} />
                <//>
                <${Typography} variant="caption" color="text.secondary">
                  ${candidate.role} · ${candidate.manager}
                <//>
              <//>
              <${IconButton} onClick=${onClose} size="small" sx=${{ color: 'text.disabled', '&:hover': { color: 'text.primary' }, flexShrink: 0 }}>✕<//>
            <//>
          <//>

          <!-- Scrollable content -->
          <${Box} sx=${{ flex: 1, overflowY: 'auto', px: 2.5, py: 2.5 }}>

            <!-- Score summary -->
            <${Box} sx=${{ mb: 2.5 }}>
              <${SectionLabel}>Gesamt-Match-Score<//>
              <${Stack} direction="row" alignItems="center" gap=${2.5}>
                <${Box} sx=${{
                  width: 72, height: 72, borderRadius: '50%', flexShrink: 0,
                  border: '4px solid ' + scoreColor,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  <${Typography} sx=${{ fontSize: '26px', fontWeight: 700, lineHeight: 1, color: scoreColor }}>
                    ${score}
                  <//>
                <//>
                <${Box} sx=${{ flex: 1 }}>
                  <${Box} sx=${{ height: 8, bgcolor: '#E0E0E0', borderRadius: '4px', overflow: 'hidden', mb: 1 }}>
                    <${Box} sx=${{ width: score + '%', height: '100%', bgcolor: scoreColor, borderRadius: '4px' }} />
                  <//>
                  <${Stack} direction="row" justifyContent="space-between">
                    <${Typography} variant="caption" color="text.secondary">0<//>
                    <${Typography} variant="caption" color="text.secondary">Rohwert × Verfügbarkeitsfaktor<//>
                    <${Typography} variant="caption" color="text.secondary">100<//>
                  <//>
                <//>
              <//>
            <//>

            <!-- Pflichtskills -->
            <${Box} sx=${{ mb: 2 }}>
              <${SectionLabel}>
                Pflichtskills <${Box} component="span" sx=${{ fontStyle: 'italic', fontWeight: 400, textTransform: 'none', fontSize: '11px' }}>— Gewicht 65 %<//>
              <//>
              <${ScoreComponent} name="AML"          level="Nachgewiesen"     barPct=${100} barColor="#E53935" points="+21,7" pointsColor="#C62828" />
              <${ScoreComponent} name="Compliance"   level="Nachgewiesen"     barPct=${100} barColor="#E53935" points="+21,7" pointsColor="#C62828" />
              <${ScoreComponent} name="EU-AML-Paket" level="Nachgewiesen"     barPct=${100} barColor="#E53935" points="+21,7" pointsColor="#C62828" />
              <${Typography} variant="caption" color="text.secondary" sx=${{ display: 'block', textAlign: 'right', mt: 0.75 }}>
                Zwischensumme: <strong>65 / 65 Punkte</strong>
              <//>
            <//>

            <!-- Optionale Skills -->
            <${Box} sx=${{ mb: 2 }}>
              <${SectionLabel}>
                Optionale Skills <${Box} component="span" sx=${{ fontStyle: 'italic', fontWeight: 400, textTransform: 'none', fontSize: '11px' }}>— Gewicht 20 %<//>
              <//>
              <${ScoreComponent} name="MS Office" level="Nicht nachgewiesen" barPct=${0} barColor="#1976D2" points="+0" pointsColor="#9E9E9E" />
              <${Typography} variant="caption" color="text.secondary" sx=${{ display: 'block', textAlign: 'right', mt: 0.75 }}>
                Zwischensumme: <strong>0 / 20 Punkte</strong>
              <//>
            <//>

            <!-- Domain Fit -->
            <${Box} sx=${{ mb: 2 }}>
              <${SectionLabel}>
                Domain Fit <${Box} component="span" sx=${{ fontStyle: 'italic', fontWeight: 400, textTransform: 'none', fontSize: '11px' }}>— Gewicht 15 %<//>
              <//>
              <${ScoreComponent} name="Banking" level="Erfahrung vorhanden" barPct=${100} barColor="#2E7D32" points="+15" pointsColor="#2E7D32" />
              <${Typography} variant="caption" color="text.secondary" sx=${{ display: 'block', textAlign: 'right', mt: 0.75 }}>
                Zwischensumme: <strong>15 / 15 Punkte</strong>
              <//>
            <//>

            <!-- Verfügbarkeitsfaktor & Berechnung -->
            <${Box} sx=${{ mb: candidate.comment ? 2 : 0 }}>
              <${SectionLabel}>Verfügbarkeitsfaktor<//>
              <${Box} sx=${{ border: '1px solid', borderColor: 'divider', borderRadius: 1, px: 2, py: 1.25, display: 'flex', alignItems: 'center', gap: 1.75, mb: 1.25 }}>
                <${Box} sx=${{ width: 12, height: 12, borderRadius: '50%', bgcolor: cfg.dotColor, flexShrink: 0 }} />
                <${Box} sx=${{ flex: 1 }}>
                  <${Typography} variant="body2" fontWeight=${700}>${cfg.status}<//>
                  <${Typography} variant="caption" color="text.secondary">${cfg.sub}<//>
                <//>
                <${Typography} sx=${{ fontSize: '18px', fontWeight: 700, color: cfg.dotColor }}>${cfg.factor}<//>
              <//>
              <${Box} sx=${{ bgcolor: '#F5F6F8', borderRadius: 1, px: 2, py: 1.25, lineHeight: 1.8, fontSize: '13px' }}>
                Rohwert = 65 + 0 + 15 = <strong style=${{ color: '#1976D2' }}>80 Punkte</strong><br/>
                Score = 80 × <strong style=${{ color: '#1976D2' }}>${cfg.factor.replace('×', '').trim()}</strong> = <strong style=${{ color: scoreColor }}>${score}</strong>
              <//>
            <//>

            <!-- Führungskraft-Kommentar (read-only) -->
            ${candidate.comment && html`
              <${Box}>
                <${SectionLabel}>Führungskraft-Kommentar<//>
                <${Box} sx=${{ bgcolor: '#F5F6F8', borderLeft: '3px solid #1976D2', px: 1.5, py: 1.25, borderRadius: '0 4px 4px 0' }}>
                  <${Typography} variant="body2" sx=${{ fontSize: '13px', lineHeight: 1.7 }}>${candidate.comment}<//>
                <//>
              <//>
            `}

          <//>

        <//>
      `;
    }

    /* ── App ─────────────────────────────────────────────────── */
    function App() {
      const [tab,       setTab]       = useState(0);
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [drawerCandidate, setDrawerCandidate] = useState(null);

      const openDrawer  = useCallback(c => { setDrawerCandidate(c); setDrawerOpen(true); }, []);
      const closeDrawer = useCallback(() => setDrawerOpen(false), []);

      return html`
        <${ThemeProvider} theme=${theme}>
          <${CssBaseline} />
          <${MockupBar} />

          <${Container} maxWidth="md" sx=${{ py: 4 }}>

            <!-- Page header -->
            <${Paper} variant="outlined" sx=${{ p: 3, mb: 2 }}>
              <${Typography} variant="caption" color="primary.main" sx=${{ display: 'block', mb: 1, cursor: 'pointer' }}>
                ← Opportunity-Liste
              <//>
              <${Box} sx=${{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 2 }}>
                <${Box} sx=${{ flex: 1, minWidth: 0 }}>
                  <${Stack} direction="row" alignItems="center" gap=${1.25} flexWrap="wrap" sx=${{ mb: 1 }}>
                    <${Typography} variant="h6" fontWeight=${700}>Backend-Projekt Datenmigration<//>
                    <${StatusPill} label="Offen" />
                  <//>
                  <${Stack} direction="row" alignItems="center" flexWrap="wrap" gap=${0} sx=${{ fontSize: '12px', color: 'text.secondary' }}>
                    <${Typography} variant="caption">Erstellt von Jannik Schröder<//>
                    <${Box} component="span" sx=${{ mx: 1.25, color: 'divider' }}>|<//>
                    <${Typography} variant="caption">12.04.2026<//>
                    <${Box} component="span" sx=${{ mx: 1.25, color: 'divider' }}>|<//>
                    <${Box} sx=${{ display: 'inline-flex', alignItems: 'center', gap: 0.5, whiteSpace: 'nowrap' }}>
                      <${Typography} variant="caption">Reaktionsfrist:<//>
                      <${DaysBadge} days=${3} />
                    <//>
                    <${Box} component="span" sx=${{ mx: 1.25, color: 'divider' }}>|<//>
                    <${Typography} variant="caption">1 Position<//>
                  <//>
                <//>
                <${Stack} direction="row" spacing=${1} sx=${{ flexShrink: 0, pt: 0.25 }}>
                  <${Button} variant="outlined" color="inherit" size="small">Archivieren<//>
                  <${Button} variant="outlined" size="small">Bearbeiten<//>
                  <${Button} variant="contained" size="small">Matches neu berechnen<//>
                <//>
              <//>
            <//>

            <!-- Tabs -->
            <${Tabs} value=${tab} onChange=${(_, v) => setTab(v)} sx=${{ mb: 2.5, borderBottom: '1px solid', borderColor: 'divider' }}>
              <${Tab} label=${html`<${Stack} direction="row" alignItems="center" gap=${0.75}>Matches <${Box} sx=${{ bgcolor: '#E3F0FC', color: '#1256A0', borderRadius: '10px', px: 0.875, fontSize: '11px', fontWeight: 700 }}>${CANDIDATES.length}<//>  <//>` } />
              <${Tab} label="Status & Historie" />
              <${Tab} label="Details" />
            <//>

            ${tab === 0 && html`<${TabMatches} onOpenDrawer=${openDrawer} />`}
            ${tab === 1 && html`<${TabHistory} />`}
            ${tab === 2 && html`<${TabDetails} />`}

          <//>

          <!-- Score Drawer -->
          <${Drawer}
            anchor="right"
            open=${drawerOpen}
            onClose=${closeDrawer}
            PaperProps=${{ sx: { width: 520, maxWidth: '95vw' } }}
          >
            <${ScoreDrawer} candidate=${drawerCandidate} onClose=${closeDrawer} />
          <//>

        <//>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
