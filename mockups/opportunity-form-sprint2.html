<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportunity erfassen / bearbeiten — Sprint 2 Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style> * { box-sizing: border-box; } body { margin: 0; } </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/htm/dist/htm.umd.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: h, useState, useCallback, useMemo } = React;
    const { createRoot } = ReactDOM;
    const { Box, Typography, Button, Paper, Container, Stack, Grid, TextField, MenuItem,
            ToggleButtonGroup, ToggleButton, IconButton, Autocomplete, Chip,
            ThemeProvider, createTheme, CssBaseline } = MaterialUI;

    const html = htm.bind(h);

    const theme = createTheme({
      palette: { primary: { main: '#1976D2' }, error: { main: '#E53935' } },
      components: { MuiButton: { defaultProps: { disableElevation: true } } },
    });

    /* ── Helpers ─────────────────────────────────────────────── */
    function MockupBar() {
      return html`
        <${Paper} square elevation=${0} sx=${{
          position: 'sticky', top: 0, zIndex: 1100,
          borderBottom: '1px solid', borderColor: 'divider',
          px: 4, py: 1.25,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <${Typography} variant="overline" color="text.secondary">
            Mockup · <${Box} component="span" sx=${{ color: 'primary.main' }}>Opportunity erfassen / bearbeiten · Sprint 2<//>
          <//>
          <${Button} component="a" href="../index.html" size="small">← Katalog<//>
        <//>
      `;
    }

    function SectionCard({ title, children }) {
      return html`
        <${Paper} variant="outlined" sx=${{ p: 3, mb: 1.5 }}>
          <${Typography} variant="overline" color="text.secondary" sx=${{ display: 'block', mb: 2.5, borderBottom: '1px solid', borderColor: 'divider', pb: 1.5 }}>
            ${title}
          <//>
          ${children}
        <//>
      `;
    }

    function FieldLabel({ children }) {
      return html`
        <${Typography} variant="caption" color="text.secondary" sx=${{ fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.5, display: 'block', mb: 0.75 }}>
          ${children}
        <//>
      `;
    }

    /* ── Stammdaten ──────────────────────────────────────────── */
    const KUNDEN = [
      'Allianz SE', 'Commerzbank AG', 'Deutsche Bank AG', 'Deutsche Telekom AG',
      'Generali Deutschland', 'Munich Re', 'SAP SE', 'Siemens AG',
      'T-Systems International', 'Volkswagen AG',
    ];

    const REGIONEN = [
      'Remote', 'Deutschland',
      'Baden-Württemberg', 'Bayern', 'Berlin', 'Brandenburg', 'Bremen',
      'Hamburg', 'Hessen', 'Mecklenburg-Vorpommern', 'Niedersachsen',
      'Nordrhein-Westfalen', 'Rheinland-Pfalz', 'Saarland', 'Sachsen',
      'Sachsen-Anhalt', 'Schleswig-Holstein', 'Thüringen',
    ];

    const acFilter = MaterialUI.createFilterOptions ? MaterialUI.createFilterOptions() : (o, p) => o.filter(x => x.toLowerCase().includes(p.inputValue.toLowerCase()));

    function KundeAutocomplete() {
      const [value, setValue] = useState(null);
      return html`
        <${Autocomplete}
          value=${value}
          onChange=${(_, newVal) => {
            if (newVal && typeof newVal === 'object' && newVal.inputValue) {
              setValue(newVal.inputValue);
            } else {
              setValue(newVal);
            }
          }}
          filterOptions=${(options, params) => {
            const filtered = acFilter(options, params);
            const iv = params.inputValue;
            if (iv !== '' && !options.includes(iv)) {
              filtered.push({ inputValue: iv, label: '"' + iv + '" neu anlegen' });
            }
            return filtered;
          }}
          options=${KUNDEN}
          getOptionLabel=${opt => {
            if (typeof opt === 'string') return opt;
            if (opt.inputValue) return opt.inputValue;
            return opt.label || '';
          }}
          isOptionEqualToValue=${(opt, val) => {
            if (opt && opt.inputValue) return opt.inputValue === val;
            return opt === val;
          }}
          freeSolo selectOnFocus clearOnBlur handleHomeEndKeys
          fullWidth size="small"
          renderInput=${params => html`<${TextField} ...${params} label="Kunde / Projekt" />`}
        />
      `;
    }

    /* ── Skill-Katalog ───────────────────────────────────────── */
    const SKILL_CATALOG = [
      'AML', 'Asset Management', 'Banking', 'BPMN', 'Business Analysis',
      'Capital Markets', 'Compliance', 'Confluence', 'Credit Risk', 'DSGVO',
      'EU-AML-Paket', 'Excel', 'JIRA', 'MiFID II', 'MS Office',
      'Power BI', 'Regulatorik', 'Risk Management', 'Scrum', 'Trade Finance',
    ];

    const SYSTEM_CATALOG = ['Avaloq', 'Corebanking', 'Finanz Informatik', 'Murex', 'SAP FSCM', 'SWIFT'];

    let nextId = 10;
    const INITIAL_SKILLS = [
      { id: 1, name: 'AML', type: 'verpflichtend' },
      { id: 2, name: 'Compliance', type: 'verpflichtend' },
      { id: 3, name: 'EU-AML-Paket', type: 'optional' },
      { id: 4, name: 'MS Office', type: 'optional' },
    ];

    /* ── SkillRow ────────────────────────────────────────────── */
    function SkillRow({ skill, catalog, onUpdate, onRemove }) {
      return html`
        <${Stack} direction="row" spacing=${1} alignItems="center" sx=${{
          border: '1px solid',
          borderColor: 'divider',
          borderRadius: 1,
          px: 1.5, py: 0.625,
          bgcolor: 'background.paper',
          transition: 'border-color 0.15s',
          '&:focus-within': { borderColor: 'primary.main' },
        }}>

          <${Autocomplete}
            freeSolo
            value=${skill.name || null}
            inputValue=${skill.name}
            onInputChange=${(_, val, reason) => {
              if (reason === 'input') {
                onUpdate('name', val);
              }
            }}
            onChange=${(_, newVal) => {
              const name = typeof newVal === 'string' ? newVal : '';
              onUpdate('name', name);
            }}
            options=${catalog}
            size="small"
            sx=${{ flex: 1 }}
            disableClearable
            renderInput=${params => html`
              <${TextField} ...${params} variant="standard"
                placeholder="Skill eingeben …"
                InputProps=${{ ...params.InputProps, disableUnderline: true }}
                sx=${{ '& input': { fontSize: '14px' } }}
              />
            `}
          />

          <${ToggleButtonGroup}
            value=${skill.type} exclusive size="small"
            onChange=${(_, v) => v && onUpdate('type', v)}
            sx=${{ flexShrink: 0 }}
          >
            <${ToggleButton} value="verpflichtend" sx=${{
              px: 1.25, py: 0.25, fontSize: '11px', fontWeight: 700,
              '&.Mui-selected': { bgcolor: 'error.main', color: '#fff', '&:hover': { bgcolor: 'error.dark' } },
            }}>Verpflichtend<//>
            <${ToggleButton} value="optional" sx=${{
              px: 1.25, py: 0.25, fontSize: '11px', fontWeight: 700,
              '&.Mui-selected': { bgcolor: 'primary.main', color: '#fff', '&:hover': { bgcolor: 'primary.dark' } },
            }}>Optional<//>
          <//>

          <${IconButton} size="small" onClick=${onRemove}
            sx=${{ color: 'text.disabled', '&:hover': { color: 'error.main' } }}>✕<//>
        <//>
      `;
    }

    /* ── App ─────────────────────────────────────────────────── */
    function App() {

      /* Skills */
      const [skills, setSkills] = useState(INITIAL_SKILLS);

      const addSkill = useCallback(() => {
        setSkills(prev => [...prev, { id: nextId++, name: '', type: 'verpflichtend' }]);
      }, []);

      const updateSkill = useCallback((id, field, value) => {
        setSkills(prev => prev.map(sk => sk.id === id ? { ...sk, [field]: value } : sk));
      }, []);

      const removeSkill = useCallback(id => {
        setSkills(prev => prev.filter(sk => sk.id !== id));
      }, []);

      const verpflichtendCount = useMemo(
        () => skills.filter(sk => sk.type === 'verpflichtend' && (sk.name || '').trim()).length,
        [skills],
      );
      const optionalCount = useMemo(
        () => skills.filter(sk => sk.type === 'optional' && (sk.name || '').trim()).length,
        [skills],
      );

      /* Timeline */
      const [customerSystems, setCustomerSystems] = useState([]);

      const [startMode, setStartMode] = useState('date');   // 'asap' | 'month' | 'date'
      const [startDate, setStartDate] = useState('2026-07-01');
      const [startMonth, setStartMonth] = useState('2026-07');
      const [endMode,   setEndMode]   = useState('date');   // 'date' | 'duration'
      const [endDate,   setEndDate]   = useState('');
      const [duration,  setDuration]  = useState('');

      const computedEnd = useMemo(() => {
        if (endMode !== 'duration' || !duration || isNaN(parseInt(duration, 10))) return null;
        let base;
        if      (startMode === 'date')  base = startDate  ? new Date(startDate + 'T00:00:00') : null;
        else if (startMode === 'month') base = startMonth ? new Date(startMonth + '-01T00:00:00') : null;
        else                            base = new Date();
        if (!base) return null;
        base.setMonth(base.getMonth() + parseInt(duration, 10));
        return base.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
      }, [startMode, startDate, startMonth, endMode, duration]);

      return html`
        <${ThemeProvider} theme=${theme}>
          <${CssBaseline} />
          <${MockupBar} />
          <${Container} maxWidth="md" sx=${{ py: 4 }}>

            <!-- ── Projekt ── -->
            <${SectionCard} title="Projekt">
              <${Grid} container spacing=${2}>
                <${Grid} item xs=${12}>
                  <${TextField} label=${'Titel *'} fullWidth size="small" />
                <//>
                <${Grid} item xs=${6}>
                  <${KundeAutocomplete} />
                <//>
                <${Grid} item xs=${6}>
                  <${TextField} label="Branche" select fullWidth size="small" defaultValue="">
                    ${['Banking','Insurance','Public Sector','Healthcare','Retail','Energy','Telco','Sonstige'].map(b => html`
                      <${MenuItem} key=${b} value=${b}>${b}<//>
                    `)}
                  <//>
                <//>
                <${Grid} item xs=${6}>
                  <${TextField} label="Vertragsart" select fullWidth size="small" defaultValue="">
                    ${['T&M','Turnkey', 'ANÜ'].map(v => html`<${MenuItem} key=${v} value=${v}>${v}<//>`) }
                  <//>
                <//>
                <${Grid} item xs=${6}>
                  <${TextField}
                    label="Externe RefID"
                    placeholder="z. B. BPM-123456"
                    helperText="Optional, zur Nachverfolgung in externen Systemen"
                    fullWidth
                    size="small"
                  />
                <//>
              <//>
            <//>

            <!-- ── Beschreibung ── -->
            <${SectionCard} title="Beschreibung">
              <${Grid} container spacing=${2}>
                <${Grid} item xs=${12}>
                  <${TextField} label=${'Projektziel *'} fullWidth multiline minRows=${3} size="small" />
                <//>
                <${Grid} item xs=${12}>
                  <${TextField} label="Aufgaben & Verantwortlichkeiten" fullWidth multiline minRows=${3} size="small" />
                <//>
              <//>
            <//>

            <!-- ── Skills ── -->
            <${SectionCard} title=${'Geforderte Skills *'}>

              <${Box} sx=${{
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'space-between',
                gap: 2,
                bgcolor: '#F7F9FC',
                border: '1px solid',
                borderColor: 'divider',
                borderRadius: 1,
                px: 2,
                py: 1.25,
                mb: 2,
              }}>
                <${Typography} variant="body2" color="text.secondary">
                  Skills werden als flache Liste gepflegt. Die Einstufung steuert die Gewichtung im Matching.
                <//>
                <${Stack} direction="row" spacing=${1} sx=${{ flexShrink: 0 }}>
                  <${Chip} size="small" label=${`${verpflichtendCount} verpflichtend`} sx=${{ bgcolor: '#FFEBEE', color: '#B71C1C', fontWeight: 700 }} />
                  <${Chip} size="small" label=${`${optionalCount} optional`} sx=${{ bgcolor: '#E3F2FD', color: '#0D47A1', fontWeight: 700 }} />
                <//>
              <//>

              <${Stack} spacing=${0.75}>
                ${skills.map(skill => html`
                  <${SkillRow}
                    key=${skill.id}
                    skill=${skill}
                    catalog=${SKILL_CATALOG}
                    onUpdate=${(field, val) => updateSkill(skill.id, field, val)}
                    onRemove=${() => removeSkill(skill.id)}
                  />
                `)}
                <${Button}
                  variant="outlined"
                  color="inherit"
                  size="small"
                  onClick=${addSkill}
                  sx=${{ borderStyle: 'dashed', justifyContent: 'flex-start', color: 'text.secondary', borderColor: 'divider', fontSize: '12px', py: 0.5 }}
                >
                  + Skill hinzufügen
                <//>
              <//>

            <//>

            <!-- ── Zeitleiste & Auslastung ── -->
            <${SectionCard} title="Zeitleiste & Auslastung">
              <${Grid} container spacing=${2.5}>

                <!-- Startdatum -->
                <${Grid} item xs=${12}>
                  <${FieldLabel}>Startdatum *<//>
                  <${Stack} direction="row" spacing=${1.5} alignItems="center" flexWrap="wrap">
                    <${ToggleButtonGroup}
                      value=${startMode} exclusive size="small"
                      onChange=${(_, v) => v && setStartMode(v)}
                    >
                      <${ToggleButton} value="asap"  sx=${{ px: 2, py: 0.5, fontSize: '12px', fontWeight: 700 }}>ASAP<//>
                      <${ToggleButton} value="month" sx=${{ px: 2, py: 0.5, fontSize: '12px', fontWeight: 700 }}>Nur Monat<//>
                      <${ToggleButton} value="date"  sx=${{ px: 2, py: 0.5, fontSize: '12px', fontWeight: 700 }}>Genaues Datum<//>
                    <//>

                    ${startMode === 'asap' && html`
                      <${Box} sx=${{ bgcolor: '#E3F0FC', color: '#1256A0', px: 1.5, py: 0.625, borderRadius: 1, fontSize: '13px', fontWeight: 500 }}>
                        Start so früh wie möglich
                      <//>
                    `}
                    ${startMode === 'month' && html`
                      <${TextField}
                        label="Monat / Jahr" type="month" size="small"
                        value=${startMonth} onChange=${e => setStartMonth(e.target.value)}
                        InputLabelProps=${{ shrink: true }} sx=${{ minWidth: 180 }}
                      />
                    `}
                    ${startMode === 'date' && html`
                      <${TextField}
                        label="Datum" type="date" size="small"
                        value=${startDate} onChange=${e => setStartDate(e.target.value)}
                        InputLabelProps=${{ shrink: true }} sx=${{ minWidth: 180 }}
                      />
                    `}
                  <//>
                <//>

                <!-- Ende -->
                <${Grid} item xs=${12}>
                  <${FieldLabel}>Ende<//>
                  <${Stack} direction="row" spacing=${1.5} alignItems="center" flexWrap="wrap">
                    <${ToggleButtonGroup}
                      value=${endMode} exclusive size="small"
                      onChange=${(_, v) => v && setEndMode(v)}
                    >
                      <${ToggleButton} value="date"     sx=${{ px: 2, py: 0.5, fontSize: '12px', fontWeight: 700 }}>Enddatum<//>
                      <${ToggleButton} value="duration" sx=${{ px: 2, py: 0.5, fontSize: '12px', fontWeight: 700 }}>Dauer<//>
                    <//>

                    ${endMode === 'date' && html`
                      <${TextField}
                        label="Enddatum" type="date" size="small"
                        value=${endDate} onChange=${e => setEndDate(e.target.value)}
                        InputLabelProps=${{ shrink: true }} sx=${{ minWidth: 180 }}
                      />
                    `}
                    ${endMode === 'duration' && html`
                      <${Stack} direction="row" alignItems="center" spacing=${1.25}>
                        <${TextField}
                          label="Dauer (Monate)" type="number" size="small"
                          value=${duration} onChange=${e => setDuration(e.target.value)}
                          inputProps=${{ min: 1, max: 60 }} sx=${{ width: 165 }}
                        />
                        ${computedEnd
                          ? html`
                            <${Box} sx=${{ bgcolor: '#E8F5E9', color: '#2E7D32', px: 1.5, py: 0.625, borderRadius: 1, fontSize: '13px', fontWeight: 500 }}>
                              → Ende ca. <strong>${computedEnd}</strong>
                            <//>
                          `
                          : html`
                            <${Typography} variant="caption" color="text.disabled" sx=${{ fontStyle: 'italic' }}>
                              Enddatum wird automatisch berechnet
                            <//>
                          `
                        }
                      <//>
                    `}
                  <//>
                <//>

                <!-- Weitere Felder -->
                <${Grid} item xs=${4}>
                  <${TextField} label="Auslastung" select fullWidth size="small" defaultValue="100">
                    ${['100','75','50','25'].map(v => html`<${MenuItem} key=${v} value=${v}>${v} %<//>`) }
                  <//>
                <//>
                <${Grid} item xs=${4}>
                  <${TextField} label="Reaktionsdeadline" type="date" fullWidth size="small" InputLabelProps=${{ shrink: true }} />
                <//>
                <${Grid} item xs=${4}>
                  <${TextField} label="Positionen (Slots)" type="number" fullWidth size="small" defaultValue="1" inputProps=${{ min: 1 }} />
                <//>
                <${Grid} item xs=${4}>
                  <${TextField} label="Level" select fullWidth size="small" defaultValue="">
                    ${['Junior','Consultant','Senior Consultant','Principal','Manager'].map(v => html`<${MenuItem} key=${v} value=${v}>${v}<//>`) }
                  <//>
                <//>
              <//>
            <//>

            <!-- ── Anforderungen ── -->
            <${SectionCard} title="Anforderungen">
              <${Grid} container spacing=${2}>
                <${Grid} item xs=${6}>
                  <${TextField} label="Region" select fullWidth size="small" defaultValue="">
                    ${REGIONEN.map(v => html`<${MenuItem} key=${v} value=${v}>${v}<//>`) }
                  <//>
                <//>
                <${Grid} item xs=${6}>
                  <${TextField} label="Remote-Anteil" select fullWidth size="small" defaultValue="25">
                    ${['0','25','50','75','100'].map(v => html`<${MenuItem} key=${v} value=${v}>${v} %<//>`) }
                  <//>
                <//>
                <${Grid} item xs=${12}>
                  <${Autocomplete}
                    multiple freeSolo
                    value=${customerSystems}
                    onChange=${(_, val) => setCustomerSystems(val)}
                    options=${SYSTEM_CATALOG}
                    size="small"
                    fullWidth
                    renderTags=${(val, getTagProps) => val.map((option, i) => html`
                      <${Chip} key=${option} label=${option} size="small" ...${getTagProps({ index: i })} />
                    `)}
                    renderInput=${params => html`
                      <${TextField} ...${params}
                        label="Kundensysteme / Legacy-Systeme (optional)"
                        helperText="Kundenspezifische Altsysteme und Tools — fließen in die Domain-Fit-Berechnung ein (z. B. OSPlus, Avaloq, SAP FSCM)"
                      />
                    `}
                  />
                <//>
              <//>
            </${SectionCard}>

            <!-- ── Actions ── -->
            <${Paper} variant="outlined" sx=${{ px: 3, py: 2, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <${Typography} variant="caption" color="text.secondary">* Pflichtfelder<//>
              <${Stack} direction="row" spacing=${1}>
                <${Button} variant="text" color="inherit">Entwurf speichern<//>
                <${Button} variant="contained">Matches finden<//>
              <//>
            <//>

          <//>
        <//>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
