  /* ── Filter (Logik gespiegelt aus filter-team-tree.ts) ──────────────────────────── */
  function matchesMember(m, f) {
    if (f.status && m.status !== f.status) return false;
    if (f.search && !m.name.toLowerCase().includes(f.search.toLowerCase())) return false;
    if (f.region && !(m.region ?? '').toLowerCase().includes(f.region.toLowerCase())) return false;
    if (f.mobility && m.mobility < f.mobility) return false;
    return true;
  }
  function filterNode(node, f) {
    const directMembers = node.directMembers.filter(m => matchesMember(m, f));
    const children = node.children.map(c => filterNode(c, f)).filter(Boolean);
    if (directMembers.length === 0 && children.length === 0) return null;
    return { ...node, directMembers, children };
  }
  function filterTree(nodes, f) {
    return nodes.map(n => filterNode(n, f)).filter(Boolean);
  }
  function subtreeCount(node) {
    return node.directMembers.length + node.children.reduce((s, c) => s + subtreeCount(c), 0);
  }
  function hasActiveFilters(f) {
    return !!(f.status || f.search || f.region || f.mobility);
  }

  /* ── FilterBar (identisch zu heute) ──────────────────────────────────────────────── */
  function FilterBar({ f, setF }) {

  function GroupNodeLegacy({ node, depth, onOpen }) {

      <${Accordion} disableGutters elevation=${0} defaultExpanded sx=${{ ml: depth * 2, '&:before': { display: 'none' } }}>

          ${isEmpty && html`<${Typography} color="text.secondary">Keine Mitarbeitenden in dieser Gruppe.<//>`}

              ${sorted.map(m => html`<${MemberRowLegacy} key=${m.id} m=${m} onOpen=${() => onOpen(m)} />`)}
            <//>
          `}
          ${node.children.map(c => html`<${GroupNodeLegacy} key=${c.code} node=${c} depth=${depth + 1} onOpen=${onOpen} />`)}
        <//>
      <//>
    `;
  }

  function GroupSectionNew({ node, depth, collapsed, onToggle, onOpen }) {

            borderLeft: '4px solid', borderColor: depth0 ? 'primary.main' : '#B0BEC5',
            mb: 1
          }}
        >
          <${Box} sx=${{ fontSize: 13, color: 'text.secondary', transform: isCollapsed ? 'rotate(-90deg)' : 'none', transition: 'transform 0.15s' }}>▾<//>

            <//>

          ${node.leaderNames.length > 0 && html`

          <${Box} sx=${{

            borderRadius: '10px', fontSize: '12px', fontWeight: 700
          }}>
            ${subtreeCount(node)} Mitarbeitende
          <//>
        <//>
        ${!isCollapsed && html`
          <${Box} sx=${{ pl: depth0 ? 1 : 0 }}>
            ${isEmpty && html`
              <${Typography} color="text.secondary" sx=${{ fontStyle: 'italic', mb: 1.5 }}>

              <//>

            ${node.directMembers.length > 0 && html`<${MemberTableNew} members=${node.directMembers} onOpen=${onOpen} />`}
            ${node.children.map(c => html`
              <${GroupSectionNew} key=${c.code} node=${c} depth=${depth + 1} collapsed=${collapsed} onToggle=${onToggle} onOpen=${onOpen} />
            `)}
          <//>
        `}
      <//>
    `;
  }

  function NewView({ tree, onOpen }) {
    const [collapsed, setCollapsed] = useState(new Set());
    const toggle = (code) => setCollapsed(prev => {
      const next = new Set(prev);
      next.has(code) ? next.delete(code) : next.add(code);
      return next;
    });
    return html`
      <${Box}>
        ${tree.map(n => html`<${GroupSectionNew} key=${n.code} node=${n} depth=${0} collapsed=${collapsed} onToggle=${toggle} onOpen=${onOpen} />`)}
      <//>
    `;
  }

  function MockupBar({ mode, setMode }) {
    return html`
      <${Paper} square elevation=${0} sx=${{
        position: 'sticky', top: 0, zIndex: 1100,
        borderBottom: '1px solid', borderColor: 'divider',
        px: 4, py: 1.25, display: 'flex', alignItems: 'center', justifyContent: 'space-between'
      }}>
        <${Typography} variant="overline" color="text.secondary">
          Mockup · <${Box} component="span" sx=${{ color: 'primary.main' }}>Team — Übersicht, Redesign (#651)<//>
        <//>
        <${Stack} direction="row" spacing=${1} alignItems="center">
          <${Typography} variant="caption" color="text.secondary">Ansicht:<//>
          ${[['old', 'Aktuell (Tree)'], ['new', 'Vorschlag (Neu)']].map(([key, label]) => html`
            <${Button} key=${key} size="small"
              variant=${mode === key ? 'contained' : 'outlined'}
              onClick=${() => setMode(key)}
              sx=${{ fontSize: '11px', py: 0.25, minWidth: 0, px: 1.25 }}>
              ${label}
            <//>
          `)}
          <${Box} sx=${{ ml: 1, borderLeft: '1px solid', borderColor: 'divider', pl: 1.5 }}>
            <${Button} component="a" href="../index.html" size="small">← Katalog<//>
          <//>
        <//>
      <//>
    `;
  }

  /* ── App ─────────────────────────────────────────────────────────────────────── */
  function App() {
    const [mode, setMode] = useState('new');
    const [f, setF] = useState({ search: '', status: '', region: '', mobility: '' });
    const [openEmployee, setOpenEmployee] = useState(null);

    const tree = useMemo(() => filterTree(TREE, f), [f]);
    const noMatches = tree.length === 0 && hasActiveFilters(f);

    return html`
      <${ThemeProvider} theme=${theme}>
        <${CssBaseline} />
        <${MockupBar} mode=${mode} setMode=${setMode} />

        <${Container} maxWidth="xl" sx=${{ py: 4, px: { xs: 2, md: 4 } }}>
          <${Typography} variant="h5" sx=${{ mb: 2 }}>Mitarbeiterverwaltung<//>

          <${FilterBar} f=${f} setF=${setF} />

          <${Tabs} value=${0} sx=${{ mt: 2.5, borderBottom: 1, borderColor: 'divider' }}>
            <${Tab} label="Übersicht" />
            <${Tab} label="Kalenderansicht" disabled />
          <//>
          <${Typography} variant="caption" color="text.secondary" sx=${{ display: 'block', mb: 1.5 }}>
            Kalenderansicht ist unverändert – siehe bestehendes Mitarbeiterverwaltung-Mockup.
          <//>

          <${Alert} severity="info" sx=${{ mb: 2.5 }}>
            Beide Ansichten zeigen dieselben Daten. „Aktuell" bildet die produktive Tree-Ansicht nach
            (verschachtelte Accordions, reine Statuspunkte, Spalten ohne Kopfzeile). „Vorschlag" ersetzt
            das durch gruppierte Tabellen mit echten Spaltenüberschriften und beschrifteten Status-Badges —
            die Gruppierung nach Organisationseinheit bleibt erhalten, ist aber nicht mehr tief verschachtelt
            durchzuklicken, um die Spaltenbedeutung zu erschließen.
          <//>

          ${noMatches ? html`
            <${Paper} variant="outlined" sx=${{ p: 6, textAlign: 'center' }}>
              <${Typography} variant="h6" gutterBottom>Keine Treffer<//>
              <${Typography} color="text.secondary" sx=${{ mb: 3 }}>
                Keine Mitarbeitenden entsprechen den aktuellen Filtern.
              <//>
              <${Button} variant="outlined" onClick=${() => setF({ search: '', status: '', region: '', mobility: '' })}>
                Filter zurücksetzen
              <//>
            <//>
          ` : mode === 'old' ? html`
            <${LegacyView} tree=${tree} onOpen=${setOpenEmployee} />
          ` : html`
            <${NewView} tree=${tree} onOpen=${setOpenEmployee} />
          `}
        <//>

        <${EmployeePlaceholder} employee=${openEmployee} onClose=${() => setOpenEmployee(null)} />
      <//>
    `;
  }

  createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
