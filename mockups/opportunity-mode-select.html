<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportunity-Modus wählen — Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style> * { box-sizing: border-box; } body { margin: 0; } </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
  <script src="https://unpkg.com/htm/dist/htm.umd.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const { createElement: h, useState } = React;
    const { createRoot } = ReactDOM;
    const { Box, Typography, Button, Paper, Container, Stack, ThemeProvider, createTheme, CssBaseline } = MaterialUI;

    const html = htm.bind(h);

    const theme = createTheme({
      palette: { primary: { main: '#1976D2' } },
      components: {
        MuiButton:    { defaultProps: { disableElevation: true } },
        MuiPaper:     { defaultProps: { elevation: 0 } },
      },
    });

    function MockupBar({ title }) {
      return html`
        <${Paper} square sx=${{
          position: 'sticky', top: 0, zIndex: 1100,
          borderBottom: '1px solid', borderColor: 'divider',
          px: 4, py: 1.25,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <${Typography} variant="overline" color="text.secondary" sx=${{ letterSpacing: 1 }}>
            Mockup · <${Box} component="span" sx=${{ color: 'primary.main' }}>${title}<//>
          <//>
          <${Button} component="a" href="../index.html" size="small">← Katalog<//>
        <//>
      `;
    }

    const MODES = [
      {
        id: 'manual',
        title: 'Manuell erfassen',
        desc: 'Alle Felder selbst ausfüllen — Projektdaten, Skills und Anforderungen.',
      },
      {
        id: 'import',
        title: 'Aus Dokument importieren',
        desc: 'PDF oder Text hochladen — relevante Felder werden automatisch vorausgefüllt.',
      },
    ];

    function App() {
      const [selected, setSelected] = useState('manual');

      return html`
        <${ThemeProvider} theme=${theme}>
          <${CssBaseline} />
          <${MockupBar} title="Opportunity-Modus wählen" />
          <${Container} maxWidth="sm" sx=${{ py: 6 }}>

            <${Typography} variant="h6" fontWeight=${700} gutterBottom>
              Neue Opportunity anlegen
            <//>
            <${Typography} variant="body2" color="text.secondary" sx=${{ mb: 4 }}>
              Wie möchtest du die Daten erfassen?
            <//>

            <${Stack} spacing=${2} sx=${{ mb: 3 }}>
              ${MODES.map(mode => html`
                <${Paper}
                  key=${mode.id}
                  variant="outlined"
                  onClick=${() => setSelected(mode.id)}
                  sx=${{
                    p: 3, cursor: 'pointer', position: 'relative',
                    borderWidth: selected === mode.id ? 2 : 1,
                    borderColor: selected === mode.id ? 'primary.main' : 'divider',
                    bgcolor: selected === mode.id ? '#FAFCFF' : 'background.paper',
                    transition: 'border-color 0.15s',
                    '&:hover': { borderColor: 'primary.light' },
                  }}
                >
                  <${Box} sx=${{
                    position: 'absolute', top: 16, right: 16,
                    width: 16, height: 16, borderRadius: '50%',
                    bgcolor: selected === mode.id ? 'primary.main' : 'transparent',
                    border: '2px solid',
                    borderColor: selected === mode.id ? 'primary.main' : 'divider',
                  }} />
                  <${Typography} variant="subtitle2" fontWeight=${700} sx=${{ mb: 0.5, pr: 3 }}>
                    ${mode.title}
                  <//>
                  <${Typography} variant="body2" color="text.secondary">
                    ${mode.desc}
                  <//>
                <//>
              `)}
            <//>

            <${Stack} direction="row" justifyContent="flex-end" spacing=${1}>
              <${Button} variant="outlined" color="inherit">Abbrechen<//>
              <${Button} variant="contained">Weiter<//>
            <//>

          <//>
        <//>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
